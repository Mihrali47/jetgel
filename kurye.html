<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetgel · Kurye</title>
<meta name="theme-color" content="#16351f">
<link rel="manifest" href="manifest-kurye.webmanifest">
<link rel="icon" href="ikonlar/ikon-192.png">
<link rel="apple-touch-icon" href="ikonlar/ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jetgel Kurye">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/panel.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/core.js"></script>
<script src="app/ikon.js"></script>
</head>
<body class="p">
<div class="wrap">
  <div id="khead"></div>
  <div id="navbox"></div>
  <div id="map" class="map tall hidden"></div>
  <div id="panel"></div>
</div>
<div id="ptabs"></div>
<div id="call"></div>
<script>
const {DB} = J;
let cid = J.store.get('kurye_id', null);
let locMode = J.store.get('kurye_konum2', 'gps');   // 'gps' | 'demo'. Varsayılan her zaman telefonun gerçek konumu; sahte sürüş yalnızca test için elle seçilir
let pos = J.store.get('kurye_pos', {lat:40.98880, lng:29.02830});
let gpsWatch = null, gpsErr = '', gpsAcc = null;
let route = null, routeKey = '', routeAt = 0, routing = false, prog = 0;
let pin = '', pinErr = '';
let map = null, tab = 'gorev';
const today = t => new Date(t).toDateString() === new Date().toDateString();
const me = () => cid ? {type:'kurye', id:cid} : null;
const cour = () => cid && DB.get('couriers', cid);
const notifOk = () => ['granted','unsupported'].includes(J.notifPermission());
const myJob = () => cid ? J.orders().find(o => o.state==='aktif' && o.courier_id===cid) : null;
const myOffer = () => cid ? J.orders().find(o => o.state==='aktif' && !o.courier_id && o.offer && o.offer.cid===cid && o.offer.exp > J.now()) : null;

function ensureMap(){ if(!map) map = J.Map(document.getElementById('map')); }
function showMap(on){ document.getElementById('map').classList.toggle('hidden', !on); if(on){ ensureMap(); setTimeout(() => map.invalidate(), 30); } }

/* ---------- Konum ---------- */
function startGps(){
  if(gpsWatch != null || !navigator.geolocation) { if(!navigator.geolocation) gpsErr = 'Bu tarayıcı konum desteklemiyor.'; return; }
  gpsErr = 'Konum bekleniyor…';
  gpsWatch = navigator.geolocation.watchPosition(p => {
    pos = {lat:p.coords.latitude, lng:p.coords.longitude}; gpsAcc = Math.round(p.coords.accuracy); gpsErr = '';
    J.store.set('kurye_pos', pos); J.autoRelocate(pos); sendPos();
  }, err => { gpsErr = 'Konum alınamadı: ' + (err.code===1 ? 'izin verilmedi. Adres çubuğundaki kilit simgesinden konuma izin verin.' : err.message); render(); },
  {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
}
// Android uygulamasında konum yerel servisten gelir (ekran kilitliyken de)
function nativeServis(){
  const c = cour(); if(!J.native || !c) return;
  const on = !!(c.online || myJob());
  J.nativeService(on, {baslik:'Jetgel Kurye · çevrimiçi', metin: locMode==='gps' ? 'Konum paylaşılıyor · teklifler ve aramalar için hazır' : 'Teklifler ve aramalar için hazır', konum: locMode==='gps'});
}
if(J.native){
  try{ J.native.addListener('location', l => { if(locMode !== 'gps' || !l) return; pos = {lat:l.lat, lng:l.lng}; gpsAcc = l.acc ? Math.round(l.acc) : gpsAcc; gpsErr = ''; J.store.set('kurye_pos', pos); J.autoRelocate(pos); sendPos(); }); }catch(e){}
}
// Konumu paylaş: hareket varsa saniyede bir, duruyorsa 20 sn'de bir sinyal
function sendPos(){
  const c = cour(); if(!c || !pos) return;
  const o = myJob(), t = J.now();
  if(!(c.online || o)) return;
  const moved = !lastSent || J.dist(pos, lastSent) > 3;
  if(t - lastBeat < (moved ? 1000 : 20000)) return;
  lastBeat = t; lastSent = Object.assign({}, pos);
  DB.patch('couriers', c.id, {lat:pos.lat, lng:pos.lng, seen_at:t, pos_t:t});
  J.store.set('kurye_pos', pos);
}
function stopGps(){ if(gpsWatch != null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; } }
function target(o){
  if(!o) return null;
  if(o.del==='isletmeye' || o.del==='isletmede'){ const b = DB.get('businesses', o.rid); return b ? {lat:b.lat, lng:b.lng, kind:'isletme', label:b.name} : null; }
  if(o.del==='yolda' || o.del==='kapida') return {lat:o.customer.lat, lng:o.customer.lng, kind:'musteri', label:o.customer.name};
  return null;
}
async function ensureRoute(o){
  const tg = target(o);
  if(!tg){ route = null; routeKey = ''; return; }
  const key = o.id + ':' + tg.kind;
  const t = J.now();
  let need = key !== routeKey;
  if(!need && locMode==='gps' && route && t - routeAt > 15000){ const ns = J.navState(route, pos); if(ns && ns.off > 70) need = true; }
  if(!need || routing) return;
  routing = true; routeKey = key;
  const r = await J.fetchRoute(pos, tg);
  routing = false;
  if(routeKey !== key) return;
  route = r; routeAt = J.now(); prog = 0;
  render();
}

/* ---------- Ekranlar ---------- */
let loginErr = '', regErr = '', showReg = false;
function renderProfile(){
  const top = `<div class="p-login"><div class="logo">Jet<span>gel</span> Kurye</div><div class="small muted">Teslimat başına sabit ${J.tl(J.FEE.courier)}, ceza puanı yok.</div></div><div class="p-body">`;
  if(showReg) return top + `<div class="card"><h3>Kurye başvurusu</h3><div class="small muted">Başvurun yönetim tarafından incelenir; kimlik, ehliyet ve araç belgelerin kontrol edildikten sonra hesabın açılır.</div>
    <label class="f" for="r-name">Adın</label><input id="r-name" placeholder="Örn. Ali">
    <label class="f" for="r-user">Kullanıcı adı</label><input id="r-user" autocapitalize="none">
    <label class="f" for="r-pass">Şifre</label><input id="r-pass" type="password">
    <div class="note">Prototip: şifreler güvenli saklanmıyor, gerçek şifreni kullanma.</div>
    ${regErr?`<div class="small" style="color:var(--bad);margin-top:8px">${J.esc(regErr)}</div>`:''}
    <button class="brand wide" style="margin-top:12px" data-a="create">Başvur</button><div class="tiny muted" style="text-align:center;margin-top:8px">Devam ederek <a href="yasal.html#sartlar" target="_blank">kullanım koşullarını</a> ve <a href="yasal.html#kvkk" target="_blank">aydınlatma metnini</a> kabul etmiş olursun.</div><button class="ghost wide" data-a="show-login">‹ Girişe dön</button></div></div>`;
  return top + J.loginForm({title:'Kurye girişi', sub:'', ph:'1test', hint:'1test … 9test', err:loginErr}) + `<button class="ghost wide" data-a="show-reg">Kurye olmak mı istiyorsun? Başvur</button></div>`;
}
function renderGate(){
  const p = J.notifPermission();
  return `<div class="card warn gate"><div class="ic">${J.ic('bell',40)}</div><h3>Bildirim izni zorunlu</h3><div class="small">Teslimat tekliflerini ve aramaları kaçırmaman için bildirimler açık olmalı. İzin vermeden çevrimiçi olamazsın.</div>
    ${p==='denied' ? `<div class="note" style="text-align:left"><b>Bildirimler engellenmiş.</b> Adres çubuğundaki kilit simgesine dokun → Bildirimler → İzin ver. Sonra sayfayı yenile.</div>` : `<div class="btns center"><button class="brand" data-a="notif">Bildirim izni ver</button></div>`}</div>`;
}
function navHtml(o){
  if(!o){ return ''; }
  if(routing && !route) return `<div class="nav"><div class="turn"><div class="arrow">${J.ic('compass',34)}</div><div class="t">Rota hesaplanıyor…</div></div></div>`;
  if(!route || !['isletmeye','yolda'].includes(o.del)) return '';
  const ns = J.navState(route, pos, locMode==='demo' ? prog : null);
  return `<div class="nav"><div class="turn"><div class="arrow">${J.ic(ns.step.arrow, 36)}</div><div><div class="d">${ns.step.type==='arrive' && ns.inM<20 ? 'Vardın' : J.fmtDist(ns.inM)}</div><div class="t">${J.esc(ns.step.text)}</div></div></div><div class="meta"><span>Kalan <b>${J.fmtDist(ns.remain)}</b></span><span>~<b>${ns.etaMin}</b> dk</span><span>${route.source==='osrm'?'Gerçek yol rotası':'Düz çizgi (yedek)'}</span></div></div>`;
}
function header(c){
  const o = myJob(), jobs = c.jobs||[];
  const td = jobs.filter(j => j.t ? today(j.t) : false);
  const tdSum = td.reduce((s,j) => s + (j.amount||0), 0);
  return `<div class="p-head"><div class="r1"><div class="av">${J.ic('bike',24)}</div><div class="tx"><div class="nm">${J.esc(c.name)}</div><div class="sb">${o?'Teslimatta':c.online?'Çevrimiçi':'Çevrimdışı'} ${J.modeBadge()}</div></div>
    <button class="p-sw ${c.online?'on':''}" data-a="online" ${(!notifOk()||o)?'disabled':''}><span class="k"></span>${c.online?'Açık':'Kapalı'}</button></div>
    <div class="p-stats"><div><b>${J.tl(tdSum)}</b><span>Bugün kazanç</span></div><div><b>${td.length}</b><span>Bugün teslimat</span></div><div><b>${J.tl(c.earnings||0)}</b><span>Toplam</span></div></div></div>`;
}
let inc = false;   // sorun bildirme penceresi açık mı
function incidentBox(o){
  if(o.incident && !o.incident.resolved) return `<div class="card warn small">${J.ic('triangle-alert',15)} <b>${J.esc(J.INCIDENTS[o.incident.kind])}</b> bildirdin. Destek ekibi durumu takip ediyor${o.incident.kind==='kaza' ? '; acil yardım gerekiyorsa önce <a href="tel:112">112</a>\'yi ara' : ''}.</div>`;
  if(!inc) return `<button class="p-sos" data-a="inc-open">${J.ic('triangle-alert',15)} Sorun bildir</button>`;
  return `<div class="p-rj"><b>Ne oldu?</b><div class="tiny muted">Destek ekibine anında iletilir. Paketi henüz almadıysan kaza, arıza ve güvenlik durumlarında sipariş başka kuryeye aktarılır.</div>
    <div class="p-chips">${Object.entries(J.INCIDENTS).map(([k,t]) => `<button data-a="inc" data-id="${k}">${J.esc(t)}</button>`).join('')}</div>
    <div class="tiny" style="margin-top:8px">Yaralanma varsa önce <a href="tel:112"><b>112</b></a>'yi ara.</div><button class="sec wide" style="margin-top:8px" data-a="inc-close">Vazgeç</button></div>`;
}
function tabTask(c){
  const offer = myOffer(), o = myJob();
  let h = '';
  if(locMode === 'gps' && gpsErr && (c.online || o)) h += `<div class="card bad small">${J.ic('locate-fixed',15)} <b>Konumun alınamıyor.</b> ${J.esc(gpsErr)} Telefonun konum servisini açık tut; konum gelmeden müşteri seni haritada göremez.</div>`;
  if(locMode === 'demo') h += `<div class="card warn small">${J.ic('triangle-alert',15)} <b>Test sürüşü açık:</b> haritadaki konumun sahte. Gerçek teslimat için Hesap > Konum'dan "Gerçek GPS"i seç.</div>`;
  if(offer){
    const b = DB.get('businesses', offer.rid);
    h += `<div class="p-offer"><div class="top2"><span>${J.ic('bell',17)} Yeni teslimat teklifi</span><span class="cd" data-live="down" data-end="${offer.offer.exp}">…</span></div><div class="amt">${J.tl(J.FEE.courier + (offer.tip||0) + (offer.prio_fee||0))}</div><div class="small" style="opacity:.9">${[`Sabit ${J.tl(J.FEE.courier)}`].concat(offer.priority?[`hızlı teslimat +${J.tl(offer.prio_fee)}`]:[]).concat(offer.tip?[`bahşiş +${J.tl(offer.tip)}`]:[]).join(' · ')}${offer.priority?'<div style="margin-top:6px;font-weight:800">Hızlı teslimat: lütfen öncelik ver</div>':''}</div>
      <div class="leg">${J.ic('store',17)}<span>Alış: <b>${J.esc(offer.rname)}</b></span><b>${J.fmtDist(J.dist(pos,b))}</b></div><div class="leg">${J.ic('house',17)}<span>Teslim: <b>${J.esc(offer.customer.name)}</b></span><b>${J.fmtDist(J.dist(b,offer.customer))}</b></div>
      ${(() => { const e = J.tripEstimate(pos, offer); return e ? `<div class="trip">${J.ic('clock',15)} <span>Toplam yaklaşık <b>${e.total} dk</b> · ${e.km.toFixed(1).replace('.',',')} km</span><span class="tiny">${e.toB} dk varış${e.wait ? ` + ${e.wait} dk bekleme` : ''} + ${e.ride} dk teslim</span></div>` : ''; })()}
      <div class="acts"><button class="ok" data-a="accept">Kabul et</button><button class="sec" data-a="decline">Reddet</button></div><small>Reddetmenin cezası yok. 30 sn içinde kabul etmezsen teklif sıradaki kuryeye geçer.</small></div>`;
    J.notify('teklif-'+offer.id, 'Yeni teslimat teklifi', `${offer.rname} → ${J.tl(J.FEE.courier + (offer.tip||0) + (offer.prio_fee||0))}${offer.priority?' · hızlı':''}`);
  }
  J.alarm('teklif', !!offer, 'order', 2500);
  if(o){
    const b = DB.get('businesses', o.rid), tg = target(o);
    const done = [o.del!=='isletmeye', ['yolda','kapida'].includes(o.del), o.del==='kapida', false];
    const now = done.indexOf(false);
    const toBiz = o.del==='isletmeye'||o.del==='isletmede';
    h += `<div class="p-card"><div class="row"><b style="font-size:16px">Teslimat #${J.esc(o.no)}</b><span class="pill ok">${J.tl(J.FEE.courier + (o.tip||0) + (o.prio_fee||0))}${o.priority?' · hızlı':''}${o.tip?' · bahşişli':''}</span></div>
      <div class="p-steps">${['İşletmeye git','Paketi al','Müşteriye git','Kodla teslim'].map((t,i) => `<div class="${done[i]?'done':i===now?'now':''}">${t}</div>`).join('')}</div>
      <div class="p-dest"><div class="av">${toBiz?J.bizIcon(b,22):J.ic('house',22)}</div><div class="tx"><b>${toBiz?J.esc(o.rname):J.esc(o.customer.name)}</b><span>${toBiz?'Paketi alacağın yer':J.esc(o.customer.note||'Teslimat adresi')} · ${J.fmtDist(J.dist(pos, tg||b))}</span></div><button class="p-ic" data-a="call" data-to="${toBiz?'isletme':'musteri'}" aria-label="Ara">${J.ic('phone',17)}</button></div>
      ${tg?`<div class="btns"><a class="btnlink" href="${J.gmaps(tg)}" target="_blank" rel="noopener">${J.ic('navigation',15)} Google Haritalar'da aç</a><button class="sm sec" data-a="call" data-to="${toBiz?'musteri':'isletme'}">${J.ic('phone',15)} ${toBiz?'Müşteri':'İşletme'}</button></div>`:''}`;
    h += incidentBox(o);
    if(o.del==='isletmeye') h += `<div class="note">İşletmeye gidiyorsun. ${J.ARRIVE_M} m yaklaşınca varış kendiliğinden kaydedilir.</div>`;
    if(o.del==='isletmede') h += o.prep==='hazir'
      ? `<button class="ok p-big" data-a="pickup">${J.ic('package',18)} Paketi aldım (fiş kontrol edildi)</button>`
      : `<div class="p-timer"><span>${J.ic('hourglass',16)} Sipariş hazırlanıyor</span><span>${o.prep_until?`<b data-live="mdown" data-end="${o.prep_until}">…</b> dk`:''}</span></div><div class="tiny muted" style="margin-top:6px">İşletme "hazır" deyince buton açılır.</div>`;
    if(o.del==='yolda') h += `<div class="note">Müşteriye gidiyorsun. Adrese ${J.ARRIVE_M} m yaklaşınca kapıda olduğun kaydedilir.</div>`;
    if(o.del==='kapida'){
      const called = J.calls().some(k => k.order_id===o.id && k.from.type==='kurye' && k.from.id===cid && k.start >= (o.arrived_at||0));
      const waitEnd = (o.arrived_at||J.now()) + J.D(J.WAIT_MS);
      h += `<div style="margin-top:14px"><b>Müşteriden 4 haneli kodu iste</b></div><input id="pin" class="p-pin" inputmode="numeric" maxlength="4" placeholder="••••" value="${J.esc(pin)}" style="margin-top:8px">
        ${pinErr?`<div class="small" style="color:var(--bad);margin-top:6px">${J.esc(pinErr)}</div>`:''}
        <button class="ok p-big" data-a="pin">${J.ic('circle-check',18)} Kodu onayla ve teslim et</button>
        <div class="btns"><label class="btnlink" style="cursor:pointer">${J.ic('camera',15)} Teslimat fotoğrafı${o.photo?' ✓':''}<input type="file" accept="image/*" capture="environment" id="photo" style="display:none"></label></div>
        <div class="card soft small" style="margin-top:12px"><b>Müşteri kapıyı açmıyor mu?</b><div class="muted">Önce uygulamadan ara${called?' ✓':''}, sonra bekle (<span data-live="mmss" data-end="${waitEnd}">…</span> kaldı). Konumun kayıtlı; ücretini her durumda alırsın.</div><div class="btns"><button class="sm bad" data-a="unreach" data-end="${waitEnd}" ${called?'':'disabled'}>Müşteriye ulaşılamadı</button></div></div>`;
    }
    h += `<div style="margin-top:12px">${J.msgBox(o, 'kurye', 'qm')}</div>`;
    J.msgNotify(o, 'kurye');
    h += `</div>`;
  }
  if(!o && !offer) h += c.online
    ? `<div class="p-card p-wait"><div class="rd">${J.ic('radio',34)}</div><b>Teklif bekleniyor</b><div class="small muted">Haritadaki turuncu daireler son 2 saatte sipariş çıkan dükkânlar; daire büyüdükçe yoğunluk artar. Oralara yakın durursan teklif gelme ihtimalin artar.</div></div>`
    : `<div class="p-card p-off"><div class="rd">${J.ic('moon',34)}</div><b>Çevrimdışısın</b><div class="small muted">Teklif almak için yukarıdaki anahtarı aç.</div>${notifOk()?`<button class="ok p-big" data-a="online">Çevrimiçi ol</button>`:''}</div>`;
  if(locMode==='gps' && gpsErr) h += `<div class="card warn small">${J.ic('locate-fixed',15)} ${J.esc(gpsErr)}</div>`;
  return h;
}
function tabEarn(c){
  const jobs = c.jobs||[];
  let h = `<div class="p-card" style="background:linear-gradient(135deg,#1f9d55,#2b8a3e);color:#fff"><div class="small" style="opacity:.85">Toplam kazancın</div><div style="font-size:32px;font-weight:900">${J.tl(c.earnings||0)}</div><div class="small" style="opacity:.85">${jobs.length} teslimat · teslimat başına sabit ${J.tl(J.FEE.courier)}</div></div>
    ${(() => { const rt = J.ratingOf(c); return `<div class="p-card"><div class="row"><span>Müşteri puanın</span>${rt.n?`<b style="font-size:20px">${J.ic('star',16,'fill')} ${J.fmtRating(rt.avg)} <span class="tiny muted">(${rt.n})</span></b>`:'<span class="small muted">Henüz yok</span>'}</div><div class="tiny muted" style="margin-top:4px">Puan cezaya dönüşmez; sadece sana geri bildirimdir.</div></div>`; })()}
    <div class="p-card small"><div class="row"><span>Ödeme</span><b>Gerçek sistemde günlük</b></div><div class="row"><span>Bahşiş</span><b>Tamamı senin</b></div><div class="row"><span>Ceza puanı</span><b>Yok</b></div><div class="row"><span>Teklif reddetme</span><b>Cezasız</b></div><div class="row"><span>Müşteri kapıyı açmazsa</span><b>Ücretini yine alırsın</b></div></div>`;
  h += `<div class="p-sec">Son teslimatlar<span class="n">${jobs.length}</span></div>`;
  if(!jobs.length) h += `<div class="p-empty"><div>${J.ic('receipt',34)}</div>Henüz teslimat yok.</div>`;
  jobs.slice(0,20).forEach(j => h += `<div class="p-mini"><span>#${J.esc(j.no)} · ${J.esc(j.rname)}${j.t?` <span class="tiny muted">${new Date(j.t).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>`:''}</span><b style="color:var(--ok)">+${J.tl(j.amount)}${j.tip?`<span class="tiny" style="display:block;font-weight:600">${J.tl(j.tip)} bahşiş</span>`:''}</b></div>`);
  return h;
}
function tabAccount(c){
  return `${c.online ? J.batteryCard() : ''}<div class="p-card"><h3>Konum</h3><div class="p-grid2"><button class="${locMode==='gps'?'ok':'sec'}" data-a="loc" data-id="gps">${J.ic('locate-fixed',16)} Gerçek GPS</button><button class="${locMode==='demo'?'warn':'sec'}" data-a="loc" data-id="demo">${J.ic('gamepad-2',16)} Test sürüşü (sahte)</button></div>
    <div class="tiny muted" style="margin-top:8px">${locMode==='gps' ? (gpsErr ? J.esc(gpsErr) : `Telefonunun konumu kullanılıyor${gpsAcc?` (±${gpsAcc} m)`:''}. Hedefe yaklaşınca durum kendiliğinden güncellenir.`) : 'Demo sürüş: masa başında denemek için kurye rotada kendiliğinden ilerler.'}</div></div>
    <div class="p-card small"><h3>Hesap</h3><div class="row"><span>Kullanıcı adı</span><b>${J.esc(c.login ? c.login.user : '')}</b></div><div class="row"><span>Bildirimler</span><b>${notifOk()?'Açık':'Kapalı'}</b></div><button class="sec wide" style="margin-top:12px" data-a="logout" ${myJob()?'disabled':''}>Çıkış yap</button>${myJob()?'<div class="tiny muted" style="margin-top:6px">Aktif teslimat bitmeden çıkış yapılamaz.</div>':''}</div>`;
}
function renderMain(){
  const c = cour();
  if(!c){ cid = null; J.store.set('kurye_id', null); return renderProfile(); }
  let h = `<div class="p-body">`;
  if(c.approved === false){ return h + `<div class="p-empty" style="margin-top:30px">${c.rejected ? `${J.ic('ban',34)}<b>Başvurun onaylanmadı</b><div class="small">${J.esc(c.reject_reason || 'Ayrıntı için bizimle iletişime geç.')}</div>` : `${J.ic('hourglass',34)}<b>Başvurun inceleniyor</b><div class="small">Hesabın yönetim tarafından onaylanınca teslimat almaya başlayabilirsin. Bu ekran onay gelince kendiliğinden açılır.</div>`}<button class="sec" style="margin-top:14px" data-a="switch">Çıkış yap</button></div></div>`; }
  if(!notifOk()) h += renderGate();
  if(myOffer() && tab !== 'gorev') tab = 'gorev';
  h += ({gorev:tabTask, kazanc:tabEarn, hesap:tabAccount}[tab] || tabTask)(c);
  if(tab !== 'gorev') J.alarm('teklif', false);
  return h + `</div>`;
}
function drawMap(){
  const o = myJob(), offer = myOffer(), c = cour();
  // Boştayken: yoğunluk haritası (son 2 saatte sipariş çıkan dükkânlar)
  if(!o && !offer && c && c.online && tab==='gorev'){
    showMap(true); if(!map.ok) return;
    map.set('ben', pos, J.ic('bike',16), 'cour me', 'Sen'); map.keep(['ben']); map.clearLine('rota');
    const pts = J.heatPoints(); const keys = [];
    pts.forEach(p => { const k = 'h'+p.b.id; keys.push(k); map.circle(k, p.b, Math.min(400, 60 + p.n*35), '#e8590c'); });
    map.keepCircles(keys);
    const hk = 'isi' + pts.length; if(map._k !== hk){ map._k = hk; map.fit([pos].concat(pts.map(p => p.b)), 16); }
    return;
  }
  if(map && map.keepCircles) map.keepCircles([]);
  // Kapıda ve işletmede harita gerekmez; kod ve buton ekranda kalsın
  const on = !!(offer || (o && ['isletmeye','yolda'].includes(o.del))) && tab==='gorev';
  showMap(on);
  if(!on || !map.ok) return;
  map.set('ben', pos, J.ic('bike',16), 'cour me', 'Sen');
  const b = DB.get('businesses', (o||offer).rid);
  if(b) map.set('biz', b, J.bizIcon(b,16), '');
  map.set('ev', (o||offer).customer, J.ic('house',16), 'home');
  if(route && o && ['isletmeye','yolda'].includes(o.del)) map.line('rota', route.pts, '#e8590c', route.source!=='osrm'); else map.clearLine('rota');
  const k = (o ? o.id+o.del : 'teklif') + (route ? route.pts.length : '');
  if(map._k !== k){ map._k = k; const tg = target(o) || b; map.fit([pos, tg]); }
  else if(o && map.map && !map.map.getBounds().pad(-0.2).contains([pos.lat,pos.lng])) map.center(pos);
}
function render(){
  const c = cid && cour(), o = myJob();
  document.getElementById('khead').innerHTML = c ? header(c) : '';
  document.getElementById('navbox').innerHTML = c && tab==='gorev' ? navHtml(o) : '';
  J.render(document.getElementById('panel'), cid ? renderMain() : renderProfile());
  drawMap();
  renderTabs();
  renderCall();
}
function renderTabs(){
  const c = cid && cour(); let h = '';
  if(c) h = `<nav class="p-tabs">${[['gorev','bike','Görev'],['kazanc','wallet','Kazanç'],['hesap','user','Hesap']].map(([k,ic,l]) => `<button class="${tab===k?'on':''}" data-a="tab" data-id="${k}"><i>${J.ic(ic,22)}</i>${l}${k==='gorev'&&(myOffer()||myJob())&&tab!=='gorev'?'<span class="bdg">!</span>':''}</button>`).join('')}</nav>`;
  const el = document.getElementById('ptabs'); if(el.innerHTML !== h) el.innerHTML = h;
}
let lastCall = '';
function renderCall(){ const m = me(); const h = m ? J.callOverlay(m) : ''; if(h !== lastCall){ document.getElementById('call').innerHTML = h; lastCall = h; } }

/* ---------- Olaylar ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, c = cour();
  if(a==='tab'){ tab = el.dataset.id; window.scrollTo(0,0); }
  if(a==='qm'){ const o = myJob(); if(o && J.sendMsg(o, 'kurye', J.QUICK_MSGS.kurye[+el.dataset.i])) J.toast('Mesaj gönderildi.'); render(); return; }
  if(a==='show-reg'){ showReg = true; regErr = ''; }
  if(a==='show-login'){ showReg = false; }
  if(a==='login'){
    const r = await J.login('couriers', document.getElementById('l-user').value, document.getElementById('l-pass').value);
    if(r.error) loginErr = r.error; else { loginErr = ''; cid = r.id; J.store.set('kurye_id', r.id); const cc = DB.get('couriers', r.id); if(cc && cc.lat) pos = {lat:cc.lat, lng:cc.lng}; if(locMode==='gps') startGps(); }
  }
  if(a==='create'){
    const name = document.getElementById('r-name').value.trim(), user = document.getElementById('r-user').value.trim(), pass = document.getElementById('r-pass').value;
    if(!name || !user || !pass){ regErr = 'Tüm alanları doldur.'; render(); return; }
    if(pass.length < 6){ regErr = 'Şifre en az 6 karakter olmalı.'; render(); return; }
    if(J.userTaken(user)){ regErr = 'Bu kullanıcı adı alınmış.'; render(); return; }
    cid = J.uid('c'); J.store.set('kurye_id', cid); showReg = false;
    DB.put('couriers', cid, {name, approved:false, applied_t:J.now(), online:false, notif_ok:false, lat:pos.lat, lng:pos.lng, busy:null, earnings:0, jobs:[], seen_at:J.now(), login: await J.makeLogin(user, pass)});
    J.log(`Yeni kurye başvurusu: ${name}. Yönetim onayı bekleniyor.`, 'warn');
  }
  if(a==='notif'){ const p = await J.askNotif(); if(p==='granted' && c) DB.patch('couriers', c.id, {notif_ok:true}); }
  if(a==='inc-open') inc = true;
  if(a==='inc-close') inc = false;
  if(a==='inc' && c){ const r = J.reportIncident(c, myJob(), el.dataset.id); inc = false; if(r==='aktarildi'){ DB.patch('couriers', c.id, {online:false}); J.toast('Bildirildi. Sipariş başka kuryeye aktarıldı; seni çevrimdışı yaptık. Geçmiş olsun.'); } else if(r) J.toast('Destek ekibine bildirildi.'); }
  if(a==='online' && c && c.approved === false){ J.toast('Hesabın yönetim onayı bekliyor.'); return; }
  if(a==='online' && c){
    const online = !c.online;
    DB.patch('couriers', c.id, {online, notif_ok:true, seen_at:J.now(), lat:pos.lat, lng:pos.lng});
    J.log(`${c.name} ${online?'çevrimiçi':'çevrimdışı'} oldu.`);
    J._wantAwake = online; J.keepAwake(online);
    if(online && locMode==='gps') startGps();
    setTimeout(nativeServis, 300);
  }
  if(a==='loc'){ locMode = el.dataset.id; J.store.set('kurye_konum2', locMode); if(locMode==='gps') startGps(); else stopGps(); routeKey = ''; setTimeout(nativeServis, 300); }
  if(a==='accept'){ const o = myOffer(); if(o && c){ await J.courierAccept(c, o); route = null; prog = 0; routeKey = ''; J.alarm('teklif', false); } }
  if(a==='decline'){ const o = myOffer(); if(o && c){ J.courierDecline(c, o, 'teklifi reddetti'); J.alarm('teklif', false); } }
  if(a==='pickup'){ const o = myJob(); if(o){ J.pickup(o); route = null; prog = 0; routeKey = ''; } }
  if(a==='pin'){
    const o = myJob(); if(!o) return;
    const d = J.dist(pos, o.customer);
    if(d > J.PIN_RADIUS_M){ pinErr = `Adrese ${J.fmtDist(d)} uzaktasın. Kod yalnızca ${J.PIN_RADIUS_M} m içinde kabul edilir.`; J.log(`#${o.no} kod adrese uzakken girilmeye çalışıldı (${J.fmtDist(d)}).`, 'warn', o.id); }
    else if(pin !== o.pin){ pinErr = 'Kod yanlış. Kod doğrulanmadan teslimat tamamlanamaz.'; J.log(`#${o.no} yanlış teslimat kodu girildi.`, 'warn', o.id); }
    else { pinErr = ''; pin = ''; J.complete(c, o, 'kod ile onaylandı'); J.beep('ok'); route = null; routeKey = ''; }
  }
  if(a==='unreach'){
    const o = myJob(); if(!o) return;
    if(J.now() < +el.dataset.end){ J.toast('Bekleme süresi dolmadan sipariş kapatılamaz.'); return; }
    J.unreachable(c, o); route = null; routeKey = '';
  }
  if(a==='call'){ const o = myJob(); if(!o) return; const to = el.dataset.to==='musteri' ? {type:'musteri', id:o.customer.id, name:o.customer.name} : {type:'isletme', id:o.rid}; J.startCall(me(), to, o.id); }
  if(a==='logout'){ if(c && !myJob()) DB.patch('couriers', c.id, {online:false}); cid = null; J.store.set('kurye_id', null); J.keepAwake(false); J.nativeService(false); }
  render();
});
document.addEventListener('input', e => { if(e.target.id==='pin'){ pin = e.target.value.replace(/\D/g,'').slice(0,4); pinErr = ''; } });
document.addEventListener('change', e => { if(e.target.id==='photo' && e.target.files && e.target.files.length){ const o = myJob(); if(o){ DB.patch('orders', o.id, {photo:true}); J.log(`#${o.no} teslimat fotoğrafı eklendi.`, '', o.id); J.toast('Fotoğraf eklendi.'); } } });

/* ---------- Döngü: hareket, varış, sinyal ---------- */
let last = J.now(), lastBeat = 0, lastSent = null;
setInterval(() => {
  const t = J.now(), dt = Math.min(1, (t-last)/1000); last = t;
  const c = cour(), o = myJob();
  if(c){
    if(o) ensureRoute(o);
    // Demo sürüş: rota üzerinde ilerle
    if(locMode==='demo' && o && route && ['isletmeye','yolda'].includes(o.del)){
      const speed = J.M_PER_MIN/60 * (J.settings().fast ? 10 : 1);
      prog = Math.min(route.total, prog + speed*dt);
      pos = J.pointAt(route, prog);
    }
    // Varış tespiti
    if(o){
      const tg = target(o);
      // Demo sürüşte rota bitişi sadece rota bu hedefe aitse sayılır (eski rotayla yanlış varış olmasın)
      const routeForTg = route && tg && J.dist(route.dest, tg) < 5;
      const reached = tg && (J.dist(pos, tg) <= J.ARRIVE_M || (locMode==='demo' && routeForTg && prog >= route.total));
      if(reached && o.del==='isletmeye'){ J.arriveBusiness(o); J.beep('ok'); }
      if(reached && o.del==='yolda'){ J.arriveCustomer(o); J.beep('ok'); }
    }
    // Konum ve sinyal gönder (GPS her yeni konum verdiğinde de anında gönderilir)
    sendPos();
    J.callTick(me());
    // Navigasyon kutusunu ve haritayı her saniye güncelle
    if(o && tab==='gorev'){ document.getElementById('navbox').innerHTML = navHtml(o); drawMap(); }
  }
  J.strikeTick(); J.live(); renderCall();
}, 1000);
// Giriş ekranında veri değişince formu yeniden çizme (yazılanlar silinmesin)
DB.on(() => { if(cid) render(); });
DB.init().then(() => { const c = cour(); if(c && locMode==='gps') startGps(); if(c && (c.online || myJob())){ J._wantAwake = true; J.keepAwake(true); if(locMode==='gps') startGps(); nativeServis(); } render(); });
J.registerSW();
</script>
