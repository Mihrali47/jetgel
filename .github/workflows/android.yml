# Jetgel Android uygulamasını derler ve "Releases" sayfasına yükler.
# İndirme linki (her zaman son sürüm):
#   https://github.com/Mihrali47/jetgel/releases/download/android-son/jetgel.apk
name: Android uygulaması

on:
  push:
    branches: [main]
    paths:
      - 'uygulama/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Paketleri kur
        working-directory: uygulama
        run: npm ci

      - name: Capacitor eşitle
        working-directory: uygulama
        run: npx cap sync android

      - name: APK derle
        working-directory: uygulama/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PjetgelVersionCode=${{ github.run_number }}

      - name: APK'yı hazırla
        run: cp uygulama/android/app/build/outputs/apk/debug/app-debug.apk jetgel.apk

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-son
          name: "Jetgel Android · son sürüm"
          make_latest: true
          files: jetgel.apk
          body: |
            Jetgel Android uygulamasının son sürümü (derleme ${{ github.run_number }}).

            **Kurulum:** jetgel.apk dosyasını telefondan indir → aç → "Bilinmeyen kaynaklardan yüklemeye izin ver" → Yükle.
            Güncelleme için aynı linkten yenisini indirip kurman yeterli; eski sürümün üzerine kurulur.

            Bu bir prototip derlemesidir (test imzası).
