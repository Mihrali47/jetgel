<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetgel Prototip v1 — Komisyonsuz Teslimat Sistemi</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d1b18; --muted:#6d6860; --line:#e4e0d8;
  --brand:#e8590c; --brand-soft:#fff1e8; --ok:#2b8a3e; --ok-soft:#e6f4ea;
  --warn:#c77700; --warn-soft:#fff6e0; --bad:#c92a2a; --bad-soft:#fdecec;
  --blue:#1c6ed4; --blue-soft:#e8f1fc; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 12px;background:var(--ink);color:#fff;font-weight:600}
button.sec{background:#efece6;color:var(--ink)}
button.brand{background:var(--brand)}
button.ok{background:var(--ok)}
button.bad{background:var(--bad)}
button.ghost{background:transparent;color:var(--brand);padding:4px 6px}
button:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 9px;font-size:12px;border-radius:8px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
header{padding:18px 22px 8px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header h1 span{color:var(--brand)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#e9e5de;color:var(--muted)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.sub{color:var(--muted);font-size:13px}
.tabs{display:none;gap:6px;padding:0 14px 10px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:8px}
.tabs button{background:#e9e5de;color:var(--ink);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.phones{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:16px;padding:6px 22px 16px;align-items:start}
.phone{background:var(--card);border-radius:24px;border:1px solid var(--line);box-shadow:0 8px 28px rgba(40,30,10,.07);overflow:hidden;display:flex;flex-direction:column;height:720px;position:relative}
.phone .top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.phone .top b{font-size:15px}
.phone .body{padding:14px 16px;overflow-y:auto;flex:1}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;background:#fff}
.card.soft{background:#faf8f5}
.card.brand{border-color:#f6c9ad;background:var(--brand-soft)}
.card.warn{border-color:#f0d58a;background:var(--warn-soft)}
.card.bad{border-color:#f2b8b8;background:var(--bad-soft)}
.card.ok{border-color:#b6dfc0;background:var(--ok-soft)}
.card h3{margin:0 0 6px;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row+.row{margin-top:6px}
.stack>*+*{margin-top:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rest{display:flex;gap:10px;align-items:center;cursor:pointer}
.rest .emo{font-size:26px;width:44px;height:44px;border-radius:12px;background:#f5f1ea;display:grid;place-items:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.big{font-size:20px;font-weight:800}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.steps{list-style:none;margin:8px 0 0;padding:0}
.steps li{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--muted);font-size:13px}
.steps li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;font-style:normal;font-size:10px;display:grid;place-items:center}
.steps li.done{color:var(--ink)} .steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{color:var(--ink);font-weight:700} .steps li.now i{border-color:var(--brand);background:var(--brand-soft)}
.pin{font-size:30px;font-weight:800;letter-spacing:8px;text-align:center;margin:6px 0}
.qr{display:block;margin:4px auto;width:110px;height:110px}
.overlay{position:absolute;inset:0;background:rgba(20,16,10,.55);display:flex;align-items:flex-end;z-index:3}
.callbox{background:#1d1b18;color:#fff;width:100%;padding:22px 18px;border-radius:22px 22px 0 0;text-align:center}
.callbox .who{font-size:19px;font-weight:800;margin:6px 0 2px}
.callbox .btns{justify-content:center;margin-top:16px}
.ring{animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-6deg)}}
.gate{text-align:center;padding:18px 8px}
.gate .ic{font-size:40px}
.switch{display:flex;align-items:center;gap:8px;font-weight:700}
.admin{padding:0 22px 40px}
.admin-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.log{max-height:260px;overflow-y:auto;font-size:12.5px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.map{width:100%;height:auto;background:#f7f4ee;border-radius:12px;border:1px solid var(--line);display:block}
.rules li{margin-bottom:5px}
#admin-map .map{max-width:480px;margin:0 auto}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{padding:2px 9px}
.note{font-size:12px;color:var(--muted);background:#f5f2ec;border-radius:10px;padding:8px 10px;margin-top:8px}
.toast{position:absolute;left:12px;right:12px;top:58px;z-index:2;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
@media (max-width:1100px){
  .tabs{display:flex}
  .phones{grid-template-columns:1fr;padding:6px 12px}
  .phone{height:auto;min-height:600px}
  .phone .body{overflow:visible}
  body[data-tab] [data-pane]{display:none}
  body[data-tab="musteri"] [data-pane="musteri"],body[data-tab="isletme"] [data-pane="isletme"],
  body[data-tab="kurye"] [data-pane="kurye"],body[data-tab="yonetim"] [data-pane="yonetim"]{display:flex}
  body[data-tab="yonetim"] .admin{display:block}
  .admin{padding:0 12px 40px}
  .admin-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body data-tab="musteri">
<header>
  <h1><span>Jetgel</span> · Prototip v1</h1>
  <span class="pill">Geçici isim</span>
  <span class="pill brand">Simülasyon: 1 dakika = 1 saniye</span>
  <div class="sub" style="flex-basis:100%">Komisyonsuz, sabit ücretli teslimat sistemi. Aşağıdaki üç telefon aynı anda çalışır: müşteri olarak sipariş ver, işletme olarak onayla, kurye olarak teslim et. En altta yönetim paneli her şeyi kaydeder.</div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="musteri" class="on">👤 Müşteri</button>
  <button data-tab="isletme">🏪 İşletme</button>
  <button data-tab="kurye">🛵 Kurye</button>
  <button data-tab="yonetim">📊 Yönetim</button>
</nav>
<main>
  <section class="phones">
    <div class="phone" data-pane="musteri" id="p-musteri"></div>
    <div class="phone" data-pane="isletme" id="p-isletme"></div>
    <div class="phone" data-pane="kurye" id="p-kurye"></div>
  </section>
  <section class="admin" data-pane="yonetim" id="p-yonetim"></section>
</main>

<script>
/* ===================== AYARLAR ===================== */
const MIN = 1000;               // 1 simülasyon dakikası = 1000 ms
const KM = 0.04;                // harita birimi -> km (100 birim = 4 km)
const RADIUS_KM = 3;            // kurye arama yarıçapı
const OFFER_MS = 30 * 1000;     // kurye teklif süresi (gerçek 30 sn)
const RING_MS = 30 * 1000;      // arama çalma süresi
const CALLBACK_MS = 15 * 1000;  // geri dönüş penceresi (demo: 15 sn)
const SPEED = 6;                // birim / sn
const FEE = {custDel:50, custPlat:5, bizDel:50, bizPlat:5, courier:100, platform:10};
const PENALTY_RATE = 0.15;      // ikazda müşteriye iade oranı
const COMMISSION_RATE = 0.35;   // karşılaştırma için büyük platform komisyonu

/* ===================== DURUM ===================== */
const S = {
  restaurants: [
    {id:'r1', name:'Usta Pideci', emoji:'🫓', x:22, y:30, notif:false, open:false, freeDelivery:false, suspended:false, strikes:[],
      menu:[{id:'m1',name:'Kıymalı Pide',price:280},{id:'m2',name:'Kaşarlı Pide',price:250},{id:'m3',name:'Ayran',price:45}]},
    {id:'r2', name:'Moda Kebap', emoji:'🍢', x:62, y:22, notif:true, open:true, freeDelivery:false, suspended:false, strikes:[],
      menu:[{id:'m4',name:'Adana Dürüm',price:320},{id:'m5',name:'Tavuk Şiş Porsiyon',price:360},{id:'m6',name:'Şalgam',price:50}]},
    {id:'r3', name:'Anne Çorba Evi', emoji:'🍲', x:40, y:72, notif:true, open:true, freeDelivery:true, suspended:false, strikes:[],
      menu:[{id:'m7',name:'Mercimek Çorbası',price:150},{id:'m8',name:'İşkembe Çorbası',price:190},{id:'m9',name:'Ekmek',price:15}]},
  ],
  couriers: [
    {id:'c1', name:'Sen (Ali)', isUser:true, x:35, y:42, online:false, notif:false, busy:null, offer:null, target:null, earnings:0, jobs:[]},
    {id:'c2', name:'Mehmet', x:70, y:34, online:true, notif:true, busy:null, offer:null, target:null, earnings:0, jobs:[]},
    {id:'c3', name:'Emre', x:14, y:82, online:true, notif:true, busy:null, offer:null, target:null, earnings:0, jobs:[]},
    {id:'c4', name:'Can', x:88, y:64, online:false, notif:true, busy:null, offer:null, target:null, earnings:0, jobs:[]},
  ],
  customer: {name:'Ayşe', x:78, y:78, wallet:0, notif:false, notifDismissed:false},
  orders: [], calls: [], callbacks: [], log: [],
  ui: {tab:'musteri', custView:'liste', cartRid:null, cart:{}, bizId:'r1', pin:'', toast:{}},
  seq: 1023, dirty: true
};

/* ===================== YARDIMCILAR ===================== */
const $ = s => document.querySelector(s);
const now = () => Date.now();
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const km = (a,b) => (dist(a,b)*KM).toFixed(1);
const tl = n => n.toLocaleString('tr-TR') + ' TL';
const rest = id => S.restaurants.find(r => r.id === id);
const cour = id => S.couriers.find(c => c.id === id);
const order = id => S.orders.find(o => o.id === id);
const userCourier = () => S.couriers.find(c => c.isUser);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clock = t => new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const secs = ms => Math.max(0, Math.ceil(ms/1000));
const rand = (a,b) => a + Math.random()*(b-a);
function log(txt, kind){ S.log.unshift({t:now(), txt, kind:kind||''}); if(S.log.length>120) S.log.pop(); S.dirty = true; }
function toast(pane, txt){ S.ui.toast[pane] = {txt, until: now()+3500}; S.dirty = true; }
function tlog(o, txt){ o.timeline.push({t:now(), txt}); }
function activeStrikes(r){ return r.strikes.filter(s => !s.removed); }
function partyName(p){
  if(p.type==='musteri') return S.customer.name + ' (müşteri)';
  if(p.type==='isletme') return rest(p.id).name + ' (işletme)';
  return cour(p.id).name.replace('Sen (Ali)','Ali') + ' (kurye)';
}
function isUserControlled(p){
  if(p.type==='musteri') return true;
  if(p.type==='isletme') return p.id === S.ui.bizId;
  return cour(p.id).isUser;
}
function paneOf(p){ return p.type==='musteri' ? 'musteri' : p.type==='isletme' ? 'isletme' : 'kurye'; }

/* ===================== SİPARİŞ ===================== */
function placeOrder(){
  const r = rest(S.ui.cartRid);
  const items = r.menu.filter(m => S.ui.cart[m.id]).map(m => ({name:m.name, price:m.price, qty:S.ui.cart[m.id]}));
  if(!items.length) return;
  const subtotal = items.reduce((s,i) => s + i.price*i.qty, 0);
  const fees = r.freeDelivery
    ? {cust:0, biz:FEE.custDel+FEE.custPlat+FEE.bizDel+FEE.bizPlat}
    : {cust:FEE.custDel+FEE.custPlat, biz:FEE.bizDel+FEE.bizPlat};
  const o = {
    id: ++S.seq, rid:r.id, items, subtotal, fees, state:'aktif', prep:'bekliyor', del:'yok',
    createdAt: now(), pin: String(Math.floor(1000+Math.random()*9000)), courierId:null, offer:null, tried:[],
    prepUntil:null, refund:0, timeline:[], botAt: now()+rand(2500,4500), retryAt:null
  };
  tlog(o, 'Sipariş verildi, online ödeme alındı');
  S.orders.unshift(o);
  S.ui.cart = {}; S.ui.custView = 'siparis'; S.ui.trackId = o.id;
  log(`#${o.id} ${r.name} için sipariş geldi (${tl(subtotal)})`, 'order');
  if(r.id === S.ui.bizId) toast('isletme', `🔔 Yeni sipariş #${o.id}`);
}
function acceptOrder(o, prepMin){
  o.prep = 'hazirlaniyor'; o.prepUntil = now() + prepMin*MIN;
  tlog(o, `İşletme onayladı, hazırlık ${prepMin} dk`);
  log(`#${o.id} işletme onayladı (${prepMin} dk hazırlık). Kurye aranıyor.`, 'order');
  dispatch(o);
}
function rejectOrder(o){
  o.state = 'red'; tlog(o, 'İşletme reddetti, ödeme iade edildi');
  log(`#${o.id} işletme tarafından reddedildi, müşteriye tam iade.`, 'bad');
}
function markReady(o){ o.prep = 'hazir'; tlog(o, 'Sipariş hazır'); log(`#${o.id} hazır, kurye bekleniyor.`); }

/* ===================== KURYE ATAMA (DISPATCH) =====================
   Araştırmadan alınan model: işletmeye en yakın, uygun, bildirimi açık kuryeye teklif gider.
   30 sn içinde kabul etmezse ya da reddederse bir sonraki en yakın kuryeye geçer. */
function dispatch(o){
  if(o.state !== 'aktif' || o.courierId) return;
  o.del = 'araniyor';
  const r = rest(o.rid);
  const cands = S.couriers
    .filter(c => c.online && c.notif && !c.busy && !c.offer && !o.tried.includes(c.id) && dist(c,r)*KM <= RADIUS_KM)
    .sort((a,b) => dist(a,r) - dist(b,r));
  if(!cands.length){
    o.offer = null; o.retryAt = now() + 4000;
    if(o.tried.length) o.tried = [];
    log(`#${o.id} için ${RADIUS_KM} km içinde boşta kurye yok, 4 sn sonra tekrar denenecek.`, 'warn');
    return;
  }
  const c = cands[0];
  o.offer = {cid:c.id, exp: now()+OFFER_MS};
  c.offer = o.id;
  if(!c.isUser) c.decideAt = now() + rand(1500, 4000);
  else toast('kurye', `🔔 Yeni teslimat teklifi: ${r.name}`);
  log(`#${o.id} teklifi → ${c.name.replace('Sen (Ali)','Ali')} (işletmeye ${km(c,r)} km).`, 'dispatch');
}
function courierAccept(c, o){
  c.offer = null; o.offer = null; c.busy = o.id; o.courierId = c.id; o.del = 'isletmeye';
  c.target = {x:rest(o.rid).x, y:rest(o.rid).y};
  tlog(o, `Kurye ${c.name.replace('Sen (Ali)','Ali')} kabul etti, işletmeye gidiyor`);
  log(`#${o.id} ${c.name.replace('Sen (Ali)','Ali')} kabul etti.`, 'ok');
}
function courierDecline(c, o, why){
  c.offer = null; o.offer = null; o.tried.push(c.id);
  log(`#${o.id} ${c.name.replace('Sen (Ali)','Ali')} ${why}. Sıradaki kuryeye geçiliyor.`, 'warn');
  dispatch(o);
}
function pickup(c, o){
  o.del = 'yolda'; c.target = {x:S.customer.x, y:S.customer.y};
  tlog(o, 'Kurye paketi aldı (fiş QR okutuldu), yola çıktı');
  log(`#${o.id} paket alındı, müşteriye gidiyor.`);
  toast('musteri', '🛵 Siparişin yola çıktı');
}
function complete(c, o, how){
  o.del = 'teslim'; o.state = 'teslim'; o.deliveredAt = now();
  c.busy = null; c.target = null; c.earnings += FEE.courier; c.jobs.unshift({id:o.id, t:now(), amount:FEE.courier, rname:rest(o.rid).name});
  tlog(o, `Teslim edildi (${how})`);
  log(`#${o.id} teslim edildi (${how}). Kurye +${FEE.courier} TL.`, 'ok');
  toast('musteri', '✅ Siparişin teslim edildi. Afiyet olsun!');
}

/* ===================== UYGULAMA İÇİ ARAMA ===================== */
function startCall(from, to, orderId){
  const o = order(orderId);
  if(!o || o.state !== 'aktif'){ return; }
  if(S.calls.some(c => (c.state==='caliyor'||c.state==='gorusme') && [c.from,c.to].some(p => p.type===from.type && p.id===from.id))) return;
  const call = {id:'k'+(S.calls.length+1), from, to, orderId, start:now(), state:'caliyor'};
  if(!isUserControlled(to)) call.botAt = now() + rand(2000, 4000);
  S.calls.unshift(call);
  // İşletme geri dönüş yaptıysa bekleyen geri dönüşü kapat
  if(from.type==='isletme' && to.type==='musteri'){
    S.callbacks.filter(cb => !cb.done && cb.rid===from.id && cb.orderId===orderId).forEach(cb => {
      cb.done = true; log(`${rest(cb.rid).name} müşteriyi geri aradı, ikaz uygulanmadı.`, 'ok');
    });
  }
  log(`📞 ${partyName(from)} → ${partyName(to)} arıyor (sipariş #${orderId}).`, 'call');
}
function answerCall(call){ call.state = 'gorusme'; call.answeredAt = now(); log(`📞 ${partyName(call.to)} aramayı açtı (${secs(call.answeredAt-call.start)} sn çaldı).`, 'call'); }
function endCall(call, state){
  const prev = call.state; call.state = state; call.end = now();
  if(state==='bitti') log(`📞 Görüşme bitti (${secs(call.end-(call.answeredAt||call.start))} sn).`, 'call');
  if(state==='cevapsiz' || state==='reddedildi'){
    log(`📞 ${partyName(call.to)} aramayı ${state==='cevapsiz'?'açmadı (30 sn çaldı)':'reddetti'}.`, 'bad');
    if(call.to.type==='isletme' && call.from.type==='musteri'){
      S.callbacks.push({rid:call.to.id, orderId:call.orderId, callId:call.id, deadline: now()+CALLBACK_MS, done:false});
      log(`${rest(call.to.id).name}: ${secs(CALLBACK_MS)} sn içinde müşteriyi geri aramazsa ikaz alacak.`, 'warn');
    }
  }
}
function applyStrike(cb){
  cb.done = true;
  const r = rest(cb.rid), o = order(cb.orderId);
  const refund = Math.round(o.subtotal * PENALTY_RATE);
  o.refund += refund; S.customer.wallet += refund;
  r.strikes.push({id:'i'+now(), t:now(), orderId:o.id, refund, appeal:null, removed:false});
  const n = activeStrikes(r).length;
  let txt = `⚠️ ${r.name} ${n}. ikazı aldı. Müşteriye ${tl(refund)} iade (işletme hesabından).`;
  if(n >= 3){ r.suspended = true; r.open = false; txt += ' 3. ikaz: işletme askıya alındı.'; }
  log(txt, 'bad');
  toast('musteri', `💸 İşletmeye ulaşamadığın için ${tl(refund)} iade edildi`);
  if(r.id === S.ui.bizId) toast('isletme', `⚠️ ${n}. ikaz aldınız`);
}

/* ===================== ZAMANLAYICI ===================== */
let last = now();
function tick(){
  const t = now(), dt = (t - last)/1000; last = t;

  // Kurye hareketi
  S.couriers.forEach(c => {
    if(!c.target) return;
    const d = dist(c, c.target), step = SPEED*dt;
    if(d <= step){ c.x = c.target.x; c.y = c.target.y; c.target = null; arrived(c); }
    else { c.x += (c.target.x-c.x)/d*step; c.y += (c.target.y-c.y)/d*step; }
  });

  S.orders.forEach(o => {
    if(o.state !== 'aktif') return;
    const r = rest(o.rid), bot = r.id !== S.ui.bizId;
    // Otomatik (demo) işletmeler
    if(bot && o.prep==='bekliyor' && t > o.botAt) acceptOrder(o, Math.round(rand(6,10)));
    if(bot && o.prep==='hazirlaniyor' && t > o.prepUntil) markReady(o);
    // Teklif süresi
    if(o.offer && t > o.offer.exp){ const c = cour(o.offer.cid); courierDecline(c, o, '30 sn içinde yanıt vermedi'); }
    if(!o.offer && !o.courierId && o.del==='araniyor' && o.retryAt && t > o.retryAt){ o.retryAt = null; dispatch(o); }
    // Kurye işletmede bekliyor, sipariş hazırsa bot kurye alır
    const c = o.courierId && cour(o.courierId);
    if(c && !c.isUser && o.del==='isletmede' && o.prep==='hazir'){ if(!c.waitAt) c.waitAt = t + 1200; if(t > c.waitAt){ c.waitAt=null; pickup(c,o); } }
    if(c && !c.isUser && o.del==='kapida'){ if(!c.waitAt) c.waitAt = t + 2000; if(t > c.waitAt){ c.waitAt=null; complete(c,o,'kod ile onaylandı'); } }
  });

  // Bot kurye kararları
  S.couriers.forEach(c => {
    if(c.isUser || !c.offer || !c.decideAt || t < c.decideAt) return;
    const o = order(c.offer); c.decideAt = null;
    if(Math.random() < 0.85) courierAccept(c, o); else courierDecline(c, o, 'teklifi reddetti');
  });

  // Aramalar
  S.calls.forEach(call => {
    if(call.state==='caliyor'){
      if(call.botAt && t > call.botAt){ answerCall(call); call.botEnd = t + rand(3000,5000); }
      else if(t - call.start > RING_MS) endCall(call, 'cevapsiz');
    }
    if(call.state==='gorusme' && call.botEnd && t > call.botEnd) endCall(call, 'bitti');
  });

  // Geri dönüş süresi
  S.callbacks.forEach(cb => { if(!cb.done && t > cb.deadline) applyStrike(cb); });

  // Toast temizliği
  Object.keys(S.ui.toast).forEach(k => { if(S.ui.toast[k] && t > S.ui.toast[k].until){ S.ui.toast[k] = null; S.dirty = true; } });

  if(S.dirty){ renderAll(); S.dirty = false; }
  else { updateLive(); }
}
function arrived(c){
  const o = c.busy && order(c.busy);
  if(!o) return;
  if(o.del==='isletmeye'){ o.del = 'isletmede'; tlog(o,'Kurye işletmeye vardı'); log(`#${o.id} kurye işletmede.`); }
  else if(o.del==='yolda'){ o.del = 'kapida'; tlog(o,'Kurye kapıda'); log(`#${o.id} kurye müşterinin kapısında.`); toast('musteri','🚪 Kuryen kapıda! Teslimat kodunu söyle.'); }
  S.dirty = true;
}

function callOverlay(pane){
  const me = c => paneOf(c.to)===pane && isUserControlled(c.to);
  const caller = c => paneOf(c.from)===pane && isUserControlled(c.from);
  const incoming = S.calls.find(c => c.state==='caliyor' && me(c) && (pane!=='isletme' || c.to.id===S.ui.bizId) && (pane!=='kurye' || cour(c.to.id).isUser));
  if(incoming) return `<div class="overlay"><div class="callbox"><div class="ring" style="font-size:34px">📞</div><div class="small" style="opacity:.7">Uygulama içi arama · Sipariş #${incoming.orderId}</div><div class="who">${esc(partyName(incoming.from))}</div><div class="small" style="opacity:.7">Çalıyor · <span data-live="ring" data-start="${incoming.start}">${secs(RING_MS-(now()-incoming.start))}</span> sn sonra cevapsız sayılır</div><div class="btns"><button class="bad" data-act="call-decline" data-id="${incoming.id}">Reddet</button><button class="ok" data-act="call-answer" data-id="${incoming.id}">Aç</button></div></div></div>`;
  const active = S.calls.find(c => (c.state==='gorusme' && (me(c)||caller(c))) || (c.state==='caliyor' && caller(c)));
  if(active){

}

function qr(pin){ // görsel amaçlı, sahte QR deseni
  let h = 0; for(const ch of pin+'jetgel') h = (h*31 + ch.charCodeAt(0)) >>> 0;
  let s = '<rect width="21" height="21" fill="#fff"/>';
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1d1b18"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1d1b18"/>`;
  s += finder(0,0) + finder(14,0) + finder(0,14);
  for(let y=0;y<21;y++) for(let x=0;x<21;x++){
    if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue;
    h = (h*1103515245 + 12345) >>> 0;
    if(h & 0x10000) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1d1b18"/>`;
  }
  return s;
}

  const done = S.orders.filter(o => o.rid===r.id && o.state==='teslim');
  const subSum = done.reduce((s,o) => s+o.subtotal, 0), paid = done.reduce((s,o) => s+o.fees.biz, 0), comm = Math.round(subSum*COMMISSION_RATE);
  b += `<div class="card ok"><h3>💰 Komisyonsuz sistemle kazancınız</h3><div class="row small"><span>Teslim edilen sipariş</span><b>${done.length}</b></div><div class="row small"><span>%35 komisyonlu platformda ödenecek</span><span class="money">${tl(comm)}</span></div><div class="row small"><span>Burada ödenen (sabit)</span><span class="money">${tl(paid)}</span></div><div class="row"><b>Cebinizde kalan</b><b class="money" style="color:var(--ok)">${tl(Math.max(0,comm-paid))}</b></div></div>`;

  // İkazlar
  b += `<h3 style="font-size:13px;margin:12px 0 6px">İkazlar (${activeStrikes(r).length}/3 · 90 günde silinir)</h3>`;
  if(!r.strikes.length) b += `<div class="small muted">İkaz yok. Müşteri aramalarını açtığınız sürece ikaz almazsınız.</div>`;
  r.strikes.forEach((s,i) => { b += `<div class="card small ${s.removed?'soft':'warn'}"><div class="row"><b>${i+1}. ikaz · #${s.orderId}</b><span>${s.removed?'<span class="pill ok">İtiraz kabul edildi</span>':s.appeal==='beklemede'?'<span class="pill blue">İtiraz incelemede</span>':s.appeal==='red'?'<span class="pill bad">İtiraz reddedildi</span>':''}</span></div><div class="muted">Müşteriye ${tl(s.refund)} iade · ${clock(s.t)}</div>${!s.appeal&&!s.removed?`<div class="btns"><button class="sm sec" data-act="biz-appeal" data-rid="${r.id}" data-id="${s.id}">İtiraz et</button></div>`:''}</div>`; });
  return frame('isletme', `🏪 ${esc(r.name)}`, `<span class="pill">İşletme</span>`, b);
}

/* ===================== KURYE EKRANI ===================== */
function renderCourier(){
  const c = userCourier(); let b = '';
  if(!c.notif){
    b += `<div class="card warn gate"><div class="ic">🔔</div><h3>Bildirim izni zorunlu</h3><div class="small">Teslimat tekliflerini ve aramaları kaçırmaman için bildirimler açık olmalı. İzin verilmeden çevrimiçi olamazsın.</div><div class="btns" style="justify-content:center"><button class="brand" data-act="cour-notif">Bildirim izni ver</button></div></div>`;
  }
  b += `<div class="card soft"><div class="row"><span class="switch">${c.online?'🟢 Çevrimiçisin':'⚪️ Çevrimdışı'}</span><button class="sm ${c.online?'sec':'ok'}" data-act="cour-online" ${(!c.notif||c.busy)?'disabled':''}>${c.online?'Çevrimdışı ol':'Çevrimiçi ol'}</button></div>${c.notif?`<div class="row small"><span class="muted">Bildirimler açık</span><button class="ghost sm" data-act="cour-notif-off" ${c.busy?'disabled':''}>Test: kapat</button></div>`:''}</div>`;

  if(c.offer){
    const o = order(c.offer), r = rest(o.rid);
    b += `<div class="card brand"><div class="row"><h3>🔔 Yeni teslimat teklifi</h3><span class="pill brand"><span data-live="down" data-end="${o.offer.exp}">${secs(o.offer.exp-now())}</span> sn</span></div><div class="big">${tl(FEE.courier)}</div><div class="small muted">Sabit ücret · bahşiş olursa tamamı senin</div><div class="row small" style="margin-top:8px"><span>Alış: ${r.emoji} ${esc(r.name)}</span><b>${km(c,r)} km</b></div><div class="row small"><span>Teslim: 🏠 ${S.customer.name}</span><b>${km(r,S.customer)} km</b></div><div class="btns"><button class="ok" style="flex:1" data-act="cour-accept">Kabul et</button><button class="sec" data-act="cour-decline">Reddet</button></div><div class="note">Reddetmenin cezası yok. Teklif 30 sn içinde kabul edilmezse bir sonraki en yakın kuryeye geçer.</div></div>`;
  }
  if(c.busy){
    const o = order(c.busy), r = rest(o.rid);
    const steps = [['İşletmeye git', o.del!=='isletmeye'], ['Paketi al', ['yolda','kapida','teslim'].includes(o.del)], ['Müşteriye git', ['kapida','teslim'].includes(o.del)], ['Kodla teslim et', o.del==='teslim']];
    const firstOpen = steps.findIndex(s => !s[1]);
    b += `<div class="card"><div class="row"><h3>Aktif teslimat #${o.id}</h3><span class="pill brand">${tl(FEE.courier)}</span></div>${mapSVG()}<ul class="steps">${steps.map((s,i) => `<li class="${s[1]?'done':i===firstOpen?'now':''}"><i>${s[1]?'✓':''}</i>${s[0]}</li>`).join('')}</ul>`;
    if(o.del==='isletmeye') b += `<div class="small muted">${esc(r.name)} adresine gidiyorsun…</div>`;
    if(o.del==='isletmede') b += o.prep==='hazir'
      ? `<div class="btns"><button class="ok" style="flex:1" data-act="cour-pickup">📷 Fiş QR'ını okut, paketi al</button></div>`
      : `<div class="small">İşletmedesin. Sipariş henüz hazır değil${o.prepUntil?` (~<span data-live="down" data-end="${o.prepUntil}">${secs(o.prepUntil-now())}</span> dk)`:''}.</div>`;
    if(o.del==='yolda') b += `<div class="small muted">Müşteriye gidiyorsun…</div>`;
    if(o.del==='kapida') b += `<div class="small" style="margin-top:6px"><b>Müşteriden 4 haneli kodu iste:</b></div><div class="row" style="margin-top:6px"><input id="pin-input" inputmode="numeric" maxlength="4" placeholder="••••" value="${esc(S.ui.pin)}" style="flex:1;font-size:20px;letter-spacing:6px;text-align:center"><button class="ok" data-act="cour-pin">Onayla</button></div><div class="btns"><button class="sec sm" data-act="cour-qr">📷 Müşterinin QR'ını okut</button></div>${S.ui.pinErr?`<div class="small" style="color:var(--bad);margin-top:4px">Kod yanlış. Kod doğrulanmadan teslimat tamamlanamaz.</div>`:''}`;
    b += `<div class="btns"><button class="sm sec" data-act="call" data-from="kurye:${c.id}" data-to="musteri" data-order="${o.id}">📞 Müşteri</button><button class="sm sec" data-act="call" data-from="kurye:${c.id}" data-to="isletme:${r.id}" data-order="${o.id}">📞 İşletme</button></div></div>`;
  }
  if(!c.offer && !c.busy && c.online) b += `<div class="card soft small" style="text-align:center">⏳ Teklif bekleniyor… İşletmelere yakın durursan teklif gelme ihtimalin artar.</div>`;

  b += `<div class="card ok"><div class="row"><h3>Bugünkü kazancın</h3><b class="big">${tl(c.earnings)}</b></div><div class="small muted">${c.jobs.length} teslimat · Günlük ödeme: her akşam hesabında. Ceza puanı yok.</div>${c.jobs.slice(0,5).map(j => `<div class="row small"><span>#${j.id} ${esc(j.rname)}</span><span class="money">+${tl(j.amount)}</span></div>`).join('')}</div>`;
  return frame('kurye', '🛵 Ali', `<span class="pill">Kurye</span>`, b);
}

function frame(pane, title, right, body){
  return `<div class="top"><b>${title}</b>${right}</div><div class="body">${body}</div>${toastHTML(pane)}${callOverlay(pane)}`;
}

/* ===================== YÖNETİM PANELİ ===================== */
function renderAdmin(){
  const done = S.orders.filter(o => o.state==='teslim');
  const courierPay = done.length*FEE.courier, platform = done.length*FEE.platform;
  const saved = done.reduce((s,o) => s + Math.max(0, Math.round(o.subtotal*COMMISSION_RATE) - o.fees.biz), 0);
  const stateTxt = o => o.state==='red' ? '<span class="pill bad">Reddedildi</span>' : o.state==='teslim' ? '<span class="pill ok">Teslim</span>' :
    `<span class="pill blue">${{bekliyor:'Onay bekliyor',hazirlaniyor:'Hazırlanıyor',hazir:'Hazır'}[o.prep]}</span> <span class="pill">${{yok:'—',araniyor:'Kurye aranıyor',isletmeye:'Kurye işletmeye',isletmede:'Kurye işletmede',yolda:'Yolda',kapida:'Kapıda',teslim:'Teslim'}[o.del]}</span>`;
  const appeals = S.restaurants.flatMap(r => r.strikes.filter(s => s.appeal==='beklemede').map(s => ({r,s})));
  let b = `<h2 style="margin:6px 0 10px;font-size:18px">📊 Yönetim paneli</h2>
  <div class="kpis">
    <div class="kpi"><div class="v">${done.length}</div><div class="l">Teslim edilen sipariş</div></div>
    <div class="kpi"><div class="v">${tl(courierPay)}</div><div class="l">Kuryelere ödenen (sipariş başı ${FEE.courier} TL)</div></div>
    <div class="kpi"><div class="v">${tl(platform)}</div><div class="l">Platform geliri (sipariş başı ${FEE.platform} TL)</div></div>
    <div class="kpi"><div class="v" style="color:var(--ok)">${tl(saved)}</div><div class="l">İşletmelerin komisyondan tasarrufu</div></div>
  </div>
  <div class="admin-grid">
    <div>
      <div class="card"><div class="row"><h3>Canlı harita</h3><span class="small muted">🟠 sen · 🟢 boşta · 🔵 teslimatta · kesikli daire: ${RADIUS_KM} km arama alanı</span></div><div id="admin-map">${mapSVG({labels:true})}</div></div>
      <div class="card"><h3>Siparişler</h3>${S.orders.length?`<table><tr><th>#</th><th>İşletme</th><th>Durum</th><th>Müşteri öder</th><th>İşletme öder</th><th>Kurye</th></tr>${S.orders.slice(0,10).map(o => `<tr><td>${o.id}</td><td>${esc(rest(o.rid).name)}</td><td>${stateTxt(o)}</td><td class="money">${o.fees.cust?tl(o.fees.cust):'0 TL'}</td><td class="money">${tl(o.fees.biz)}</td><td>${o.courierId?esc(cour(o.courierId).name.replace('Sen (Ali)','Ali')):'—'}</td></tr>`).join('')}</table>`:'<div class="small muted">Henüz sipariş yok. Müşteri ekranından bir sipariş ver.</div>'}</div>
      <div class="card"><h3>Arama kayıtları (kanıt)</h3>${S.calls.length?`<table><tr><th>Saat</th><th>Arayan → Aranan</th><th>Sipariş</th><th>Sonuç</th></tr>${S.calls.slice(0,10).map(k => `<tr><td>${clock(k.start)}</td><td>${esc(partyName(k.from))} → ${esc(partyName(k.to))}</td><td>#${k.orderId}</td><td>${{caliyor:'<span class="pill warn">Çalıyor</span>',gorusme:'<span class="pill blue">Görüşmede</span>',bitti:'<span class="pill ok">Görüşüldü</span>',cevapsiz:'<span class="pill bad">Cevapsız</span>',reddedildi:'<span class="pill bad">Reddedildi</span>'}[k.state]}${k.answeredAt?` <span class="small muted">${secs(k.answeredAt-k.start)} sn çaldı</span>`:''}</td></tr>`).join('')}</table>`:'<div class="small muted">Arama yok.</div>'}</div>
    </div>
    <div>
      ${appeals.length?`<div class="card warn"><h3>İtiraz bekleyen ikazlar</h3>${appeals.map(({r,s}) => `<div class="row small"><span>${esc(r.name)} · #${s.orderId}</span><span><button class="sm ok" data-act="adm-appeal-ok" data-rid="${r.id}" data-id="${s.id}">Kabul</button> <button class="sm bad" data-act="adm-appeal-no" data-rid="${r.id}" data-id="${s.id}">Red</button></span></div>`).join('')}</div>`:''}
      <div class="card"><h3>Sistem günlüğü</h3><div class="log">${S.log.map(l => `<div><time>${clock(l.t)}</time>${esc(l.txt)}</div>`).join('') || '<div class="muted">Henüz olay yok.</div>'}</div></div>
      <div class="card soft"><h3>Bu sürümdeki kurallar</h3><ul class="rules small">
        <li><b>Ücret:</b> Müşteri ${FEE.custDel}+${FEE.custPlat} TL, işletme ${FEE.bizDel}+${FEE.bizPlat} TL öder. Kuryeye ${FEE.courier} TL, platforma ${FEE.platform} TL. İşletme isterse müşteri payını üstlenir.</li>
        <li><b>Kurye atama:</b> İşletme onaylayınca ${RADIUS_KM} km içindeki en yakın, boşta ve bildirimi açık kuryeye teklif gider. 30 sn içinde yanıt yoksa ya da reddederse sıradakine geçer. Reddetmenin cezası yok.</li>
        <li><b>Teslimat onayı:</b> SMS yok. Müşterinin uygulamasındaki 4 haneli kod ya da QR olmadan teslimat tamamlanamaz. Paket alımı fiş QR'ı ile doğrulanır.</li>
        <li><b>Arama:</b> İnternet üzerinden, numaralar gizli, yalnızca aktif sipariş varken. Her arama kayıt altında.</li>
        <li><b>İkaz:</b> İşletme müşteri aramasını 30 sn içinde açmaz ve ${secs(CALLBACK_MS)} sn (gerçekte 5 dk) içinde geri aramazsa ikaz alır; müşteriye siparişin %${PENALTY_RATE*100}'i işletme hesabından iade edilir. 3 ikazda askıya alma. İkazlar 90 günde silinir, itiraz hakkı var.</li>
        <li><b>Bildirim:</b> Kurye ve işletme için zorunlu; müşteri için önerilir.</li>
      </ul></div>
      <div class="card soft"><h3>Araştırmadan alınanlar</h3><ul class="rules small">
        <li>DoorDash: en yakın kuryeye teklif, süre dolunca sıradakine geçiş; yoğunlukta birden çok siparişi birleştirme.</li>
        <li>Meituan: siparişleri her 30 sn'de topluca atama, birleşik teslimatla kurye verimini yükseltme (v2 için).</li>
        <li>Wolt, Glovo, Uber: teslimatı PIN koduyla onaylama; Wolt'ta işletmenin kendi kuryesi için fiş QR'ı.</li>
      </ul></div>
    </div>
  </div>`;
  return b;
}

/* ===================== RENDER ===================== */
function renderAll(){
  const act = document.activeElement, actId = act && act.id, sel = act && act.selectionStart;
  $('#p-musteri').innerHTML = renderCustomer();
  $('#p-isletme').innerHTML = renderBusiness();
  $('#p-kurye').innerHTML = renderCourier();
  $('#p-yonetim').innerHTML = renderAdmin();
  if(actId){ const el = document.getElementById(actId); if(el){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}
let mapTimer = 0;
function updateLive(){
  const t = now();
  document.querySelectorAll('[data-live]').forEach(el => {
    const k = el.dataset.live;
    if(k==='down') el.textContent = secs(+el.dataset.end - t);
    if(k==='ring') el.textContent = secs(RING_MS - (t - +el.dataset.start));
    if(k==='up') el.textContent = secs(t - +el.dataset.start);
  });
  if(S.couriers.some(c => c.target) && t - mapTimer > 150){
    mapTimer = t;
    document.querySelectorAll('.map').forEach(svg => {
      const labels = svg.parentElement && svg.parentElement.id === 'admin-map';
      svg.outerHTML = mapSVG({labels});
    });
  }
}

/* ===================== OLAYLAR ===================== */
function parseParty(s){ const [type,id] = s.split(':'); return {type, id}; }
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('#tabs button');
  if(tabBtn){ document.body.dataset.tab = tabBtn.dataset.tab; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b===tabBtn)); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id, ui = S.ui;
  const c = userCourier();
  switch(a){
    case 'cust-notif': S.customer.notif = true; break;
    case 'cust-notif-no': S.customer.notifDismissed = true; break;
    case 'cust-open': ui.cartRid = id; ui.cart = {}; ui.custView = 'menu'; break;
    case 'cust-back': ui.custView = 'liste'; break;
    case 'cust-track': ui.trackId = +id; ui.custView = 'siparis'; break;
    case 'cart-inc': ui.cart[id] = (ui.cart[id]||0)+1; break;
    case 'cart-dec': ui.cart[id] = Math.max(0,(ui.cart[id]||0)-1); if(!ui.cart[id]) delete ui.cart[id]; break;
    case 'cust-order': placeOrder(); break;
    case 'biz-notif': rest(ui.bizId).notif = true; log(`${rest(ui.bizId).name} bildirim izni verdi.`); break;
    case 'biz-notif-off': { const r = rest(ui.bizId); r.notif = false; r.open = false; log(`${r.name} bildirimleri kapattı → otomatik olarak sipariş almaya kapatıldı.`, 'warn'); break; }
    case 'biz-open': { const r = rest(ui.bizId); r.open = !r.open; log(`${r.name} ${r.open?'sipariş almaya açıldı':'kapandı'}.`); break; }
    case 'biz-free': { const r = rest(ui.bizId); r.freeDelivery = el.checked; log(`${r.name}: müşteri teslimat payını ${r.freeDelivery?'üstleniyor':'üstlenmiyor'}.`); break; }
    case 'biz-accept': acceptOrder(order(+id), +el.dataset.min); break;
    case 'biz-reject': rejectOrder(order(+id)); break;
    case 'biz-ready': markReady(order(+id)); break;
    case 'biz-appeal': { const s = rest(el.dataset.rid).strikes.find(x => x.id===id); s.appeal = 'beklemede'; log(`${rest(el.dataset.rid).name} #${s.orderId} ikazına itiraz etti.`); break; }
    case 'adm-appeal-ok': { const r = rest(el.dataset.rid), s = r.strikes.find(x => x.id===id); s.appeal = 'kabul'; s.removed = true; if(r.suspended && activeStrikes(r).length < 3){ r.suspended = false; } log(`İtiraz kabul edildi: ${r.name} #${s.orderId} ikazı silindi.`, 'ok'); break; }
    case 'adm-appeal-no': { const r = rest(el.dataset.rid), s = r.strikes.find(x => x.id===id); s.appeal = 'red'; log(`İtiraz reddedildi: ${r.name} #${s.orderId}.`); break; }
    case 'cour-notif': c.notif = true; log('Ali bildirim izni verdi.'); break;
    case 'cour-notif-off': c.notif = false; c.online = false; if(c.offer){ const o = order(c.offer); courierDecline(c, o, 'bildirimleri kapattı'); } log('Ali bildirimleri kapattı → otomatik çevrimdışı.', 'warn'); break;
    case 'cour-online': c.online = !c.online; if(!c.online && c.offer){ courierDecline(c, order(c.offer), 'çevrimdışı oldu'); } log(`Ali ${c.online?'çevrimiçi':'çevrimdışı'} oldu.`); break;
    case 'cour-accept': courierAccept(c, order(c.offer)); break;
    case 'cour-decline': courierDecline(c, order(c.offer), 'teklifi reddetti'); break;
    case 'cour-pickup': pickup(c, order(c.busy)); break;
    case 'cour-pin': { const o = order(c.busy); if(S.ui.pin === o.pin){ S.ui.pin=''; S.ui.pinErr=false; complete(c, o, 'kod ile onaylandı'); } else { S.ui.pinErr = true; log(`#${o.id} yanlış teslimat kodu girildi.`, 'warn'); } break; }
    case 'cour-qr': { const o = order(c.busy); S.ui.pin=''; S.ui.pinErr=false; complete(c, o, 'QR ile onaylandı'); break; }
    case 'call': startCall(parseParty(el.dataset.from), parseParty(el.dataset.to), +el.dataset.order); break;
    case 'call-answer': answerCall(S.calls.find(k => k.id===id)); break;
    case 'call-decline': endCall(S.calls.find(k => k.id===id), 'reddedildi'); break;
    case 'call-end': { const k = S.calls.find(x => x.id===id); endCall(k, k.state==='caliyor' ? 'cevapsiz-iptal' : 'bitti'); if(k.state==='cevapsiz-iptal'){ k.state='bitti'; log('📞 Arayan aramayı iptal etti.'); } break; }
    default: return;
  }
  S.dirty = true;
});
document.addEventListener('change', e => {
  if(e.target.dataset.act === 'biz-select'){ S.ui.bizId = e.target.value; log(`İşletme ekranı: ${rest(S.ui.bizId).name} (diğerleri otomatik demo).`); S.dirty = true; }
});
document.addEventListener('input', e => {
  if(e.target.id === 'pin-input'){ S.ui.pin = e.target.value.replace(/\D/g,'').slice(0,4); S.ui.pinErr = false; }
});

log('Prototip başladı. İpucu: önce İşletme ve Kurye ekranında bildirim izni verip çevrimiçi ol, sonra Müşteri ekranından Usta Pideci\'den sipariş ver.');
renderAll();
setInterval(tick, 100);
</script>
