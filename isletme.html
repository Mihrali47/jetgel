<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetgel · İşletme</title>
<meta name="theme-color" content="#1d1b18">
<link rel="manifest" href="manifest-isletme.webmanifest">
<link rel="icon" href="ikonlar/ikon-192.png">
<link rel="apple-touch-icon" href="ikonlar/ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jetgel İşletme">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/panel.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/core.js"></script>
<script src="app/ikon.js"></script>
<script src="app/excel.js"></script>
<script src="vendor/qrcode/qrcode.js"></script>
</head>
<body class="p">
<div class="wrap"><div id="panel"></div></div>
<div id="ptabs"></div>
<div id="call"></div>
<script>
const {DB} = J;
let bid = J.store.get('isletme_id', null);
let tab = 'siparis';
const me = () => bid ? {type:'isletme', id:bid} : null;
const biz = () => bid && DB.get('businesses', bid);
const notifOk = () => ['granted','unsupported'].includes(J.notifPermission());
const ago = t => { const m = Math.max(0, Math.floor((J.now()-t)/60000)); return m < 1 ? 'az önce' : m + ' dk önce'; };
const today = t => new Date(t).toDateString() === new Date().toDateString();

let loginErr = '';
let nf = {name:'', price:'', cat:'', desc:'', opts:''};
let ed = null;   // düzenlenen ürün: {id, name, price, cat, desc, opts}
let imp = null;   // Excel'den okunan, onay bekleyen ürünler   // ürün ekleme formu (yeniden çizimde kaybolmasın)
let apply = null, applyErr = '', applyDone = false;   // işletme başvurusu
if(location.hash === '#basvuru' && !J.store.get('isletme_id', null)) apply = {name:'', kind:'', owner:'', phone:'', addr:'', user:'', pass:'', lat:null, lng:null, kvkk:false};
function renderApply(){
  if(applyDone) return `<div class="p-login"><div class="logo">Jet<span>gel</span> İşletme</div></div><div class="p-body"><div class="p-card p-wait"><div class="rd">${J.ic('circle-check',34)}</div><b>Başvurunuz alındı</b><div class="small muted">Ekibimiz başvurunuzu inceleyip onaylayınca, seçtiğiniz kullanıcı adı ve şifreyle giriş yapabilirsiniz. Giriş ekranından durumunu görebilirsiniz.</div><button class="brand wide" style="margin-top:14px" data-a="apply-back">Girişe dön</button></div></div>`;
  const A = apply;
  return `<div class="p-login"><div class="logo">Jet<span>gel</span> İşletme</div><div class="small muted">Başvuru · komisyon yok, sipariş başına sabit ${J.tl(J.FEE.bizDel+J.FEE.bizPlat)}</div></div><div class="p-body"><div class="card"><h3>İşletmenizi ekleyin</h3>
    <label class="f" for="ap-name">İşletme adı</label><input id="ap-name" value="${J.esc(A.name)}" placeholder="Örn. Ahmet Usta Pide">
    <label class="f" for="ap-kind">Tür</label><select id="ap-kind">${Object.keys(J.KIND_GROUP).map(k => `<option ${A.kind===k?'selected':''}>${J.esc(k)}</option>`).join('')}<option value="" ${!A.kind?'selected':''}>Diğer</option></select>
    <label class="f" for="ap-owner">Yetkili adı soyadı</label><input id="ap-owner" value="${J.esc(A.owner)}" autocomplete="name">
    <label class="f" for="ap-phone">İletişim telefonu</label><input id="ap-phone" value="${J.esc(A.phone)}" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx"><div class="tiny muted">Sadece başvurunuz hakkında size ulaşmak için; müşterilere gösterilmez.</div>
    <label class="f" for="ap-addr">Adres</label><input id="ap-addr" value="${J.esc(A.addr)}" placeholder="Mahalle, cadde, no">
    <button class="sec wide" style="margin-top:8px" data-a="ap-gps">${J.ic('locate-fixed',16)} ${A.lat?'Konum alındı ✓ (yeniden al)':'Dükkânın konumunu al'}</button><div class="tiny muted" style="margin-top:4px">Dükkândayken basın; kurye bu noktaya gelir.</div>
    <label class="f" for="ap-user">Giriş kullanıcı adı</label><input id="ap-user" value="${J.esc(A.user)}" autocapitalize="none">
    <label class="f" for="ap-pass">Şifre</label><input id="ap-pass" type="password" value="${J.esc(A.pass)}" placeholder="En az 6 karakter">
    <label class="row small" style="margin-top:12px;gap:8px;justify-content:flex-start"><input type="checkbox" id="ap-kvkk" style="width:auto" ${A.kvkk?'checked':''}><span><a href="yasal.html#kvkk" target="_blank">Aydınlatma metnini</a> ve <a href="yasal.html#isletme" target="_blank">işletme sözleşmesini</a> okudum, kabul ediyorum.</span></label>
    ${applyErr?`<div class="small" style="color:var(--bad);margin-top:8px">${J.esc(applyErr)}</div>`:''}
    <button class="brand wide" style="margin-top:12px" data-a="apply-send">Başvuruyu gönder</button><button class="ghost wide" data-a="apply-back">‹ Girişe dön</button></div></div>`;
}
function renderPick(){
  if(apply) return renderApply();
  return `<div class="p-login"><div class="logo">Jet<span>gel</span> İşletme</div><div class="small muted">Komisyonsuz sipariş paneli</div></div><div class="p-body">` +
    J.loginForm({title:'İşletme girişi', sub:'Bu cihaz giriş yaptığınız işletmenin sipariş ekranı olur.', ph:'test1', hint:'test1 … test9', err:loginErr}) +
    `<div class="p-card" style="text-align:center"><b>İşletmeniz henüz Jetgel'de değil mi?</b><div class="small muted" style="margin:4px 0 10px">Komisyon yok, aidat yok. Başvurun, onaylanınca hemen sipariş almaya başlayın.</div><button class="brand wide" data-a="apply-open">Başvuru yap</button></div></div>`;
}

function renderGate(b){
  const p = J.notifPermission();
  return `<div class="card warn gate"><div class="ic">${J.ic('bell',40)}</div><h3>Bildirim izni zorunlu</h3><div class="small">Yeni siparişleri ve müşteri aramalarını kaçırmamanız için bildirimlerin açık olması gerekir. İzin verilmeden sipariş almaya açılamazsınız.</div>
    ${p==='denied' ? `<div class="note" style="text-align:left"><b>Bildirimler engellenmiş.</b> Adres çubuğundaki kilit simgesine dokunun → Bildirimler → İzin ver. Sonra sayfayı yenileyin.</div>` : `<div class="btns center"><button class="brand" data-a="notif">Bildirim izni ver</button></div>`}
    <div class="note" style="text-align:left">Sayfa açık kaldığı sürece yeni siparişte sesli uyarı da çalar. Bazı telefonlarda pil tasarrufu bildirimleri engelleyebilir; uygulamayı pil kısıtlamasından muaf tutun.</div></div>`;
}

function header(b){
  const mine = J.orders().filter(o => o.rid===b.id);
  const td = mine.filter(o => o.state==='teslim' && today(o.created_at));
  const earn = td.reduce((s,o) => s + (o.shares ? o.shares.business : 0), 0);
  const act = mine.filter(o => o.state==='aktif').length;
  return `<div class="p-head"><div class="r1"><div class="av">${J.bizIcon(b,24)}</div><div class="tx"><div class="nm">${J.esc(b.name)}</div><div class="sb">${b.open?'Sipariş alıyor':'Kapalı'} ${J.modeBadge()}</div></div>
    <button class="p-sw ${b.open?'on':''}" data-a="toggle-open" ${(!notifOk()||b.suspended)?'disabled':''}><span class="k"></span>${b.open?'Açık':'Kapalı'}</button></div>
    <div class="p-stats"><div><b>${td.length}</b><span>Bugün teslim</span></div><div><b>${act}</b><span>Aktif sipariş</span></div><div><b>${J.tl(earn)}</b><span>Bugün hesaba</span></div></div></div>`;
}

function orderCard(o){
  const c = o.courier_id && DB.get('couriers', o.courier_id), b = biz();
  const st = o.prep==='bekliyor' ? '<span class="pill brand">Yeni</span>' : o.prep==='hazirlaniyor' ? '<span class="pill blue">Hazırlanıyor</span>' : '<span class="pill ok">Hazır</span>';
  const net = o.subtotal-o.fees.biz-(o.refund||0)-(o.discount||0)-(o.loyalty_disc||0);
  let h = `<div class="p-ord ${o.prep==='bekliyor'?'new':''} ${o.priority?'prio':''}"><div class="hd"><span class="no">#${J.esc(o.no)}</span><div class="who"><b>${J.esc(o.customer.name)}</b>${ago(o.created_at)}${o.customer.note?` · ${J.fmtDist(J.dist(b,o.customer))}`:''}</div>${o.priority?`<span class="pill bad">${J.ic('timer',11)} Hızlı</span>`:''}${st}</div><div class="bd">
    ${o.sched_at?`<div class="p-note" style="background:var(--blue-soft);margin:0 0 8px">${J.ic('clock',15)} <b>Planlı sipariş:</b> ${J.esc(J.fmtSched(o.sched_at))} teslim edilecek.</div>`:''}
    ${o.priority?`<div class="p-note" style="background:var(--bad-soft);margin:0 0 8px">${J.ic('timer',15)} <b>Hızlı teslimat:</b> müşteri ek ücret ödedi, lütfen öne alın.</div>`:''}
    <ul class="p-items">${o.items.map(i => `<li><b>${i.qty}×</b><span>${J.esc(i.name)}${i.opts&&i.opts.length?`<span class="p-opts">${i.opts.map(J.esc).join(' · ')}</span>`:''}</span></li>`).join('')}</ul>
    ${o.note?`<div class="p-note">${J.ic('notebook-pen',15)} <b>Müşteri notu:</b> ${J.esc(o.note)}</div>`:''}
    <div class="p-money"><span>Sipariş tutarı</span><b>${J.tl(o.subtotal)}</b><span>Sabit teslimat + hizmet</span><b>−${J.tl(o.fees.biz)}</b>${o.loyalty_disc?`<span>Sadakat indirimi (katkınız)</span><b>−${J.tl(o.loyalty_disc)}</b>`:''}${o.discount?`<span>Başkan kuponu (katkınız)</span><b>−${J.tl(o.discount)}</b>`:''}${o.refund?`<span style="color:var(--bad)">İkaz iadesi</span><b style="color:var(--bad)">−${J.tl(o.refund)}</b>`:''}<span><b style="color:var(--ink)">Hesabınıza geçecek</b></span><b class="big">${J.tl(net)}</b><span>%35 komisyonla olurdu</span><span style="text-align:right">${J.tl(o.subtotal*(1-J.COMMISSION_RATE))}</span></div>`;
  if(o.prep==='bekliyor'){ const st = J.prepStats(b), est = J.prepEstimate(b);
    h += `<div class="p-timer" style="background:#f6f5f2;color:var(--ink)"><span>${J.ic('timer',16)} Tahmini hazırlık süresi</span><span><b>${est}</b> dk</span></div><div class="tiny muted" style="margin-top:6px">${st.avg!=null?`Son siparişlerinizdeki ortalama ${Math.round(st.avg)} dk`:'Başlangıç süresi'}${st.load?` + şu an hazırlanan ${st.load} sipariş`:''}. Süreyi sistem yoğunluğunuza göre belirler; "Hazır" dediğiniz anlar ortalamayı günceller.</div>
    <div class="p-act"><button class="ok" style="flex:2;padding:15px;font-size:16px" data-a="accept" data-id="${o.id}">${J.ic('circle-check',18)} Siparişi onayla</button><button class="sec" data-a="reject" data-id="${o.id}">Reddet</button></div>`; }
  if(o.prep==='hazirlaniyor') h += `<div class="p-timer"><span>${J.ic('timer',16)} Kalan hazırlık süresi</span><span><b data-live="mdown" data-end="${o.prep_until}">…</b> dk</span></div><button class="ok p-big" data-a="ready" data-id="${o.id}">${J.ic('circle-check',18)} Sipariş hazır</button>`;
  let ct = o.prep==='bekliyor' ? 'Onaydan sonra kurye aranır' : 'Kurye aranıyor…';
  if(o.offer && !c){ const oc = DB.get('couriers', o.offer.cid); ct = `${J.esc(oc?oc.name:'Kurye')}'e teklif gönderildi (<span data-live="down" data-end="${o.offer.exp}">…</span> sn)`; }
  if(c) ct = `<b>${J.esc(c.name)}</b> · ${o.del==='isletmeye' ? `size ${J.fmtDist(J.dist(c,b))} uzakta` : o.del==='isletmede' ? 'işletmede, paketi bekliyor' : o.del==='yolda' ? 'paketi aldı, yolda' : 'müşterinin kapısında'}`;
  h += `<div style="margin-top:10px">${J.msgBox(o, 'isletme', 'qm').replace(/data-a="qm"/g, `data-a="qm" data-id="${o.id}"`)}</div>`;
  h += `<div class="p-cour"><span>${J.ic('bike',18)}</span><div class="tx">${ct}</div>${c?`<button class="p-ic" data-a="call" data-to="kurye" data-id="${o.id}" aria-label="Kuryeyi ara">${J.ic('phone',17)}</button>`:''}<button class="p-ic" data-a="call" data-to="musteri" data-id="${o.id}" aria-label="Müşteriyi ara">${J.ic('user',17)}</button></div></div></div>`;
  return h;
}

function tabOrders(b){
  let h = b.open ? J.batteryCard() : '';
  J.pendingCallbacks(b.id).filter(k => k.cb_deadline).forEach(k => {
    h += `<div class="card bad"><h3>${J.ic('phone-off',16)} Cevapsız müşteri araması</h3><div class="small">#${J.esc(k.no)}: Müşteriyi <b><span data-live="mmss" data-end="${k.cb_deadline}">…</span></b> içinde geri aramazsanız ikaz alırsınız ve müşteriye %${J.PENALTY_RATE*100} iade yapılır.</div><div class="btns"><button class="bad" data-a="call" data-to="musteri" data-id="${k.order_id}">Müşteriyi geri ara</button></div></div>`;
  });
  const claims = J.orders().filter(o => o.rid===b.id && o.claim && o.claim.state==='beklemede');
  if(claims.length){
    h += `<div class="p-sec">Müşteri sorun bildirimleri<span class="n hot">${claims.length}</span></div>`;
    claims.forEach(o => { const c = o.claim;
      J.notify('clm-'+o.id, 'Sorun bildirimi #'+o.no, J.CLAIM_REASONS[c.reason]+' · '+J.tl(c.amount));
      h += `<div class="p-ord" style="border-color:var(--warn)"><div class="hd"><span class="no">#${J.esc(o.no)}</span><div class="who"><b>${J.esc(o.customer.name)}</b>${J.esc(J.CLAIM_REASONS[c.reason])} · ${ago(c.t)}</div><span class="pill warn">İnceleyin</span></div><div class="bd">
        <ul class="p-items">${c.picks.map(p => { const it = o.items[p.i]||{}; return `<li><b>${p.qty}×</b><span>${J.esc(it.name||'')}${it.opts&&it.opts.length?`<span class="p-opts">${it.opts.map(J.esc).join(' · ')}</span>`:''}</span></li>`; }).join('')}</ul>
        ${c.note?`<div class="p-note">${J.ic('message-square',15)} ${J.esc(c.note)}</div>`:''}
        ${c.photo?`<img src="${c.photo}" alt="Müşterinin fotoğrafı" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px">`:''}
        <div class="p-money"><span><b style="color:var(--ink)">İade tutarı (sizin payınızdan)</b></span><b>${J.tl(c.amount)}</b></div>
        <div class="tiny muted" style="margin-top:6px">Reddederseniz müşteri yönetime itiraz edebilir; son kararı yönetim verir.</div>
        <div class="p-act"><button class="ok" data-a="clm-ok" data-id="${o.id}">İade et</button><button class="sec" data-a="clm-no" data-id="${o.id}">Reddet</button></div></div></div>`; });
  }
  const held = J.orders().filter(o => o.rid===b.id && o.state==='aktif' && J.isHeld(o));
  const act = J.orders().filter(o => o.rid===b.id && o.state==='aktif' && !J.isHeld(o));
  act.sort((x,y) => (!!y.priority - !!x.priority) || (x.created_at - y.created_at));   // hızlı teslimatlar önce
  const groups = [['Yeni siparişler', act.filter(o => o.prep==='bekliyor'), true], ['Hazırlanıyor', act.filter(o => o.prep==='hazirlaniyor'), false], ['Hazır · kurye bekleniyor', act.filter(o => o.prep==='hazir'), false]];
  if(!act.length) h += b.open ? `<div class="p-empty" style="margin-top:14px"><div>${J.ic('hourglass',34)}</div><b>Yeni sipariş bekleniyor</b><div class="small">Sipariş gelince sesli uyarı çalar ve bildirim gelir.</div></div>`
    : `<div class="p-empty" style="margin-top:14px"><div>${J.ic('moon',34)}</div><b>Şu an kapalısınız</b><div class="small">Sipariş almak için yukarıdaki anahtarı açın.</div></div>`;
  groups.forEach(([t, list, hot]) => { if(list.length){ h += `<div class="p-sec">${t}<span class="n ${hot?'hot':''}">${list.length}</span></div>`; list.forEach(o => h += orderCard(o)); } });
  if(held.length){ h += `<div class="p-sec">Planlı siparişler<span class="n">${held.length}</span></div>`; held.sort((x,y) => x.sched_at - y.sched_at).forEach(o => h += `<div class="p-mini"><span>${J.ic('clock',14)} <b>${J.esc(J.fmtSched(o.sched_at))}</b> · #${J.esc(o.no)} · ${o.items.map(i => i.qty+'× '+J.esc(i.name)).join(', ')}</span><span class="tiny muted">${J.SCHED_LEAD} dk önce düşer</span></div>`); }
  const done = J.orders().filter(o => o.rid===b.id && o.state!=='aktif').slice(0,8);
  if(done.length){ h += `<div class="p-sec">Son siparişler</div>`; done.forEach(o => h += `<div class="p-mini"><span>#${J.esc(o.no)} · ${J.esc(o.customer.name)} · <b>${J.tl(o.subtotal)}</b></span><span class="pill ${o.state==='teslim'?'ok':'bad'}">${o.state==='teslim'?'Teslim':o.state==='red'?'Reddedildi':o.state==='iptal'?'İptal edildi':'Ulaşılamadı'}</span></div>`); }
  return h;
}

function importCard(b){
  if(imp){
    const {items, errors, fname} = imp;
    const names = new Set((b.menu||[]).map(m => J.norm(m.name)));
    const upd = items.filter(i => names.has(J.norm(i.name))).length;
    return `<div class="p-card" style="margin-top:14px;border:2px solid var(--brand)"><h3>${J.ic('file-spreadsheet',17)} ${J.esc(fname)}</h3>
      <div class="p-stats" style="margin:4px 0 10px"><div style="background:#f6f5f2"><b>${items.length}</b><span>okunan ürün</span></div><div style="background:#f6f5f2"><b>${items.length-upd}</b><span>yeni</span></div><div style="background:#f6f5f2"><b>${upd}</b><span>güncellenecek</span></div></div>
      ${items.slice(0,6).map(i => `<div class="row small"><span>${J.esc(i.name)} <span class="muted">${J.esc(i.cat)}</span>${i.available?'':' <span class="pill bad">Tükendi</span>'}</span><b>${J.tl(i.price)}</b></div>`).join('')}${items.length>6?`<div class="tiny muted" style="margin-top:6px">… ve ${items.length-6} ürün daha</div>`:''}
      ${items.some(J.isTemplateExample)?`<div class="card warn small" style="margin:10px 0 0"><b>Şablondaki örnek ürünler de okundu (${items.filter(J.isTemplateExample).length} adet).</b><div class="btns"><button class="sm brand" data-a="imp-strip">Örnekleri çıkar</button></div></div>`:''}
      ${errors.length?`<div class="card warn small" style="margin:10px 0 0"><b>${errors.length} satır atlandı:</b>${errors.slice(0,5).map(e => `<div>• ${J.esc(e)}</div>`).join('')}${errors.length>5?`<div>… ve ${errors.length-5} satır daha</div>`:''}</div>`:''}
      <div class="note">Aynı isimli ürünlerin fiyatı, kategorisi ve durumu güncellenir; listede olmayan ürünleriniz silinmez. Şablondaki gri örnek satırları sildiğinizden emin olun.</div>
      <div class="p-act"><button class="brand" data-a="imp-ok" ${items.length?'':'disabled'}>Menüye aktar</button><button class="sec" data-a="imp-cancel">Vazgeç</button></div></div>`;
  }
  return `<div class="p-card" style="margin-top:14px"><div class="row"><div><b>${J.ic('file-spreadsheet',17)} Excel'den toplu ürün yükle</b><div class="tiny muted">Yüzlerce ürünü tek seferde ekleyin ya da fiyatları güncelleyin.</div></div></div>
    <div class="p-grid2" style="margin-top:10px"><a class="btnlink" style="justify-content:center" href="sablonlar/jetgel-urun-yukleme-sablonu.xlsx" download>${J.ic('download',16)} Şablonu indir</a><label class="btnlink" style="justify-content:center;cursor:pointer;background:var(--brand);color:#fff">${J.ic('upload',16)} Dosya seç<input type="file" id="imp-file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" style="display:none"></label></div>
    <div class="tiny muted" style="margin-top:8px">Şablonda market ve restoran için iki sayfa var; hangisini doldurduysanız o okunur. .xlsx ya da .csv kabul edilir.</div></div>`;
}
function editForm(cats){
  return `<div class="p-edit"><input id="ed-name" placeholder="Ürün adı" value="${J.esc(ed.name)}"><div class="p-grid2" style="margin-top:8px"><input id="ed-price" inputmode="decimal" placeholder="Fiyat (TL)" value="${J.esc(ed.price)}"><input id="ed-cat" placeholder="Kategori" list="cats" value="${J.esc(ed.cat)}"></div>
    <input id="ed-desc" placeholder="Kısa açıklama" style="margin-top:8px" value="${J.esc(ed.desc)}">

let rp = 7;   // rapor dönemi (gün)
function reportData(b, days){
  const since = days === 1 ? new Date().setHours(0,0,0,0) : J.now() - days*864e5;
  const os = J.orders().filter(o => o.rid===b.id && o.state==='teslim' && (o.created_at||0) >= since);
  const ciro = os.reduce((t,o) => t + o.subtotal, 0), net = os.reduce((t,o) => t + (o.shares ? o.shares.business : 0), 0);
  const prod = {}; os.forEach(o => o.items.forEach(i => { const p = prod[i.name] = prod[i.name] || {name:i.name, qty:0, tl:0}; p.qty += i.qty; p.tl += i.qty*i.price; }));
  const hours = Array(24).fill(0); os.forEach(o => hours[new Date(o.created_at).getHours()]++);
  return {os, ciro, net, avg: os.length ? ciro/os.length : 0, top: Object.values(prod).sort((a,c) => c.qty-a.qty).slice(0,5), hours};
}
function reportCard(b){

  return `<div class="p-sec">Satış raporu</div><div class="p-card"><div class="m-sort" style="margin:0 0 12px">${[[1,'Bugün'],[7,'7 gün'],[30,'30 gün']].map(([d,l]) => `<button class="${rp===d?'on':''}" data-a="rp" data-id="${d}">${l}</button>`).join('')}</div>
    <div class="p-kpi"><div><b>${r.os.length}</b><span>Teslim edilen</span></div><div><b>${J.tl(r.ciro)}</b><span>Ciro</span></div><div><b>${J.tl(r.net)}</b><span>Hesabınıza</span></div><div><b>${J.tl(r.avg)}</b><span>Ort. sepet</span></div></div>
    ${r.top.length?`<div class="lbl">En çok satanlar</div>${r.top.map((p,i) => `<div class="row small" style="margin-top:6px"><span>${i+1}. ${J.esc(p.name)}</span><span><b>${p.qty} adet</b> · ${J.tl(p.tl)}</span></div>`).join('')}`:'<div class="small muted">Bu dönemde teslim edilen sipariş yok.</div>'}
    ${r.os.length?`<div class="lbl">Saatlere göre sipariş</div><div class="p-bars">${r.hours.map((n,h) => `<div title="${h}:00 · ${n} sipariş"><i style="height:${Math.round(n/mx*100)}%"></i><span>${h%3===0?h:''}</span></div>`).join('')}</div>`:''}

function renderMain(){
  const b = biz();
  if(!b){ bid = null; J.store.set('isletme_id', null); return renderPick(); }
  let h = header(b) + `<div class="p-body">`;
  if(!notifOk()) h += renderGate(b);
  if(b.suspended) h += `<div class="card bad"><h3>${J.ic('ban',16)} Hesap askıya alındı</h3><div class="small">Son 90 günde 3 ikaz alındı. Sözleşme gereği sipariş alamazsınız. İtirazlarınız yönetim tarafından incelenir.</div></div>`;
  h += ({siparis:tabOrders, menu:tabMenu, kazanc:tabEarn, ayar:tabSettings}[tab] || tabOrders)(b);
  // Uyarılar
  const waiting = J.orders().filter(o => o.rid===b.id && o.state==='aktif' && o.prep==='bekliyor' && !J.isHeld(o));
  J.orders().filter(o => o.rid===b.id && o.state==='aktif').forEach(o => J.msgNotify(o, 'isletme'));
  J.alarm('yeni', waiting.length > 0, 'order', 3000);
  waiting.forEach(o => J.notify('yeni-'+o.id, (o.priority?'Hızlı sipariş #':'Yeni sipariş #')+o.no, o.items.map(i => i.qty+'× '+i.name).join(', ')));
  return h + `</div>`;
}
function renderTabs(){

let lastCall = '';
function renderCall(){ const m = me(); const h = m ? J.callOverlay(m) : ''; if(h !== lastCall){ document.getElementById('call').innerHTML = h; lastCall = h; } }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id, b = biz();
  if(a==='login'){
    const r = await J.login('businesses', document.getElementById('l-user').value, document.getElementById('l-pass').value);
    if(r.error){
      const ap = J.findApplication(document.getElementById('l-user').value);
      loginErr = ap && ap.state === 'beklemede' ? 'Başvurunuz inceleniyor. Onaylanınca bu bilgilerle giriş yapabilirsiniz.' : ap && ap.state === 'reddedildi' ? 'Başvurunuz onaylanmadı' + (ap.reason ? ': ' + ap.reason : '.') : r.error;
    } else { loginErr = ''; bid = r.id; J.store.set('isletme_id', r.id); tab = 'siparis'; }
  }
  if(a==='switch'){ if(b && b.open) DB.patch('businesses', b.id, {open:false}); bid = null; J.store.set('isletme_id', null); J.keepAwake(false); J.nativeService(false); }
  if(a==='notif'){ const p = await J.askNotif(); if(p==='granted' && b) DB.patch('businesses', b.id, {notif_ok:true}); }
  if(a==='toggle-open' && b){
    const open = !b.open;
    DB.patch('businesses', b.id, {open, notif_ok:true, seen_at:J.now()});
    J.log(`${b.name} ${open?'sipariş almaya açıldı':'kapandı'}.`);
    J._wantAwake = open; J.keepAwake(open);
    J.nativeService(open, {baslik:`Jetgel İşletme · ${b.name}`, metin:'Açık: yeni siparişler ve aramalar için hazır', konum:false});
    if(open) J.beep('ok');
  }
  if(a==='racej' && b){ DB.patch('businesses', b.id, {race_join: el.checked}); J.log(`${b.name} Mahalle Başkanı kampanyasına ${el.checked?'katıldı':'katılımını bitirdi'}.`); }
  if(a==='free' && b) DB.patch('businesses', b.id, {free_delivery: el.checked});
  if(a==='tab'){ tab = id; window.scrollTo(0,0); }
  if(a==='accept') J.acceptOrder(DB.get('orders', id));
  if(a==='reject') J.rejectOrder(DB.get('orders', id));
  if(a==='ready') J.markReady(DB.get('orders', id));
  if(a==='apply-open'){ apply = {name:'', kind:'', owner:'', phone:'', addr:'', user:'', pass:'', lat:null, lng:null, kvkk:false}; applyErr = ''; applyDone = false; }
  if(a==='apply-back'){ apply = null; applyDone = false; }
  if(a==='ap-gps' && apply){
    if(!navigator.geolocation){ J.toast('Bu cihaz konum desteklemiyor.'); return; }
    J.toast('Konum alınıyor…');
    navigator.geolocation.getCurrentPosition(p => { apply.lat = p.coords.latitude; apply.lng = p.coords.longitude; render(); }, () => J.toast('Konum alınamadı; konum iznini kontrol edin.'), {enableHighAccuracy:true, timeout:15000});
    return;
  }
  if(a==='apply-send' && apply){
    const A = apply;
    if(!A.name.trim() || !A.owner.trim() || !A.phone.trim() || !A.addr.trim()) applyErr = 'Lütfen tüm alanları doldurun.';
    else if(!A.lat) applyErr = 'Dükkânın konumunu alın.';
    else if(!A.user.trim() || A.pass.length < 6) applyErr = 'Kullanıcı adı ve en az 6 karakterli şifre girin.';
    else if(J.userTaken(A.user)) applyErr = 'Bu kullanıcı adı alınmış.';
    else if(!A.kvkk) applyErr = 'Devam etmek için metinleri onaylayın.';
    else {
      const id = J.uid('ap');
      DB.put('applications', id, {id, name:A.name.trim(), kind:A.kind, owner:A.owner.trim(), phone:A.phone.trim(), addr:A.addr.trim(), lat:A.lat, lng:A.lng, login: await J.makeLogin(A.user, A.pass), state:'beklemede', t:J.now(), kvkk_t:J.now()});
      J.log(`Yeni işletme başvurusu: ${A.name.trim()}.`, 'ok');
      applyErr = ''; applyDone = true;
    }
  }
  if(a==='qm'){ const o = DB.get('orders', id); if(J.sendMsg(o, 'isletme', J.QUICK_MSGS.isletme[+el.dataset.i])) J.toast('Mesaj gönderildi.'); }
  if(a==='rp') rp = +id;
  if(a==='csv' && b){
    const r = reportData(b, rp), q = v => '"' + String(v).replace(/"/g,'""') + '"';
    const rows = [['Tarih','Sipariş no','Ürünler','Ürün tutarı','Sabit ücret','İndirim (katkınız)','İade','Hesabınıza'].map(q).join(';')].concat(r.os.map(o => [new Date(o.created_at).toLocaleString('tr-TR'), o.no, o.items.map(i => i.qty+'x '+i.name+(i.opts&&i.opts.length?' ('+i.opts.join(', ')+')':'')).join(', '), o.subtotal, o.fees.biz, (o.discount||0)+(o.loyalty_disc||0), (o.refund||0)+(o.claim_refund||0), o.shares ? o.shares.business : ''].map(q).join(';')));
    const blob = new Blob(['\ufeff' + rows.join('\n')], {type:'text/csv;charset=utf-8'}), u = URL.createObjectURL(blob), x = document.createElement('a');
    x.href = u; x.download = `jetgel-${b.id}-${rp}gun.csv`; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); return;
  }
  if(a==='clm-ok') J.decideClaim(DB.get('orders', id), true, 'isletme');
  if(a==='clm-no') J.decideClaim(DB.get('orders', id), false, 'isletme');
  if(a==='avail' && b) DB.patch('businesses', b.id, {menu: b.menu.map(m => m.id===id ? Object.assign({}, m, {available: m.available===false}) : m)});
  if(a==='add-item' && b){
    const name = document.getElementById('new-name').value.trim(), price = parseFloat(document.getElementById('new-price').value.replace(',','.'));
    const cat = document.getElementById('new-cat').value.trim(), desc = document.getElementById('new-desc').value.trim(), opts = J.parseOpts(document.getElementById('new-opts').value);
    if(!name || !(price > 0)){ J.toast('Ürün adı ve fiyat girin.'); return; }
    DB.patch('businesses', b.id, {menu: (b.menu||[]).concat([Object.assign({id:J.uid('u'), name, price, cat, desc, available:true}, opts.length ? {opts} : {})])});
    nf = {name:'', price:'', cat:'', desc:'', opts:''};
    J.toast('Ürün eklendi.');
  }
  if(a==='edit-item' && b){ const m = b.menu.find(x => x.id === id); if(m) ed = {id, name:m.name, price:String(m.price), cat:m.cat||'', desc:m.desc||'', opts:J.optsText(m.opts), photo:m.photo||null}; }
  if(a==='ed-cancel'){ ed = null; }
  if(a==='ed-photo-del' && ed){ ed.photo = null; }
  if(a==='h-auto' && b){ const H = b.hours || J.defaultHours(); DB.patch('businesses', b.id, {hours: Object.assign({}, H, {auto: el.checked})}); J.toast(el.checked ? 'Otomatik açma/kapama açık.' : 'Otomatik açma/kapama kapalı.'); }
  if(a==='copy-link'){ const i = document.getElementById('biz-link'); i.select(); try{ navigator.clipboard.writeText(i.value); }catch(e){ document.execCommand('copy'); } J.toast('Link kopyalandı.'); return; }
  if(a==='share-link' && b){ navigator.share({title:b.name, text:b.name + ' · Jetgel ile sipariş ver', url:J.bizLink(b)}).catch(()=>{}); return; }
  if(a==='qr-print' && b){ const w = window.open('', '_blank'); if(w){ w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${J.esc(b.name)} QR</title><style>body{font-family:system-ui,sans-serif;text-align:center;padding:40px}svg{width:320px;height:320px}h1{margin:0 0 6px}p{color:#555}</style></head><body><h1>${J.esc(b.name)}</h1><p>Telefonunun kamerasıyla okut, sipariş ver</p>${J.qrSvg(J.bizLink(b), 8)}<p style="font-size:13px">${J.esc(J.bizLink(b))}</p><script>setTimeout(()=>print(),300)<\/script></body></html>`); w.document.close(); } return; }
  if(a==='ed-del' && b && ed){ DB.patch('businesses', b.id, {menu: b.menu.filter(m => m.id !== ed.id)}); ed = null; J.toast('Ürün silindi.'); }
  if(a==='ed-save' && b && ed){
    const price = parseFloat(String(ed.price).replace(',','.'));
    if(!ed.name.trim() || !(price > 0)){ J.toast('Ürün adı ve fiyat girin.'); return; }
    const opts = J.parseOpts(ed.opts);
    DB.patch('businesses', b.id, {menu: b.menu.map(m => { if(m.id !== ed.id) return m; const n = Object.assign({}, m, {name:ed.name.trim(), price, cat:ed.cat.trim(), desc:ed.desc.trim()}); if(opts.length) n.opts = opts; else delete n.opts; if(ed.photo) n.photo = ed.photo; else delete n.photo; return n; })});
    ed = null; J.toast('Ürün güncellendi.');
  }
  if(a==='imp-cancel'){ imp = null; }
  if(a==='imp-strip' && imp){ imp.items = imp.items.filter(i => !J.isTemplateExample(i)); }
  if(a==='imp-ok' && b && imp){
    const r = J.mergeMenu(b.menu, imp.items);
    DB.patch('businesses', b.id, {menu: r.menu});
    J.log(`${b.name} Excel'den ${r.added} yeni ürün ekledi, ${r.updated} ürünü güncelledi.`);
    J.toast(`${r.added} ürün eklendi, ${r.updated} ürün güncellendi.`);
    imp = null;
  }
  if(a==='appeal' && b){ DB.patch('businesses', b.id, {strikes: b.strikes.map(s => s.id===id ? Object.assign({}, s, {appeal:'beklemede'}) : s)}); J.log(`${b.name} bir ikaza itiraz etti.`); }
  if(a==='call'){ const o = DB.get('orders', id); const to = el.dataset.to==='musteri' ? {type:'musteri', id:o.customer.id, name:o.customer.name} : {type:'kurye', id:o.courier_id}; J.startCall(me(), to, id); }
  render();
});

let lastBeat = 0;
setInterval(() => {
  const b = biz(), t = J.now();
  if(b){
    // Sinyal: işletmenin cihazı açık ve çalışıyor
    if(t - lastBeat > 20000){ lastBeat = t; DB.patch('businesses', b.id, {seen_at:t}); }
    // Çalışma saatlerine göre otomatik aç/kapat (bildirim izni yoksa açmaz)
    const hr = J.hoursTick(b, notifOk());
    if(hr === 'acildi'){ J._wantAwake = true; J.keepAwake(true); J.nativeService(true, {baslik:`Jetgel İşletme · ${b.name}`, metin:'Açık: yeni siparişler ve aramalar için hazır', konum:false}); }
    if(hr === 'kapandi'){ J._wantAwake = false; J.keepAwake(false); J.nativeService(false); }
    // Kendi siparişleri için kurye atama
    J.orders().filter(o => o.rid===b.id && o.state==='aktif').forEach(J.dispatchTick);
    J.callTick(me());
  }
  J.strikeTick(); J.live(); renderCall();
}, 1000);
document.addEventListener('change', async e => {
  if(apply && e.target.id === 'ap-kind'){ apply.kind = e.target.value; return; }
  if(apply && e.target.id === 'ap-kvkk'){ apply.kvkk = e.target.checked; return; }
  const b0 = biz();
  if(/^ly-(on|every|amount)$/.test(e.target.id||'') && b0){
    const L = Object.assign({on:false, every:10, amount:100}, b0.loyalty);
    if(e.target.id==='ly-on') L.on = e.target.checked;
    if(e.target.id==='ly-every') L.every = Math.max(2, Math.min(30, parseInt(e.target.value,10) || 10));
    if(e.target.id==='ly-amount') L.amount = Math.max(1, Math.min(1000, parseInt(e.target.value,10) || 100));
    DB.patch('businesses', b0.id, {loyalty:L}); J.toast('Sadakat kartı güncellendi.'); return;
  }
  const hm = /^h-(o|c|off)-(\d)$/.exec(e.target.id||'');
  if(hm && b0){
    const H = JSON.parse(JSON.stringify(b0.hours || J.defaultHours())), d = H.days[+hm[2]];
    if(hm[1]==='o') d.open = e.target.value; if(hm[1]==='c') d.close = e.target.value; if(hm[1]==='off') d.off = e.target.checked;
    DB.patch('businesses', b0.id, {hours:H}); return;
  }
  if(e.target.id === 'ed-photo' && e.target.files && e.target.files[0] && ed){
    try{ ed.photo = await J.compressImage(e.target.files[0], 480, 0.6); render(); }catch(err){ J.toast(err.message); }
    return;
  }
  if(e.target.id !== 'imp-file' || !e.target.files || !e.target.files.length) return;
  const f = e.target.files[0];
  if(f.size > 5*1024*1024){ J.toast('Dosya çok büyük (en fazla 5 MB).'); return; }
  J.toast('Dosya okunuyor…');
  try{ const sheets = await J.readSheetFile(f); const r = J.productsFromSheets(sheets); imp = {items:r.items, errors:r.errors, fname:f.name}; if(!r.items.length && !r.errors.length) imp.errors = ['Dosyada ürün satırı bulunamadı.']; }
  catch(err){ imp = {items:[], errors:[err.message || 'Dosya okunamadı.'], fname:f.name}; }
  render();
});
document.addEventListener('input', e => {
  const ap = /^ap-(name|owner|phone|addr|user|pass)$/.exec(e.target.id||''); if(ap && apply){ apply[ap[1]] = e.target.value; return; }
  const m = /^new-(name|price|cat|desc|opts)$/.exec(e.target.id||''); if(m) nf[m[1]] = e.target.value;
  const k = /^ed-(name|price|cat|desc|opts)$/.exec(e.target.id||''); if(k && ed) ed[k[1]] = e.target.value;
});
// Giriş ekranında veri değişince formu yeniden çizme (yazılanlar silinmesin)
DB.on(() => { if(bid) render(); });
DB.init().then(() => { const b = biz(); if(b && b.open){ J._wantAwake = true; J.keepAwake(true); J.nativeService(true, {baslik:`Jetgel İşletme · ${b.name}`, metin:'Açık: yeni siparişler ve aramalar için hazır', konum:false}); } render(); });
J.registerSW();
</script>
