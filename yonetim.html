<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetgel · Yönetim</title>
<meta name="theme-color" content="#1d1b18">
<link rel="manifest" href="manifest-yonetim.webmanifest">
<link rel="icon" href="ikonlar/ikon-192.png">
<link rel="apple-touch-icon" href="ikonlar/ikon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/panel.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/core.js"></script>
<script src="app/ikon.js"></script>
</head>
<body class="p adm">
<div id="ahead"></div>
<div class="wrap wide">
  <div class="m-sort adm-tabs" id="tabs"></div>
  <div class="grid2" id="genel-grid">
    <div><div class="card"><div class="row"><h3>Canlı harita</h3><span class="tiny muted"><span class="dot" style="background:#2b8a3e"></span> boşta · <span class="dot" style="background:#1c6ed4"></span> teslimatta · soluk: çevrimdışı</span></div><div id="map" class="map tall" style="margin-bottom:0"></div><div id="maphint" class="tiny muted" style="margin-top:6px"></div></div></div>
    <div id="side"></div>
  </div>
  <div id="panel"></div>
</div>
<script>
const {DB} = J;
let tab = 'genel', edit = null, confirmReset = false, cx = null, fin = 7, alertSig = '';
const map = J.Map(document.getElementById('map'), {wheel:true});
map.onClick(p => { if(tab==='isletmeler' && edit){ edit.lat = p.lat; edit.lng = p.lng; render(); } });

const stTxt = o => o.state==='iptal' ? '<span class="pill bad">İptal</span>' : o.state==='red' ? '<span class="pill bad">Reddedildi</span>' : o.state==='teslim' ? '<span class="pill ok">Teslim</span>' : o.state==='ulasilamadi' ? '<span class="pill bad">Ulaşılamadı</span>' :
  `<span class="pill blue">${{bekliyor:'Onay bekliyor',hazirlaniyor:'Hazırlanıyor',hazir:'Hazır'}[o.prep]}</span> <span class="pill">${{yok:'—',araniyor:'Kurye aranıyor',isletmeye:'Kurye işletmeye',isletmede:'Kurye işletmede',yolda:'Yolda',kapida:'Kapıda'}[o.del]||o.del}</span>`;

function drawMap(){
  if(!map.ok) return;
  const keys = [];
  J.businesses().forEach(b => { const k = 'b'+b.id; keys.push(k); map.set(k, b, J.bizIcon(b,16), (b.open && J.isAlive(b)) ? '' : 'off', b.name); });
  J.couriers().forEach(c => { const k = 'c'+c.id; keys.push(k); const alive = c.online && J.isAlive(c); map.set(k, c, J.ic('bike',16), 'cour ' + (c.busy?'busy':'') + (alive||c.busy?'':' off'), c.name); });
  J.orders().filter(o => o.state==='aktif').forEach(o => { const k = 'o'+o.id; keys.push(k); map.set(k, o.customer, J.ic('house',16), 'home', '#'+o.no); });
  if(tab==='isletmeler' && edit && edit.lat){ keys.push('edit'); map.set('edit', edit, J.ic('map-pin',16), '', edit.name || 'Yeni işletme'); }
  map.keep(keys);
  document.getElementById('maphint').textContent = tab==='isletmeler' && edit ? 'İşletmenin konumunu seçmek için haritaya dokunun.' : '';
}

function renderSide(){
  const ev = J.events().slice(0,60);
  const appeals = J.businesses().flatMap(b => (b.strikes||[]).filter(s => s.appeal==='beklemede').map(s => ({b,s})));
  let h = '';
  if(appeals.length) h += `<div class="card warn"><h3>İtiraz bekleyen ikazlar</h3>${appeals.map(({b,s}) => `<div class="row small"><span>${J.esc(b.name)} · #${J.esc(s.no)} · ${J.tl(s.refund)}</span><span><button class="sm ok" data-a="appeal-ok" data-b="${b.id}" data-id="${s.id}">Kabul</button> <button class="sm bad" data-a="appeal-no" data-b="${b.id}" data-id="${s.id}">Red</button></span></div>`).join('')}</div>`;
  h += `<div class="card"><h3>Sistem günlüğü</h3><div class="log">${ev.map(e => `<div><time>${J.clock(e.t)}</time>${J.esc(e.txt)}</div>`).join('') || '<div class="muted">Henüz olay yok.</div>'}</div></div>`;
  return h;
}

function renderGenel(){
  const os = J.orders(), paid = os.filter(o => o.pay==='dagitildi' && o.shares);
  const saved = paid.reduce((s,o) => s + Math.max(0, o.shares.business - o.subtotal*(1-J.COMMISSION_RATE)), 0);
  const onlineC = J.couriers().filter(c => c.online && J.isAlive(c)).length, openB = J.businesses().filter(b => b.open && J.isAlive(b)).length;
  let h = `<div class="p-card" style="margin-bottom:12px"><div class="row"><span>Toplam tamamlanan: <b>${paid.length}</b> · Platform geliri: <b>${J.tl(paid.length*J.FEE.platform)}</b></span><span class="small" style="color:var(--ok)">İşletmelerin komisyonsuz sistemle fazladan kazancı: <b>${J.tl(saved)}</b></span></div></div>`;
  const al = J.orderAlerts(), AK = {olay:'triangle-alert', onay:'clock', kurye:'bike', hazirlik:'utensils', yol:'navigation', kapi:'door-open'};
  const grp = []; al.forEach(x => { const g = grp.find(y => y.o.id === x.o.id); if(g) g.list.push(x); else grp.push({o:x.o, list:[x]}); });
  h += `<div class="card"><h3>Dikkat gerektirenler ${grp.length ? `<span class="cnt">${grp.length}</span>` : ''}</h3>${grp.length ? grp.map(({o,list}) => `<div class="p-card adm-al"><div class="row"><b>${J.ic(AK[list[0].kind]||'triangle-alert',16)} #${J.esc(o.no)} · ${J.esc(o.rname)}</b><span>${list.map(x => `<span class="pill bad">${J.esc(x.txt)}</span>`).join(' ')}</span></div><div class="tiny muted">Müşteri: ${J.esc(o.customer.name)}${o.cname ? ' · Kurye: ' + J.esc(o.cname) : ''}</div>${actBtns(o)}</div>`).join('') : '<div class="small muted">Şu an geciken ya da takılan sipariş yok.</div>'}</div>`;
  h += `<div class="card"><h3>Siparişler ve ödeme</h3>${os.length ? `<div style="overflow-x:auto"><table><tr><th>#</th><th>İşletme</th><th>Müşteri</th><th>Durum</th><th>Ödeme</th><th>Kurye</th><th>Saat</th><th></th></tr>${os.slice(0,30).map(o => `<tr><td>${J.esc(o.no)}</td><td>${J.esc(o.rname)}</td><td>${J.esc(o.customer.name)}</td><td>${stTxt(o)}</td><td>${J.payPill(o)}${o.shares?`<div class="tiny muted">İşletme ${J.tl(o.shares.business)} · Kurye ${J.tl(o.shares.courier)} · Platform ${J.tl(o.shares.platform)}${o.shares.refund?` · İade ${J.tl(o.shares.refund)}`:''}</div>`:''}</td><td>${J.esc(o.cname||'—')}</td><td class="tiny">${new Date(o.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</td><td>${o.state==='aktif' ? `<button class="sec sm" data-a="cx-open" data-id="${o.id}">Müdahale</button>` : o.cancel_reason ? `<span class="tiny muted">${J.esc(o.cancel_reason)}</span>` : ''}</td></tr>`).join('')}</table></div>` : '<div class="small muted">Henüz sipariş yok.</div>'}</div>`;
  return h;
}
const CX_REASONS = ['İşletme yanıt vermiyor', 'Kurye bulunamadı', 'Müşteri talebi', 'Ürün tükendi', 'Teknik sorun'];
function actBtns(o){
  const incBtn = o.incident && !o.incident.resolved ? `<button class="ok" data-a="inc-ok" data-id="${o.id}">Kurye sorunu çözüldü</button>` : '';
  if(cx === o.id) return `<div class="p-act" style="flex-wrap:wrap"><select id="cx-rsn">${CX_REASONS.map(r => `<option>${r}</option>`).join('')}</select><button class="no" data-a="cx-yes" data-id="${o.id}">İptal et ve ${o.pay==='bekletiliyor' ? 'parayı iade et' : 'blokajı kaldır'}</button><button class="sec" data-a="cx-close">Vazgeç</button></div>`;
  const canRe = o.prep !== 'bekliyor' && !['yolda','kapida'].includes(o.del) && (o.courier_id || o.offer);
  return `<div class="p-act" style="flex-wrap:wrap">${incBtn}${canRe ? `<button class="sec" data-a="re-assign" data-id="${o.id}">${J.ic('refresh-cw',14)} Kuryeyi değiştir</button>` : ''}<button class="no" data-a="cx-open" data-id="${o.id}">${J.ic('ban',14)} Siparişi iptal et</button></div>`;
}
function finRows(){
  const from = J.now() - fin*86400000;
  return J.orders().filter(o => o.created_at >= from && (o.state==='teslim' || o.state==='iptal' || o.state==='red' || o.state==='ulasilamadi')).sort((a,b) => b.created_at - a.created_at).map(o => {
    const sh = o.shares || {}, done = o.pay === 'dagitildi';
    if(o.pay==='iade'){ const v = J.custPaid(o); return {o, paid:v, biz:0, cour:0, plat:0, disc:0, ref:v}; }
    return {o, paid: done ? J.custPaid(o) : 0, biz: done ? sh.business||0 : 0, cour: done ? sh.courier||0 : 0, plat: done ? sh.platform||0 : 0, disc: done ? (o.discount||0)+(o.loyalty_disc||0) : 0, ref: (sh.refund||0) + (o.claim_refund||0)};
  });
}
function renderFin(){
  const rows = finRows(), sum = k => rows.reduce((t,r) => t + r[k], 0), done = rows.filter(r => r.o.pay==='dagitildi');
  const cxN = rows.filter(r => r.o.state==='iptal').length, redN = rows.filter(r => r.o.state==='red').length;
  let h = `<div class="card"><div class="row"><h3 style="margin:0">Finans</h3><div class="m-sort" style="margin:0">${[1,7,30].map(d => `<button class="${fin===d?'on':''}" data-a="fin" data-id="${d}">${d===1?'Bugün':d+' gün'}</button>`).join('')}</div></div>
    <div class="adm-kpi">${[['Müşteriden tahsil', sum('paid')],['İşletmelere', sum('biz')],['Kuryelere', sum('cour')],['Platform geliri', sum('plat')],['İndirim / kupon', sum('disc')],['İade', sum('ref')]].map(([l,v]) => `<div><span class="tiny muted">${l}</span><b>${J.tl(v)}</b></div>`).join('')}</div>
    <div class="tiny muted" style="margin-top:6px">${done.length} teslim · ${cxN} iptal · ${redN} red. Para platform hesabından geçmez; tablo ödeme kuruluşunun yaptığı dağıtımı gösterir.</div>
    <div class="p-act"><button class="sec" data-a="fin-csv">${J.ic('download',14)} CSV indir</button></div></div>`;
  h += `<div class="card"><div style="overflow-x:auto"><table><tr><th>#</th><th>Tarih</th><th>İşletme</th><th>Durum</th><th>Tahsil</th><th>İşletme</th><th>Kurye</th><th>Platform</th><th>İndirim</th><th>İade</th></tr>${rows.slice(0,200).map(r => `<tr><td>${J.esc(r.o.no)}</td><td class="tiny">${new Date(r.o.created_at).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${J.esc(r.o.rname)}</td><td>${stTxt(r.o)}</td><td>${J.tl(r.paid)}</td><td>${J.tl(r.biz)}</td><td>${J.tl(r.cour)}${r.o.tip||r.o.tip_after||r.o.prio_fee ? `<div class="tiny muted">bahşiş/hızlı dahil</div>` : ''}</td><td>${J.tl(r.plat)}</td><td>${J.tl(r.disc)}</td><td>${J.tl(r.ref)}</td></tr>`).join('') || '<tr><td colspan="10" class="muted small">Bu dönemde kapanan sipariş yok.</td></tr>'}</table></div></div>`;
  return h;
}
function finCsv(){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const lines = [['Sipariş','Tarih','İşletme','Durum','Tahsil','İşletme payı','Kurye payı','Platform','İndirim','İade','İptal nedeni'].map(q).join(';')];
  finRows().forEach(r => lines.push([r.o.no, new Date(r.o.created_at).toLocaleString('tr-TR'), r.o.rname, r.o.state, r.paid, r.biz, r.cour, r.plat, r.disc, r.ref, r.o.cancel_reason||''].map(q).join(';')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'})); a.download = `finans-${fin}gun.csv`; a.click();
}

function renderBiz(){
  let h = '';
  if(edit){
    h += `<div class="card brand"><h3>${edit.id ? 'İşletmeyi düzenle' : 'Yeni işletme'}</h3>
      <div class="row"><div style="flex:1"><label class="f" for="e-name">İşletme adı</label><input id="e-name" value="${J.esc(edit.name||'')}"></div><div style="width:130px"><label class="f" for="e-kind">Tür</label><select id="e-kind">${Object.keys(J.KIND_GROUP).map(k => `<option ${edit.kind===k?'selected':''}>${J.esc(k)}</option>`).join('')}<option value="" ${!edit.kind?'selected':''}>Diğer</option></select></div></div>
      <div class="row"><div style="flex:1"><label class="f" for="e-user">Giriş kullanıcı adı</label><input id="e-user" autocapitalize="none" value="${J.esc(edit.user||'')}"></div><div style="flex:1"><label class="f" for="e-pass">${edit.id?'Yeni şifre':'Şifre'}</label><input id="e-pass" type="password" value="${J.esc(edit.pass||'')}" placeholder="${edit.id?'Değiştirmek için yazın':'En az 6 karakter'}"></div></div>
      <label class="f">Konum</label><div class="small">${edit.lat ? `${edit.lat.toFixed(5)}, ${edit.lng.toFixed(5)}` : '<span style="color:var(--bad)">Haritaya dokunarak konum seçin.</span>'}</div>
      <label class="f" for="e-menu">Menü (her satıra: ürün adı ; fiyat ; kategori ; açıklama — son ikisi isteğe bağlı)</label><textarea id="e-menu" rows="7" placeholder="Kıymalı Pide ; 280&#10;Ayran ; 45">${J.esc(edit.menuText||'')}</textarea>
      <div class="row small" style="margin-top:8px"><label for="e-free" style="flex:1">Müşteri teslimat payını işletme üstlensin</label><input type="checkbox" id="e-free" style="width:auto" ${edit.free_delivery?'checked':''}></div>
      <div class="btns"><button class="brand" data-a="save-biz">Kaydet</button><button class="sec" data-a="cancel">Vazgeç</button>${edit.id?`<button class="bad" data-a="del-biz">Sil</button>`:''}</div></div>`;
  } else h += `<div class="btns" style="margin:0 0 12px"><button class="brand" data-a="new-biz">+ Yeni işletme ekle</button></div>`;
  J.businesses().forEach(b => {
    const n = J.activeStrikes(b).length;
    h += `<div class="card"><div class="row"><div class="rest" style="cursor:default"><div class="emo">${J.bizIcon(b,22)}</div><div><b>${J.esc(b.name)}</b><div class="small muted">${(b.menu||[]).length} ürün · ${b.open && J.isAlive(b) ? 'Açık' : 'Kapalı'}${b.free_delivery?' · ücretsiz teslimat':''} · giriş: <b>${J.esc(b.login?b.login.user:'—')}</b> · ikaz ${n}/3${b.suspended?' · <b style="color:var(--bad)">askıda</b>':''}</div></div></div>
      <div class="btns" style="margin:0"><button class="sm sec" data-a="edit-biz" data-id="${b.id}">Düzenle</button>${b.suspended?`<button class="sm ok" data-a="unsuspend" data-id="${b.id}">Askıyı kaldır</button>`:''}</div></div></div>`;
  });
  return h;
}

function renderCour(){
  const cs = J.couriers().sort((a,b) => (b.seen_at||0)-(a.seen_at||0));
  if(!cs.length) return `<div class="card soft small">Kayıtlı kurye yok. Kuryeler kurye uygulamasından kaydolur.</div>`;
  return `<div class="card"><table><tr><th>Kurye</th><th>Giriş</th><th>Durum</th><th>Son sinyal</th><th>Teslimat</th><th>Kazanç</th></tr>${cs.map(c => `<tr><td>${J.esc(c.name)}</td><td class="tiny">${J.esc(c.login?c.login.user:'—')}</td><td>${c.busy?'<span class="pill blue">Teslimatta</span>':c.online&&J.isAlive(c)?'<span class="pill ok">Çevrimiçi</span>':'<span class="pill">Çevrimdışı</span>'}${c.notif_ok?'':' <span class="pill warn">bildirim yok</span>'}</td><td class="tiny">${c.seen_at?J.clock(c.seen_at):'—'}</td><td>${(c.jobs||[]).length}</td><td class="money">${J.tl(c.earnings||0)}</td></tr>`).join('')}</table></div>`;
}

const STATE_TR = {connected:'bağlandı', failed:'bağlanamadı', disconnected:'koptu', connecting:'bağlanıyor', 'mikrofon-yok':'mikrofon izni yok', desteklenmiyor:'tarayıcı desteklemiyor'};
function diag(k){
  const one = (d, who) => d ? `${who}: <b>${J.esc(STATE_TR[d.state]||d.state||'?')}</b>${d.path?' · '+J.esc(d.path):''} <span class="muted">[${Object.entries(d.cands||{}).map(([t,n]) => t+':'+n).join(' ')||'aday yok'}${d.turn?'':' · TURN yok'}]</span>` : '';
  const parts = [one(k.diag_arayan,'arayan'), one(k.diag_aranan,'aranan')].filter(Boolean);
  if(parts.length) return parts.join('<br>');
  return k.answer_sdp ? 'el sıkışma tamam' : k.offer_sdp ? 'cevap bekleniyor' : '—';
}
function renderCalls(){
  const ks = J.calls().slice(0,40);
  if(!ks.length) return `<div class="card soft small">Arama yok.</div>`;
  const S = {caliyor:'<span class="pill warn">Çalıyor</span>', gorusme:'<span class="pill blue">Görüşmede</span>', bitti:'<span class="pill ok">Görüşüldü</span>', iptal:'<span class="pill">İptal</span>', cevapsiz:'<span class="pill bad">Cevapsız</span>', reddedildi:'<span class="pill bad">Reddedildi</span>'};
  return `<div class="card"><h3>Arama kayıtları (kanıt)</h3><div style="overflow-x:auto"><table><tr><th>Saat</th><th>Arayan → Aranan</th><th>Sipariş</th><th>Sonuç</th><th>Ses bağlantısı</th><th>İkaz</th></tr>${ks.map(k => `<tr><td class="tiny">${J.clock(k.start)}</td><td>${J.esc(J.partyName(k.from))} → ${J.esc(J.partyName(k.to))}</td><td>#${J.esc(k.no)}</td><td>${S[k.state]||k.state}${k.answered_at?` <span class="tiny muted">${J.secs(k.answered_at-k.start)} sn çaldı</span>`:''}</td><td class="tiny">${diag(k)}</td><td>${k.cezalandi?'<span class="pill bad">Uygulandı</span>':k.cb_done?'<span class="pill ok">Geri arandı</span>':k.cb_deadline?'<span class="pill warn">Bekliyor</span>':''}</td></tr>`).join('')}</table></div></div>`;
}

function renderSettings(){
  const s = J.settings();
  return `<div class="card"><h3>Bağlantı</h3><div class="small">${DB.mode==='canli' ? `Canlı mod: tüm cihazlar Supabase veritabanına bağlı. Durum: <b>${J.esc(DB.status)}</b>${DB.lastError?` · <span style="color:var(--bad)">${J.esc(DB.lastError)}</span>`:''}` : 'Demo modu: veriler sadece bu cihazın tarayıcısında. Aynı cihazdaki sekmeler birbirini görür.'}</div>
    ${DB.mode!=='canli' && window.JETGEL_CONFIG.supabaseUrl ? `<div class="btns"><button class="sm sec" data-a="force-live">Canlı moda dön</button></div>` : ''}</div>
    <div class="card"><h3>Sesli arama · aktarma sunucusu (TURN)</h3>
      <div class="small muted">Telefonlar birbirine doğrudan bağlanamadığında (mobil veri, bazı modemler) sesi bu sunucu taşır. Metered panelinde <b>TURN Server → Add Credential → Show ICE Servers Array</b> ile çıkan metnin tamamını buraya yapıştırıp kaydedin. Tüm telefonlar otomatik kullanır.</div>
      <div class="small" style="margin-top:8px">Durum: ${J.hasTurn() ? `<span class="pill ok">Aktarma sunucusu tanımlı (${(s.turn||[]).length} adres)</span>` : '<span class="pill warn">Tanımlı değil · sadece doğrudan bağlantı</span>'}</div>
      <textarea id="turn-txt" rows="6" style="margin-top:8px;font-family:monospace;font-size:12px" placeholder='[ { urls: "turn:...", username: "...", credential: "..." } ]'></textarea>
      <div class="btns"><button class="brand" data-a="save-turn">Kaydet</button>${(s.turn||[]).length?'<button class="sec" data-a="clear-turn">Kaldır</button>':''}</div></div>
    <div class="card"><h3>Test hesapları</h3><div class="small">Dükkânlar: <b>test1 … test9</b> · Kuryeler: <b>1test … 9test</b> · Müşteri: <b>test</b> · Tüm şifreler: <b>test</b></div>
      <div class="small muted" style="margin-top:6px">Eksik olanlar ilk açılışta kendiliğinden oluşturulur. "Sıfırla" test hesaplarını ilk haline getirir (açık/kapalı durumu, kazanç, ikazlar sıfırlanır; siparişler silinmez).</div>
      <div class="btns"><button class="sec" data-a="seed">Eksik test hesaplarını oluştur</button><button class="sec" data-a="reset-test">Test hesaplarını sıfırla</button></div>
      <div class="card soft" style="margin-top:12px"><b>Test dükkânlarını bulunduğun yere taşı</b><div class="small muted">9 test dükkânı, 9 test kuryesi ve test müşterisi, bu cihazın şu anki konumunun çevresine (yaklaşık 1 km içine) taşınır. Böylece her şeyi kendi mahallende deneyebilirsin.${s.center?` Şu anki merkez: ${s.center.lat.toFixed(4)}, ${s.center.lng.toFixed(4)}`:' Şu an Moda/Kadıköy\'de.'}</div><div class="btns"><button class="brand" data-a="relocate">Konumumu bul ve taşı</button>${s.center?'<button class="sec" data-a="relocate-moda">Moda\'ya geri al</button>':''}</div></div>
      <div class="note">Prototip girişi: şifreler veritabanında düz metin durur ve veritabanı herkese açıktır. Bu gerçek bir güvenlik değildir; gerçek kullanımdan önce değiştirilecek.</div></div>
    <div class="card bad"><h3>Tüm verileri sil</h3><div class="small">İşletmeler, kuryeler, siparişler, aramalar ve günlük kalıcı olarak silinir. ${DB.mode==='canli'?'<b>Canlı modda tüm cihazlardan silinir.</b>':''}</div>
      <div class="btns">${confirmReset ? `<button class="bad" data-a="reset-yes">Evet, hepsini sil</button><button class="sec" data-a="reset-no">Vazgeç</button>` : `<button class="bad" data-a="reset">Tüm verileri sil…</button>`}</div></div>`;
}

function header(){
  const os = J.orders(), act = os.filter(o => o.state==='aktif').length, today = os.filter(o => o.state==='teslim' && new Date(o.created_at).toDateString()===new Date().toDateString());
  const openB = J.businesses().filter(b => b.open && J.isAlive(b)).length, onC = J.couriers().filter(c => c.online && J.isAlive(c)).length;
  return `<div class="p-head"><div class="adm-in"><div class="r1"><div class="av">${J.ic('layout-dashboard',24)}</div><div class="tx"><div class="nm">Jetgel Yönetim</div><div class="sb">Canlı durum ${J.modeBadge()}</div></div><a class="p-sw" href="./" style="text-decoration:none">${J.ic('house',16)} Site</a></div>
    <div class="p-stats adm-stats"><div><b>${act}</b><span>Aktif sipariş</span></div><div><b>${today.length}</b><span>Bugün teslim</span></div><div><b>${openB}</b><span>Açık işletme</span></div><div><b>${onC}</b><span>Çevrimiçi kurye</span></div><div><b>${J.tl(today.length*J.FEE.platform)}</b><span>Bugün platform</span></div></div></div></div>`;
}
const pendingApps = () => DB.rows('applications').filter(a => a.state==='beklemede').concat(J.couriers().filter(c => c.approved === false && !c.rejected));
const pendingClaims = () => J.orders().filter(o => o.claim && o.claim.state==='itiraz');
function courierApps(){
  const cs = J.couriers().filter(c => c.approved === false).sort((a,b) => (b.applied_t||0)-(a.applied_t||0));
  if(!cs.length) return '';
  return `<div class="p-sec">Kurye başvuruları</div>` + cs.map(c => `<div class="p-card"><div class="row"><div><b style="font-size:16px">${J.ic('bike',16)} ${J.esc(c.name)}</b><div class="small muted">Kullanıcı adı: ${J.esc(c.login ? c.login.user : '')} · ${c.applied_t ? new Date(c.applied_t).toLocaleString('tr-TR') : ''}</div></div>${c.rejected ? '<span class="pill bad">Reddedildi</span>' : '<span class="pill warn">Bekliyor</span>'}</div>
    ${c.rejected ? '' : `<div class="tiny muted" style="margin-top:6px">Onaydan önce kimlik, ehliyet ve araç belgelerini kontrol edin.</div><input id="rsn-${c.id}" placeholder="Red sebebi (kurye görür)" style="margin-top:8px"><div class="p-act"><button class="ok" data-a="cour-ok" data-id="${c.id}">Onayla</button><button class="sec" data-a="cour-no" data-id="${c.id}">Reddet</button></div>`}</div>`).join('') + `<div class="p-sec">İşletme başvuruları</div>`;
}
function renderApps(){
  const all = DB.rows('applications').sort((a,b) => (b.t||0)-(a.t||0));
  if(!all.length) return courierApps() + `<div class="p-empty">${J.ic('store',34)}<div>Henüz işletme başvurusu yok. Başvurular işletme uygulamasındaki "Başvuru yap" formundan gelir.</div></div>`;
  if(!all.length) return `<div class="p-empty">${J.ic('store',34)}<div>Henüz işletme başvurusu yok. Başvurular işletme uygulamasındaki "Başvuru yap" formundan gelir.</div></div>`;
  return courierApps() + all.map(a => `<div class="p-card"><div class="row"><div><b style="font-size:16px">${J.esc(a.name)}</b><div class="small muted">${J.esc(a.kind||'Diğer')} · ${J.esc(a.owner)} · ${J.esc(a.phone)}</div><div class="small">${J.esc(a.addr)}</div><div class="tiny muted">${new Date(a.t).toLocaleString('tr-TR')} · giriş: <b>${J.esc(a.login.user)}</b>${a.lat?` · <a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" rel="noopener">konumu gör</a>`:''}</div></div><span class="pill ${a.state==='beklemede'?'warn':a.state==='onaylandi'?'ok':'bad'}">${{beklemede:'Bekliyor',onaylandi:'Onaylandı',reddedildi:'Reddedildi'}[a.state]}</span></div>
    ${a.state==='beklemede'?`<input id="rsn-${a.id}" placeholder="Red sebebi (reddederseniz işletme görür)" style="margin-top:10px"><div class="p-act"><button class="ok" data-a="app-ok" data-id="${a.id}">Onayla ve işletmeyi aç</button><button class="sec" data-a="app-no" data-id="${a.id}">Reddet</button></div>`:a.reason?`<div class="tiny muted" style="margin-top:6px">Sebep: ${J.esc(a.reason)}</div>`:''}</div>`).join('');
}
function renderClaims(){
  const esc = pendingClaims(), appeals = J.businesses().flatMap(b => (b.strikes||[]).filter(s => s.appeal==='beklemede').map(s => ({b,s})));
  let h = `<div class="p-sec">İade itirazları<span class="n ${esc.length?'hot':''}">${esc.length}</span></div>`;
  if(!esc.length) h += `<div class="p-empty">Bekleyen iade itirazı yok.</div>`;
  esc.forEach(o => { const c = o.claim;
    h += `<div class="p-card"><div class="row"><b>#${J.esc(o.no)} · ${J.esc(o.rname)}</b><b class="money">${J.tl(c.amount)}</b></div><div class="small muted">${J.esc(o.customer.name)} · ${J.esc(J.CLAIM_REASONS[c.reason])} · ${new Date(c.t).toLocaleString('tr-TR')}</div>
      <div class="small" style="margin-top:6px">${c.picks.map(p => `${p.qty}× ${J.esc((o.items[p.i]||{}).name||'')}`).join(', ')}</div>${c.note?`<div class="p-note">${J.esc(c.note)}</div>`:''}${c.photo?`<img src="${c.photo}" alt="" style="max-width:320px;width:100%;border-radius:12px;margin-top:8px">`:''}
      <div class="tiny muted" style="margin-top:6px">İşletme reddetti; müşteri itiraz etti. Karar kesindir.</div><div class="p-act"><button class="ok" data-a="clm-ok" data-id="${o.id}">İadeyi onayla</button><button class="bad" data-a="clm-no" data-id="${o.id}">İtirazı reddet</button></div></div>`; });
  h += `<div class="p-sec">İkaz itirazları<span class="n ${appeals.length?'hot':''}">${appeals.length}</span></div>`;
  if(!appeals.length) h += `<div class="p-empty">Bekleyen ikaz itirazı yok.</div>`;
  appeals.forEach(({b,s}) => h += `<div class="p-card"><div class="row"><b>${J.esc(b.name)} · #${J.esc(s.no)}</b><span class="money">${J.tl(s.refund)}</span></div><div class="tiny muted">${new Date(s.t).toLocaleString('tr-TR')} · arama kayıtlarını "Aramalar" sekmesinden kontrol edin</div><div class="p-act"><button class="ok" data-a="appeal-ok" data-b="${b.id}" data-id="${s.id}">İtirazı kabul et (ikazı sil)</button><button class="sec" data-a="appeal-no" data-b="${b.id}" data-id="${s.id}">Reddet</button></div></div>`);
  return h;
}
function render(){
  document.getElementById('ahead').innerHTML = header();
  const nA = pendingApps().length, nC = pendingClaims().length + J.businesses().reduce((t,b) => t + (b.strikes||[]).filter(s => s.appeal==='beklemede').length, 0);
  document.getElementById('tabs').innerHTML = [['genel','Genel',new Set(J.orderAlerts().map(x => x.o.id)).size],['finans','Finans'],['sikayet','Şikâyetler',nC],['basvuru','Başvurular',nA],['isletmeler','İşletmeler'],['kuryeler','Kuryeler'],['aramalar','Aramalar'],['ayarlar','Ayarlar']].map(([k,l,n]) => `<button class="${tab===k?'on':''}" data-a="tab" data-id="${k}">${l}${n?` <span class="cnt">${n}</span>`:''}</button>`).join('');
  const showMap = tab==='genel' || tab==='isletmeler';
  document.getElementById('genel-grid').style.display = showMap ? '' : 'none';
  J.render(document.getElementById('side'), tab==='isletmeler' ? renderBiz() : renderSide());
  J.render(document.getElementById('panel'), tab==='genel' ? renderGenel() : tab==='kuryeler' ? renderCour() : tab==='aramalar' ? renderCalls() : tab==='ayarlar' ? renderSettings() : tab==='basvuru' ? renderApps() : tab==='sikayet' ? renderClaims() : tab==='finans' ? renderFin() : '');
  if(showMap){ map.invalidate(); drawMap(); }
}

function menuToText(menu){ return (menu||[]).map(m => [m.name, m.price, m.cat||'', m.desc||''].join(' ; ').replace(/( ; )+$/,'')).join('\n'); }
function textToMenu(txt, old){
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map((l,i) => {
    const [name, price, cat, desc] = l.split(';').map(s => s.trim());
    const p = parseFloat(String(price||'').replace(',','.'));
    if(!name || !(p > 0)) return null;
    const prev = (old||[]).find(m => m.name === name);
    return {id: prev ? prev.id : J.uid('u'), name, price:p, cat: cat != null ? cat : (prev && prev.cat) || '', desc: desc != null ? desc : (prev && prev.desc) || '', available: prev ? prev.available !== false : true, ...(prev && prev.opts ? {opts: prev.opts} : {})};
  }).filter(Boolean);
}
function readForm(){ if(!edit) return; const g = id => document.getElementById(id); if(g('e-name')){ edit.name = g('e-name').value; edit.kind = g('e-kind').value; edit.menuText = g('e-menu').value; edit.free_delivery = g('e-free').checked; edit.user = g('e-user').value.trim(); edit.pass = g('e-pass').value; } }

document.addEventListener('click', async e => {
  { const el0 = e.target.closest('[data-a]'); if(el0){ const a0 = el0.dataset.a, id0 = el0.dataset.id;
    if(a0==='cour-ok'){ const c = DB.get('couriers', id0); DB.patch('couriers', id0, {approved:true, approved_t:J.now()}); J.log(`Kurye onaylandı: ${c ? c.name : ''}.`, 'ok'); render(); return; }
    if(a0==='cour-no'){ const inp = document.getElementById('rsn-'+id0); DB.patch('couriers', id0, {rejected:true, reject_reason:(inp && inp.value.trim()) || ''}); J.log('Bir kurye başvurusu reddedildi.', 'warn'); render(); return; }
    if(a0==='inc-ok'){ J.resolveIncident(DB.get('orders', id0)); render(); return; }
    if(a0==='clm-ok' || a0==='clm-no'){ J.decideClaim(DB.get('orders', id0), a0==='clm-ok', 'yonetim'); render(); return; }
    if(a0==='app-ok'){ const ap = DB.get('applications', id0); if(ap && ap.state==='beklemede'){
        if(J.findLogin('businesses', ap.login.user) || J.findLogin('couriers', ap.login.user) || J.findLogin('customers', ap.login.user)){ J.toast('Bu kullanıcı adı artık başkasında; başvuruyu reddedip yeniden başvurmasını isteyin.'); return; }
        const bid = J.uid('b');
        DB.put('businesses', bid, {name:ap.name, kind:ap.kind||'', lat:ap.lat, lng:ap.lng, loc_real:!!ap.lat, loc_t:J.now(), addr:ap.addr, owner:ap.owner, phone:ap.phone, open:false, free_delivery:false, suspended:false, notif_ok:false, strikes:[], menu:[], login:ap.login});
        DB.patch('applications', ap.id, {state:'onaylandi', bid, decided_t:J.now()}); J.log(`Başvuru onaylandı, işletme açıldı: ${ap.name}.`, 'ok'); J.toast('İşletme oluşturuldu. Artık giriş yapıp menüsünü ekleyebilir.'); }
      render(); return; }
    if(a0==='app-no'){ const inp = document.getElementById('rsn-'+id0); DB.patch('applications', id0, {state:'reddedildi', reason:(inp && inp.value.trim()) || '', decided_t:J.now()}); J.log('Bir işletme başvurusu reddedildi.', 'warn'); render(); return; }
  } }
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id;
  readForm();
  if(a==='tab'){ tab = id; edit = null; confirmReset = false; cx = null; }
  if(a==='cx-open') cx = id;
  if(a==='cx-close') cx = null;
  if(a==='cx-yes'){ const r = document.getElementById('cx-rsn'); if(J.adminCancel(DB.get('orders', id), r ? r.value : '')) J.toast('Sipariş iptal edildi.'); cx = null; }
  if(a==='re-assign'){ if(J.adminReassign(DB.get('orders', id))) J.toast('Yeniden kurye aranıyor.'); else J.toast('Kurye paketi almış; bu aşamada değiştirilemez.'); }
  if(a==='fin') fin = +id;
  if(a==='fin-csv'){ finCsv(); return; }
  if(a==='relocate'){
    if(!navigator.geolocation){ J.toast('Bu cihaz konum desteklemiyor.'); return; }
    J.toast('Konum alınıyor…');
    navigator.geolocation.getCurrentPosition(p => { J.relocateTests({lat:p.coords.latitude, lng:p.coords.longitude}); J.toast('Test hesapları konumuna taşındı.'); setTimeout(() => { map.fit(J.businesses()); render(); }, 400); },
      err => J.toast('Konum alınamadı: ' + (err.code===1 ? 'izin verilmedi' : err.message)), {enableHighAccuracy:true, timeout:20000});
    return;
  }
  if(a==='relocate-moda'){ J.relocateTests({lat:40.9868, lng:29.0305}); DB.patch('settings','ayar',{center:null}); setTimeout(() => { map.fit(J.businesses()); render(); }, 400); }
  if(a==='seed') J.ensureTestAccounts(false);
  if(a==='reset-test') J.ensureTestAccounts(true);
  if(a==='new-biz') edit = {name:'', kind:'', lat:null, lng:null, menuText:'', free_delivery:false, user:'', pass:''};
  if(a==='edit-biz'){ const b = DB.get('businesses', id); edit = Object.assign({}, b, {menuText:menuToText(b.menu), user:b.login?b.login.user:'', pass:''}); map.fit([b]); }
  if(a==='cancel') edit = null;
  if(a==='save-biz'){
    if(!edit.name.trim()){ J.toast('İşletme adını yazın.'); return; }
    if(!edit.lat){ J.toast('Haritaya dokunarak konum seçin.'); return; }
    const old = edit.id && DB.get('businesses', edit.id);
    if(!edit.user || (!edit.pass && !(old && old.login))){ J.toast('Giriş kullanıcı adı ve şifre girin.'); return; }
    if(edit.pass && edit.pass.length < 6){ J.toast('Şifre en az 6 karakter olmalı.'); return; }
    const taken = J.findLogin('businesses', edit.user) || J.findLogin('couriers', edit.user) || J.findLogin('customers', edit.user);
    if(taken && taken.id !== edit.id){ J.toast('Bu kullanıcı adı alınmış.'); return; }
    const menu = textToMenu(edit.menuText, edit.menu);
    // Şifre değişmediyse ve kullanıcı adı aynıysa eski giriş bilgisi korunur
    const login = edit.pass ? await J.makeLogin(edit.user, edit.pass) : (old.login.user === edit.user ? old.login : null);
    if(!login){ J.toast('Kullanıcı adını değiştirirken yeni şifre de girin.'); return; }
    const data = {name:edit.name.trim(), kind:edit.kind||'', lat:edit.lat, lng:edit.lng, free_delivery:!!edit.free_delivery, menu, login};
    if(edit.id) DB.patch('businesses', edit.id, data);
    else DB.put('businesses', J.uid('b'), Object.assign(data, {open:false, suspended:false, notif_ok:false, strikes:[]}));
    J.log(`İşletme kaydedildi: ${data.name} (${menu.length} ürün).`, 'ok');
    edit = null;
  }
  if(a==='del-biz' && edit && edit.id){ DB.remove('businesses', edit.id); J.log(`İşletme silindi: ${edit.name}.`, 'warn'); edit = null; }
  if(a==='unsuspend'){ const b = DB.get('businesses', id); DB.patch('businesses', id, {suspended:false}); J.log(`${b.name} askıdan çıkarıldı.`, 'ok'); }
  if(a==='appeal-ok' || a==='appeal-no'){
    const b = DB.get('businesses', el.dataset.b), ok = a==='appeal-ok';
    const strikes = b.strikes.map(s => s.id===id ? Object.assign({}, s, {appeal: ok?'kabul':'red', removed: ok ? true : s.removed}) : s);
    const patch = {strikes}; if(ok && b.suspended && strikes.filter(s => !s.removed).length < 3) patch.suspended = false;
    DB.patch('businesses', b.id, patch); J.log(`İtiraz ${ok?'kabul edildi':'reddedildi'}: ${b.name}.`, ok?'ok':'');
  }
  if(a==='save-turn'){
    const list = J.parseIce(document.getElementById('turn-txt').value).filter(x => [].concat(x.urls).some(u => /^(turns?|stun):/.test(u)));
    if(!list.length){ J.toast('Metinde sunucu adresi bulunamadı. Metered\'daki metnin tamamını yapıştırın.'); return; }
    const turnN = list.filter(x => [].concat(x.urls).some(u => /^turns?:/.test(u))).length;
    if(!turnN){ J.toast('Metinde TURN adresi yok (turn: ile başlayan).'); return; }
    if(DB.get('settings','ayar')) DB.patch('settings','ayar',{turn:list}); else DB.put('settings','ayar',{turn:list});
    J.log(`Aktarma sunucusu kaydedildi (${list.length} adres).`, 'ok');
  }
  if(a==='clear-turn'){ DB.patch('settings','ayar',{turn:[]}); J.log('Aktarma sunucusu kaldırıldı.', 'warn'); }
  if(a==='force-demo'){ J.store.set('force_demo', true); location.reload(); return; }
  if(a==='force-live'){ J.store.set('force_demo', false); location.reload(); return; }
  if(a==='reset') confirmReset = true;
  if(a==='reset-no') confirmReset = false;
  if(a==='reset-yes'){ confirmReset = false; await DB.clearAll(); J.toast('Tüm veriler silindi.'); }
  render();
});
document.addEventListener('input', () => readForm());

DB.on(() => { const ae = document.activeElement; if(!edit && !cx && !(ae && (ae.id==='turn-txt' || /^rsn-/.test(ae.id)))) render(); else { drawMap(); document.getElementById('ahead').innerHTML = header(); } });
setInterval(() => { J.strikeTick(); J.live(); if(tab==='genel') drawMap();
  const sig = J.orderAlerts().map(x => x.o.id + x.kind).join(); if(sig !== alertSig){ alertSig = sig; if(!edit && !cx) render(); } }, 2000);
DB.init().then(() => { render(); if(J.businesses().length) map.fit(J.businesses()); });
J.registerSW();
</script>
</body>
