<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetgel · Müşteri</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest-musteri.webmanifest">
<link rel="icon" href="ikonlar/ikon-192.png">
<link rel="apple-touch-icon" href="ikonlar/ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jetgel">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/musteri.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/core.js"></script>
<script src="app/ikon.js"></script>
</head>
<body class="m">
<div id="mhead"></div>
<div class="wrap">
  <div id="maphome" style="display:none"><div id="map" class="map"></div></div>
  <div id="panel"></div>
</div>
<div id="mbar"></div>
<div id="msheet"></div>
<div id="call"></div>
<script>
const {DB} = J;
// İşletmeye özel link: musteri.html?i=<işletme> → giriş sonrası doğrudan menü
(function(){ const i = new URLSearchParams(location.search).get('i'); if(i){ J.store.set('acilacak_isletme', i); history.replaceState(null, '', location.pathname); } })();
function openPendingBiz(){
  const id = J.store.get('acilacak_isletme', null); if(!id || !prof) return false;
  J.store.set('acilacak_isletme', null);
  const b = DB.get('businesses', id); if(!b){ return false; }
  if(!(b.open && J.isAlive(b) && !b.suspended)){ const st = J.hoursState(b); J.toast(`${b.name} şu an kapalı${st && st.next ? ' · açılış ' + st.next : ''}.`); return false; }
  curBiz = id; cart = {}; view = 'menu'; return true;
}
let cuid = J.store.get('musteri_id', null);
let prof = null;                       // giriş yapan müşterinin kaydı (DB 'customers')
// Giriş yapmamış ziyaretçi: menüleri gezebilir, sepet doldurabilir; sipariş anında giriş istenir
function guestProf(){
  const k = J.store.get('misafir_konum', null) || J.store.get('konum_taslak', null), c0 = J.settings().center || J.DEFAULT_POS;
  return {id:null, guest:true, name:'', note: J.store.get('adres_taslak', '') || (k ? 'Konumun' : 'Konum seçilmedi'), lat: k ? k.lat : c0.lat, lng: k ? k.lng : c0.lng, loc_src: k ? 'gps' : null};
}
const loadProf = () => { prof = cuid ? (DB.get('customers', cuid) || null) : guestProf(); return prof; };
const isGuest = () => !prof || prof.guest;
let afterLogin = null, placing = false;   // placing: çift dokunuşta iki sipariş oluşmasın   // girişten sonra dönülecek ekran
const GUEST_VIEWS = ['liste', 'menu', 'sepet', 'giris'];
function needLogin(next, msg){ afterLogin = next; loginErr = ''; showReg = false; J.toast(msg || 'Devam etmek için giriş yap ya da hesap oluştur.'); go('giris'); }
let view = 'giris', loginErr = '', regErr = '', showReg = false;
let cart = {}, curBiz = null, trackId = J.store.get('musteri_takip', null), draft = null;
let q = '', group = 'Hepsi', orderNote = '', tip = 0, tipCustom = false, prio = false, sched = null;
const TIPS = [0, 10, 20, 30, 50];
const tipBox = (sel, act, custom) => `<div class="m-tips">${TIPS.map(v => `<button class="${sel===v && !custom?'on':''}" data-a="${act}" data-v="${v}">${v?J.tl(v):'Yok'}</button>`).join('')}<button class="${custom?'on':''}" data-a="${act}" data-v="diger">Diğer</button></div>`;
let map = null, wantMap = false, pendingFit = null;
const me = () => prof && !prof.guest ? {type:'musteri', id:prof.id, name:prof.name} : null;
const GROUPS = [['Hepsi','layout-dashboard','Hepsi'],['Yemek','utensils','Yemek'],['Market','shopping-cart','Market'],['Kahve & Tatlı','coffee','Kahve'],['Ücretsiz','gift','Ücretsiz']];
const TABS = ['liste','siparisler','hesap'];

function ensureMap(){ if(!map){ map = J.Map(document.getElementById('map')); map.onClick(p => { if(view==='profil'){ draft.lat = p.lat; draft.lng = p.lng; draft.src = 'harita'; map._fitted = 'p'+p.lat+','+p.lng; render(); } }); } }
// Harita tek bir eleman; çizimden önce evine alınır, sonra sayfadaki #mapslot'a taşınır
function parkMap(){ const m = document.getElementById('map'); document.getElementById('maphome').appendChild(m); }
function placeMap(){
  const slot = document.getElementById('mapslot');
  if(!slot || !wantMap) return;
  slot.appendChild(document.getElementById('map'));
  map.invalidate();
  if(pendingFit){ map.fit(pendingFit[0], pendingFit[1]); pendingFit = null; }
  setTimeout(() => map && map.invalidate(), 60);
}
function showMap(on){ wantMap = on; if(on) ensureMap(); }

const myOrders = () => prof && !prof.guest ? J.orders().filter(o => o.customer && o.customer.id === prof.id) : [];
const activeOrders = () => myOrders().filter(o => o.state==='aktif');
const bizOpen = b => b && b.open && J.isAlive(b) && !b.suspended;
const cover = b => `background:linear-gradient(135deg, ${J.bizColor(b)}, ${J.bizColor(b)}cc)`;
const soft = b => `background:${J.bizColor(b)}22`;
const cartCount = () => Object.values(cart).reduce((s,n) => s+n, 0);
function cartSum(b){ return J.cartLines(b, cart).reduce((t,l) => t + l.unit*l.qty, 0); }
const inCart = mid => Object.keys(cart).filter(k => k === mid || k.startsWith(mid+'|')).reduce((t,k) => t + cart[k], 0);
let sheet = null, sort = 'onerilen', addrPick = false, useCoupon = true, mayorChecked = false;
const SORTS = [['onerilen','Önerilen'],['yakin','En yakın'],['hizli','En hızlı'],['puan','Puan']];
const ldisc = (b, sub) => { const lp = prof && J.loyaltyProgress(b, prof.id); return lp && lp.eligible ? Math.min(lp.amount, sub) : 0; };
const loyalStrip = b => { const lp = prof && J.loyaltyProgress(b, prof.id); if(!lp) return '';
  return `<div class="m-loyal"><div class="row"><b>${J.ic('award',15)} Sadakat kartı</b><span class="small">${lp.eligible?`<b style="color:var(--ok)">Bu siparişte ${J.tl(lp.amount)} indirim!</b>`:`${lp.count}/${lp.every}`}</span></div><div class="dots">${Array.from({length:lp.every}, (_,i) => `<i class="${i<lp.count?'on':''} ${i===lp.every-1?'gift':''}"></i>`).join('')}</div><div class="tiny muted">Her ${lp.every}. siparişinde ${J.tl(lp.amount)} indirim · işletmenin hediyesi</div></div>`; };
const cdisc = (b, sub) => { const cp = J.activeCoupon(prof); return cp && useCoupon && b && b.race_join ? Math.max(0, Math.min(cp.per, cp.left, sub - ldisc(b, sub))) : 0; };
const algLine = m => m.alg && m.alg.length ? `<div class="m-alg">${J.ic('info',13)} İçerir: ${m.alg.map(k => J.esc(J.ALLERGENS[k]||k)).join(', ')}</div>` : '';
const favs = () => (prof && prof.favs) || [];
const addrs = () => (prof && prof.addresses) || [];
let rate = {id:null, biz:0, cour:0, note:''};
let clm = {id:null, open:false, picks:{}, reason:'eksik', note:'', photo:null};   // sorun bildirimi taslağı   // değerlendirme taslağı
const stars = (act, val) => `<div class="m-stars">${[1,2,3,4,5].map(v => `<button class="${v<=val?'on':''}" data-a="${act}" data-v="${v}" aria-label="${v} yıldız">${J.ic('star',30, v<=val?'fill':'')}</button>`).join('')}</div>`;   // seçenek penceresi: {mid, sel:[], qty}
function fees(b){ return b.free_delivery ? {del:0, plat:0} : {del:J.FEE.custDel, plat:J.FEE.custPlat}; }
function etaTxt(b){ const [a,z] = J.etaRange(b, prof); return `${a}-${z} dk`; }
const ST = {aktif:['brand','Yolda / hazırlanıyor'], teslim:['ok','Teslim edildi'], red:['bad','Reddedildi'], ulasilamadi:['bad','Ulaşılamadı'], iptal:['bad','İptal edildi']};

/* ---------- Giriş ---------- */
function renderLogin(){
  showMap(false);
  const top = `<div class="m-login"><div class="logo">Jet<span>gel</span></div><div class="muted small">Komisyonsuz yemek ve market. Teslimat ücretinin tamamı kuryeye.</div></div>`;
  if(showReg) return top + `<div class="m-body"><div class="card"><h3>Hesap oluştur</h3>
    <label class="f" for="r-name">Adın</label><input id="r-name" placeholder="Örn. Ayşe">
    <label class="f" for="r-user">Kullanıcı adı</label><input id="r-user" autocapitalize="none">
    <label class="f" for="r-pass">Şifre</label><input id="r-pass" type="password">
    <div class="note">Prototip: şifreler güvenli saklanmıyor, gerçek şifreni kullanma.</div>
    ${regErr?`<div class="small" style="color:var(--bad);margin-top:8px">${J.esc(regErr)}</div>`:''}
    <button class="brand wide" style="margin-top:12px" data-a="register">Hesap oluştur</button><div class="tiny muted" style="text-align:center;margin-top:8px">Devam ederek <a href="yasal.html#sartlar" target="_blank">kullanım koşullarını</a> ve <a href="yasal.html#kvkk" target="_blank">aydınlatma metnini</a> kabul etmiş olursun.</div><button class="ghost wide" data-a="show-login">‹ Girişe dön</button></div></div>`;
  return top + `<div class="m-body">` + J.loginForm({title: afterLogin==='sepet' ? 'Siparişi tamamla' : 'Hoş geldin', sub: afterLogin==='sepet' ? 'Sepetin hazır. Siparişi vermek için giriş yap ya da hızlıca hesap oluştur.' : 'Sipariş vermek için giriş yap.', ph:'test', hint:'test', err:loginErr}) + `<button class="ghost wide" data-a="show-reg">Hesabın yok mu? Oluştur</button><button class="ghost wide" data-a="browse">${afterLogin==='sepet' ? 'Sepete geri dön' : 'Giriş yapmadan göz at'}</button></div>`;
}

/* ---------- Adres / profil ---------- */
function renderProfile(){
  const c0 = J.settings().center || J.DEFAULT_POS;
  if(!draft) draft = Object.assign({lat:c0.lat, lng:c0.lng, src:'varsayilan'}, prof || {});
  if(!draft.note && J.store.get('adres_taslak', '')) draft.note = J.store.get('adres_taslak', '');
  showMap(true);
  map.set('ev', draft, J.ic('house',16), 'home'); map.keep(['ev']); map.clearLine('r');
  const fk = 'p'+draft.lat+','+draft.lng; if(map._fitted !== fk){ pendingFit = [[draft], 16]; map._fitted = fk; }
  return `${topBar(prof && prof.name ? 'Teslimat adresi' : 'Hoş geldin', prof && prof.name ? 'back' : '')}
    <div id="mapslot"></div>
    <div class="m-body"><div class="m-box"><div class="small muted">Haritaya dokunarak ya da konumunu bularak teslimat noktanı seç. Telefon numarası istemiyoruz; kuryeyle uygulama içinden konuşursun.</div>
    <button class="sec wide" style="margin-top:10px" data-a="gps">${J.ic('locate-fixed',16)} Konumumu bul</button>
    <div class="tiny muted" style="margin-top:6px">Seçili nokta: ${(draft.src||draft.loc_src)==='gps'?'telefonunun konumu':(draft.src||draft.loc_src)==='harita'?'haritada seçtiğin nokta':'kayıtlı nokta'}</div>
    <label class="f" for="p-name">Adın</label><input id="p-name" value="${J.esc(draft.name)}" placeholder="Örn. Ayşe" autocomplete="given-name">
    <label class="f">Adres adı</label><div class="m-sort" style="margin:0">${['Ev','İş','Diğer'].map(l => `<button class="${(draft.addr_label||'Ev')===l?'on':''}" data-a="lbl" data-v="${l}">${l}</button>`).join('')}</div>
    <label class="f" for="p-note">Adres tarifi</label><input id="p-note" value="${J.esc(draft.note)}" placeholder="Örn. Moda Cd. No 12, kat 3, zil: Yılmaz">
    <button class="brand wide" style="margin-top:14px" data-a="save-prof">Kaydet</button></div></div>`;
}

/* ---------- Keşfet ---------- */
function header(){
  return `<div class="m-head"><div class="r1"><button class="m-addr" data-a="addr-pick"><span class="ic">${J.ic('map-pin',18)}</span><span class="t"><span class="k">${J.esc(prof.addr_label || 'Teslimat adresi')}</span><span class="v">${J.esc(prof.note || 'Konumun')}</span></span></button><span class="mode">${J.modeBadge()}</span></div>
    <div class="m-search"><input id="q" type="search" placeholder="Restoran, market ya da ürün ara" value="${J.esc(q)}" autocomplete="off"></div></div>`;
}
let starId = null;
function restCard(x){
  const {b, d, open} = x;
  const fee = b.free_delivery ? '<span class="tag ok">Ücretsiz teslimat</span>' : '';
  return `<div class="m-rest ${open?'':'m-closed'}" ${open?`data-a="open-biz" data-id="${b.id}"`:''}>
    <div class="m-cover" style="${cover(b)}"><div class="bdg">${b.id===starId?`<span class="tag star">${J.ic('award',13)} Mahallenin Yıldızı</span>`:''}${fee}${b.race_join && J.activeCoupon(prof)?'<span class="tag star">Kupon geçerli</span>':''}${open && J.isFull(b)?'<span class="tag busy">Şu an çok yoğun</span>':''}<span class="tag dark">Komisyonsuz</span></div><button class="m-fav ${favs().includes(b.id)?'on':''}" data-a="fav" data-id="${b.id}" aria-label="Favorilere ekle">${J.ic('heart',18)}</button><span class="cv-ic">${J.bizIcon(b,30)}</span>${open?`<span class="eta">${J.ic('clock',13)} ${etaTxt(b)}</span>`:''}</div>
    <div class="inf"><div class="nm">${J.esc(b.name)}</div><div class="m-meta">${J.ratingBadge(b)}<span>${J.esc(b.kind||J.bizGroup(b))}</span><span>${J.ic('map-pin',13)} ${J.fmtDist(d)}</span><span>${J.ic('bike',13)} ${b.free_delivery?'Ücretsiz teslimat':'Teslimat '+J.tl(J.FEE.custDel)}</span>${!open && J.hoursState(b) && J.hoursState(b).next?`<span style="color:var(--brand);font-weight:700">${J.ic('clock',13)} Açılış: ${J.esc(J.hoursState(b).next)}</span>`:''}</div></div></div>`;
}
function raceCard(){
  if(isGuest()) return '';
  const mh = J.mahalleOf(prof); if(!mh) return '';
  const board = J.raceBoard(mh), me = board.findIndex(p => p.id === prof.id);
  const ws = J.weekStart(), last = J.raceBoard(mh, ws - 7*864e5, ws)[0];
  const end = new Date(ws + 7*864e5 - 60000);
  const label = /^Bölge /.test(mh) ? 'Yakın çevren' : mh;
  return `<div class="m-race"><div class="rtop"><span class="ic">${J.ic('award',22)}</span><div><b>Mahalle yarışı · ${J.esc(label)}</b><small>Haftanın Mahalle Başkanı pazar gecesi belli olur</small></div></div>
    <ol>${board.slice(0,3).map((p,i) => `<li class="${p.id===prof.id?'me':''}"><span class="r">${i+1}</span><span class="n">${p.id===prof.id?'Sen':J.esc(J.maskName(p.name))}</span><b>${p.n} sipariş</b></li>`).join('') || '<li class="empty">Bu hafta henüz sıralama yok. İlk sen başla!</li>'}</ol>
    ${me >= 3 ? `<div class="mine">Sen ${me+1}. sıradasın · ${board[me].n} sipariş</div>` : me < 0 && board.length ? `<div class="mine">Henüz sıralamada değilsin</div>` : ''}
    <div class="prize">${J.ic('gift',15)} Başkana ${J.tl(J.COUPON.total)} indirim kuponu · katılan işletmelerde siparişte ${J.tl(J.COUPON.per)}'ye kadar</div>
    <div class="ft">${last?`Geçen haftanın başkanı: <b>${last.id===prof.id?'Sen':J.esc(J.maskName(last.name))}</b> · `:''}${J.tl(J.RACE_MIN)} ve üzeri teslim edilen siparişler sayılır · bitiş ${end.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</div></div>`;
}
// Mahalle adı: konum değişince bir kez sorgulanır; ulaşılamazsa yakın çevre bölgesi kullanılır
let mhBusy = false;
async function ensureMahalle(){
  if(mhBusy || !prof || prof.guest || prof.lat == null) return;
  const mp = prof.mahalle_pos;
  if(prof.mahalle && mp && J.dist(mp, prof) < 300) return;
  mhBusy = true;
  const pos = {lat:prof.lat, lng:prof.lng};
  let name = await J.lookupMahalle(pos);
  if(!name) name = `Bölge ${Math.round(pos.lat*40)}-${Math.round(pos.lng*40)}`;
  DB.patch('customers', prof.id, {mahalle:name, mahalle_pos:pos});
  mhBusy = false;
}
function renderList(){
  ensureMahalle();
  if(!mayorChecked && prof && prof.mahalle){ mayorChecked = true; J.claimMayorCoupon(prof).then(cp => { if(cp) J.toast(`Tebrikler, haftanın Mahalle Başkanı sensin! ${J.tl(cp.total)} kupon hesabına tanımlandı.`); }); }
  showMap(false);
  let h = header() + `<div class="m-body">`;
  const act = activeOrders();
  if(act.length) h += `<div class="m-active" data-a="track" data-id="${act[0].id}"><span class="m-active-ic">${J.ic('bike',22)}</span><div class="tx"><b>Siparişin yolda · #${J.esc(act[0].no)}</b><small>${J.esc(act[0].rname)} · takip etmek için dokun</small></div><span>›</span></div>`;
  const qn = J.norm(q);
  if(!qn){
    const G = J.activeCoupon(prof) ? GROUPS.concat([['Kupon','award','Kupon geçerli']]) : GROUPS;
    h += `<div class="m-chips">${G.map(([g,ic,l]) => `<button class="m-chip ${group===g?'on':''}" data-a="grp" data-id="${g}"><i>${J.ic(ic,24)}</i>${l}</button>`).join('')}</div>`;
    if(group==='Hepsi') h += `<div class="m-promo"><b>Komisyon yok, sürpriz ücret yok.</b><span>Teslimat ücretinin tamamı kuryeye gider. Ödeyeceğin her kuruşu sepette görürsün.</span></div>`;
    const cpn = J.activeCoupon(prof);
    if(cpn && group==='Hepsi') h += `<div class="m-coupon"><span class="ic">${J.ic('award',22)}</span><div><b>Başkan kuponun: ${J.tl(cpn.left)}</b><small>Kupon geçerli işletmelerde her siparişte ${J.tl(cpn.per)}'ye kadar · son gün ${new Date(cpn.exp).toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</small></div></div>`;
    if(group==='Hepsi') h += raceCard();
    const again = [], seen = new Set();
    myOrders().filter(o => o.state==='teslim').forEach(o => { if(!seen.has(o.rid) && again.length < 6){ seen.add(o.rid); again.push(o); } });
    if(again.length && group==='Hepsi') h += `<div class="m-h"><b>Tekrar sipariş ver</b><span>tek dokunuşla sepete</span></div><div class="m-row">${again.map(o => {
      const b = DB.get('businesses', o.rid);
      return `<div class="m-again"><div class="n">${J.esc(o.rname)}</div><div class="i">${o.items.map(i => i.qty+'× '+J.itemLabel(i)).join(', ')}</div><button class="sm sec" data-a="reorder" data-id="${o.id}" ${bizOpen(b)?'':'disabled'}>${bizOpen(b)?J.ic('rotate-ccw',14)+' Tekrarla':'Şu an kapalı'}</button></div>`; }).join('')}</div>`;
  }
  let list = J.businesses().filter(b => !b.suspended).map(b => ({b, d:J.dist(b, prof), open: bizOpen(b)})).filter(x => x.d < 5000);
  if(group==='Ücretsiz') list = list.filter(x => x.b.free_delivery);
  else if(group==='Kupon') list = list.filter(x => x.b.race_join);
  else if(group!=='Hepsi') list = list.filter(x => J.bizGroup(x.b)===group);
  let prods = [];
  if(qn){
    list.forEach(x => (x.b.menu||[]).forEach(m => { if(J.match(m.name+' '+(m.cat||''), q) && m.available!==false) prods.push({x, m}); }));
    list = list.filter(x => J.match(x.b.name+' '+(x.b.kind||''), q) || (x.b.menu||[]).some(m => J.match(m.name+' '+(m.cat||''), q)));
  }
  starId = J.starBusiness(list.map(x => x.b));
  const eta = b => J.etaRange(b, prof)[0], rt = b => { const r = J.ratingOf(b); return r.n >= J.RATING_MIN_N ? r.avg : 0; };
  const cmp = {yakin:(a,b) => a.d-b.d, hizli:(a,b) => eta(a.b)-eta(b.b) || a.d-b.d, puan:(a,b) => rt(b.b)-rt(a.b) || a.d-b.d,
    // Önerilen: yıldız, favori, sonra hizmet kalitesi ve mesafe. Kupon/kampanya katılımı sıralamaya girmez.
    onerilen:(a,b) => ((b.b.id===starId)-(a.b.id===starId)) || (favs().includes(b.b.id)-favs().includes(a.b.id)) || ((J.qualityScore(b.b, prof) - b.d/5000*0.3) - (J.qualityScore(a.b, prof) - a.d/5000*0.3))}[sort] || ((a,b) => a.d-b.d);
  list.sort((a,b) => (b.open-a.open) || cmp(a,b));
  if(qn && prods.length) h += `<div class="m-h"><b>Ürünler</b><span>${prods.length} sonuç</span></div><div class="m-prodres">${prods.slice(0,8).map(({x,m}) => `<div class="m-line" ${x.open?`data-a="open-biz" data-id="${x.b.id}"`:''} style="cursor:pointer"><div class="tx"><b>${J.esc(m.name)}</b><div class="tiny muted">${J.esc(x.b.name)}${x.open?'':' · kapalı'}</div></div><b class="money">${J.tl(m.price)}</b></div>`).join('')}</div>`;
  if(!qn){
    const fl = J.businesses().filter(b => favs().includes(b.id) && !b.suspended);
    if(fl.length && group==='Hepsi') h += `<div class="m-h"><b>Favorilerin</b><span>${fl.length}</span></div><div class="m-row">${fl.map(b => `<div class="m-favc ${bizOpen(b)?'':'off'}" ${bizOpen(b)?`data-a="open-biz" data-id="${b.id}"`:''}><span class="ph" style="${soft(b)}">${J.bizIcon(b,22)}</span><b>${J.esc(b.name)}</b><span class="tiny muted">${bizOpen(b)?etaTxt(b):'Kapalı'}</span></div>`).join('')}</div>`;
  }
  const openN = list.filter(x => x.open).length;
  h += `<div class="m-h"><b>${qn?'Restoranlar ve marketler':group==='Hepsi'?'Yakınındakiler':group}</b><span>${openN} açık</span></div>`;
  h += `<div class="m-sort">${SORTS.map(([k,l]) => `<button class="${sort===k?'on':''}" data-a="sort" data-id="${k}">${l}</button>`).join('')}</div>`;
  if(!list.length) h += `<div class="m-empty"><div>${J.ic('search',36)}</div>${qn?'Aramana uygun sonuç yok.':'Yakınında bu türde işletme yok.'}</div>`;
  list.forEach(x => h += restCard(x));
  if(J.notifPermission()==='default') h += `<div class="m-box small"><b>${J.ic('bell',15)} Kurye kapına gelince haber verelim mi?</b><div class="muted">Zorunlu değil.</div><div class="btns"><button class="sm brand" data-a="notif">Bildirimleri aç</button></div></div>`;
  return h + `</div>`;
}

/* ---------- Restoran sayfası ---------- */

  const b = DB.get('businesses', curBiz);
  if(!bizOpen(b)){ view = 'liste'; return renderList(); }
  const f = fees(b), menu = b.menu||[];
  const cats = []; menu.forEach(m => { const c = m.cat || 'Menü'; if(!cats.includes(c)) cats.push(c); });
  let h = `<div class="m-hero" style="${cover(b)}"><button class="back" data-a="back" aria-label="Geri">${J.ic('chevron-left',22)}</button><span class="cv-ic big">${J.bizIcon(b,44)}</span></div>
    <div class="m-rinfo"><h1>${J.esc(b.name)}</h1><div class="m-meta">${J.ratingBadge(b)}<span>${J.esc(b.kind||'')}</span><span>${J.ic('map-pin',13)} ${J.fmtDist(J.dist(b,prof))}</span><span style="color:var(--ok);font-weight:700">● Açık</span></div>
    <div class="m-facts"><div><b>${etaTxt(b)}</b><span>Teslim süresi</span></div><div><b>${f.del?J.tl(f.del):'Ücretsiz'}</b><span>Teslimat (kuryeye)</span></div><div><b>${f.plat?J.tl(f.plat):'—'}</b><span>Hizmet bedeli</span></div></div>${loyalStrip(b)}${b.min_order > 0 ? `<div class="tiny muted" style="margin-top:8px">Minimum sipariş tutarı: <b>${J.tl(b.min_order)}</b></div>` : ''}${J.isFull(b) ? `<div class="m-busy">${J.ic('hourglass',16)} <span><b>Şu an çok yoğun.</b> İşletme mevcut siparişleri hazırlıyor; birkaç dakika içinde yeniden sipariş alır. Dilersen ileri bir saate planlı sipariş verebilirsin.</span></div>` : ''}</div>`;
  if(cats.length > 1) h += `<div class="m-cats">${cats.map((c,i) => `<button data-a="jump" data-id="cat${i}">${J.esc(c)}</button>`).join('')}</div>`;
  h += `<div class="m-menu">`;
  cats.forEach((c,i) => {
    h += `<h4 id="cat${i}">${J.esc(c)}</h4>`;
    menu.filter(m => (m.cat||'Menü')===c).forEach(m => {
      const av = m.available !== false, hasOpt = (m.opts||[]).length > 0, n = hasOpt ? inCart(m.id) : (cart[m.id] || 0);
      const ctl = !av ? '' : hasOpt ? `<button class="m-add" data-a="opt-open" data-id="${m.id}" aria-label="Seçenekleri gör">+</button>${n?`<span class="m-badge">${n}</span>`:''}` : n ? `<div class="m-step"><button data-a="dec" data-id="${m.id}" aria-label="Azalt">−</button><b>${n}</b><button data-a="inc" data-id="${m.id}" aria-label="Arttır">+</button></div>` : `<button class="m-add" data-a="inc" data-id="${m.id}" aria-label="Sepete ekle">+</button>`;
      h += `<div class="m-item ${av?'':'off'}"><div class="tx"><div class="nm">${J.esc(m.name)}</div>${m.desc?`<div class="ds">${J.esc(m.desc)}</div>`:''}${algLine(m)}<div class="pr">${J.tl(m.price)}${av?'':' · <span style="color:var(--bad)">Tükendi</span>'}${hasOpt&&av?' <span class="m-optnote">· seçenekli</span>':''}</div></div>${m.photo?`<div class="mph"><img src="${m.photo}" alt="${J.esc(m.name)}" loading="lazy"><div class="act">${ctl}</div></div>`:`<div class="act">${ctl}</div>`}</div>`;
    });
  });
  if(!menu.length) h += `<div class="m-empty"><div>${J.ic('list',36)}</div>Bu işletme henüz ürün eklemedi.</div>`;
  return h + `</div>`;
}

/* ---------- Sepet ---------- */
function topBar(title, back){ return `<div class="m-top">${back?`<button class="back" data-a="${back}" aria-label="Geri">‹</button>`:''}<b>${title}</b></div>`; }
function renderCart(){

      <button class="ghost sm" data-a="to-menu">+ Ürün ekle</button></div>
    <div class="m-box"><h3>İşletmeye not</h3><textarea id="o-note" class="m-note" maxlength="200" placeholder="Örn. soğansız olsun, zile basmayın">${J.esc(orderNote)}</textarea></div>
    ${(() => { const cp = J.activeCoupon(prof); if(!cp) return ''; if(!b.race_join) return `<div class="note" style="margin:0 0 12px">${J.ic('award',14)} Başkan kuponun bu işletmede geçerli değil (işletme kampanyaya katılmıyor).</div>`;
      return `<button class="m-prio ${useCoupon?'on':''}" data-a="coupon"><span class="ic">${J.ic('award',20)}</span><span class="tx"><b>Başkan kuponu · −${J.tl(Math.min(cp.per, cp.left, sub))}</b><small>Kalan bakiye ${J.tl(cp.left)}. İndirimi işletme karşılar.</small></span><span class="sw"></span></button>`; })()}
    <div class="m-box"><h3>${J.ic('clock',16)} Ne zaman gelsin?</h3><div class="m-sort" style="margin:0"><button class="${sched?'':'on'}" data-a="sched-now">Hemen</button><button class="${sched?'on':''}" data-a="sched-later">İleri bir saat</button></div>
      ${sched?`<select id="sched-sel" style="margin-top:10px">${J.schedSlots(b).map(t => `<option value="${t}" ${t===sched?'selected':''}>${J.fmtSched(t)}</option>`).join('')}</select><div class="tiny muted" style="margin-top:6px">Siparişin teslim saatinden ${J.SCHED_LEAD} dk önce işletmeye iletilir. Ödeme o zamana kadar sadece bloke edilir.</div>`:''}</div>
    <button class="m-prio ${prio?'on':''}" data-a="prio"><span class="ic">${J.ic('timer',20)}</span><span class="tx"><b>Hızlı teslimat · +${J.tl(J.FEE.priority)}</b><small>İşletme siparişini öne alır, kurye daha hızlı atanır. Hedef: 5-10 dk daha erken. Ücretin tamamı kuryeye.</small></span><span class="sw"></span></button>
    <div class="m-box"><h3>${J.ic('heart-handshake',16)} Kuryeye bahşiş</h3><div class="tiny muted" style="margin:-4px 0 10px">İsteğe bağlı. Bahşişin tamamı kuryeye gider, kesinti yapılmaz.</div>${tipBox(tip, 'tip', tipCustom)}${tipCustom?`<input id="tip-in" inputmode="numeric" placeholder="Tutar (TL)" value="${tip||''}" style="margin-top:8px">`:''}</div>
    <div class="m-box m-sum"><h3>Ödeme özeti</h3>
      <div class="row"><span>Ürünler</span><span class="money">${J.tl(sub)}</span></div>
      <div class="row"><span>Teslimat ücreti<small>Tamamı kuryeye gider</small></span><span class="money">${f.del?J.tl(f.del):'<span style="color:var(--ok)">Ücretsiz</span>'}</span></div>
      <div class="row"><span>Hizmet bedeli<small>Platformun sipariş başına sabit payı</small></span><span class="money">${f.plat?J.tl(f.plat):'—'}</span></div>
      ${ldisc(b, sub)?`<div class="row" style="color:var(--ok)"><span>Sadakat indirimi<small>${J.esc(b.name)} teşekkür ediyor</small></span><span class="money">−${J.tl(ldisc(b, sub))}</span></div>`:''}
      ${cdisc(b, sub)?`<div class="row" style="color:var(--ok)"><span>Başkan kuponu<small>İşletmenin katkısı</small></span><span class="money">−${J.tl(cdisc(b, sub))}</span></div>`:''}
      ${prio?`<div class="row"><span>Hızlı teslimat<small>Tamamı kuryeye gider</small></span><span class="money">${J.tl(J.FEE.priority)}</span></div>`:''}
      ${tip?`<div class="row"><span>Kurye bahşişi<small>Tamamı kuryeye gider</small></span><span class="money">${J.tl(tip)}</span></div>`:''}
      <div class="row tot"><b>Toplam</b><b class="money">${J.tl(sub+f.del+f.plat+tip+(prio?J.FEE.priority:0)-cdisc(b, sub)-ldisc(b, sub))}</b></div></div>

}

/* ---------- Takip ---------- */
function renderTrack(){
  const o = DB.get('orders', trackId);
  if(!o){ view = 'liste'; return renderList(); }
  const b = DB.get('businesses', o.rid), c = o.courier_id && DB.get('couriers', o.courier_id);
  showMap(true);
  map.set('ev', o.customer, J.ic('house',16), 'home');
  if(b) map.set('biz', b, J.bizIcon(b,16), '');
  const showC = c && ['isletmeye','isletmede','yolda','kapida'].includes(o.del);
  if(showC) map.set('kurye', c, J.ic('bike',16), 'cour busy', c.name); else map.remove('kurye');
  map.keep(['ev','biz','kurye']);
  if(!map._fitted || map._fitted !== o.id + o.del){ pendingFit = [[o.customer, b, showC ? c : null]]; map._fitted = o.id + o.del; }
  const D = ['yolda','kapida','teslim','ulasilamadi'];
  // 4 aşama: onay, hazırlık, yolda, teslim
  const done = [o.prep!=='bekliyor' && o.state!=='red', o.prep==='hazir' || D.includes(o.del), ['kapida','teslim','ulasilamadi'].includes(o.del) || o.state==='teslim', o.state==='teslim'];
  const now = o.state==='aktif' ? done.indexOf(false) : -1;
  const ride = (from) => Math.max(1, Math.round(J.dist(from, o.customer)*1.3/J.M_PER_MIN));
  let k = 'Tahmini varış', v = '', sub = '';
  if(o.state==='aktif'){
    let mins = null;
    if(o.del==='kapida'){ v = 'Kuryen kapında'; sub = 'Teslimat kodunu kuryeye söyle'; }
    else if(o.del==='yolda' && c){ mins = ride(c); sub = 'Kuryen siparişini getiriyor'; }
    else if(J.isHeld(o)){ v = 'Planlı sipariş'; sub = J.fmtSched(o.sched_at) + ' teslim edilecek'; }
    else if(o.prep==='bekliyor'){ v = 'Onay bekleniyor'; sub = 'İşletme siparişini birazdan onaylayacak'; }
    else { const left = o.prep==='hazirlaniyor' ? Math.max(0, Math.ceil((o.prep_until - J.now())/J.minMs())) : 0; mins = left + (b ? ride(b) : 10); sub = o.prep==='hazir' ? 'Siparişin hazır, kurye alacak' : o.del==='araniyor' ? 'Hazırlanıyor · yakındaki kuryeler aranıyor' : 'Siparişin hazırlanıyor'; }
    if(mins != null){ k = 'Tahmini varış'; v = `${mins}-${mins+5} dk`; }
  } else { k = '#'+o.no; v = ST[o.state][1]; sub = J.esc(o.rname); }
  let h = topBar(`#${J.esc(o.no)} · ${J.esc(o.rname)}`, 'back') + `<div class="m-eta"><div class="k">${k}${o.priority&&o.state==='aktif'?` <span class="pill brand">${J.ic('timer',11)} Hızlı teslimat</span>`:''}</div><div class="v">${v}</div><div class="s">${sub}</div>
    ${!['red','iptal'].includes(o.state)?`<div class="m-prog">${done.map((d,i) => `<span class="${d?'done':i===now?'now':''}"></span>`).join('')}</div><div class="m-prog-l">${['Onay','Hazırlık','Yolda','Teslim'].map((t,i) => `<span class="${done[i]||i===now?'on':''}">${t}</span>`).join('')}</div>`:''}</div>
    <div id="mapslot"></div><div class="m-body">`;
  if(o.state==='aktif' && ['yolda','kapida'].includes(o.del)){
    h += `<div class="m-pin"><small>TESLİMAT KODUN</small><div class="d">${String(o.pin).split('').map(d => `<span>${J.esc(d)}</span>`).join('')}</div><small>Kodu yalnızca kurye kapına geldiğinde söyle. Kurye ${J.PIN_RADIUS_M} m'den uzaksa kod çalışmaz.</small></div>`;
  }
  if(o.state==='aktif'){
    h += `<div class="m-box">`;
    if(c) h += `<div class="m-person"><div class="av">${J.ic('bike',22)}</div><div class="tx"><b>${J.esc(c.name)}</b><span class="small muted">Kuryen${o.del==='yolda'?' · '+J.fmtDist(J.dist(c,o.customer))+' uzakta':''}</span></div><button class="m-call" data-a="call" data-to="kurye:${c.id}" aria-label="Kuryeyi ara">${J.ic('phone',18)}</button></div><div style="height:12px"></div>`;
    else if(o.del==='araniyor') h += `<div class="m-person"><div class="av">${J.ic('search',20)}</div><div class="tx"><b>Kurye aranıyor</b><span class="small muted">Yakındaki kuryelere teklif gidiyor</span></div></div><div style="height:12px"></div>`;
    h += `<div class="m-person"><div class="av" style="${b?soft(b):''}">${J.bizIcon(b,20)}</div><div class="tx"><b>${J.esc(o.rname)}</b><span class="small muted">İşletme</span></div><button class="m-call" data-a="call" data-to="isletme:${o.rid}" aria-label="İşletmeyi ara">${J.ic('phone',18)}</button></div>
      <div class="note">Arama internet üzerinden yapılır, numaralar gizli kalır. İşletmeler müşteri aramalarına dönmekle yükümlüdür.</div></div>`;
    h += `<div class="m-box"><h3>${J.ic('message-square',16)} Mesajlar</h3>${J.msgBox(o, 'musteri', 'qm')}</div>`;
    J.msgNotify(o, 'musteri');
  }
  if(o.state==='ulasilamadi') h += `<div class="card bad small">Kurye adresinde bekledi ve seni aradı, ulaşamadı. Kurallar gereği bu siparişte iade yapılmaz.</div>`;
  if(o.state==='red') h += `<div class="card bad small"><b>${J.esc(J.REJECT_REASONS[o.reject_reason] || J.REJECT_REASONS.diger)}.</b>${o.reject_items && o.reject_items.length ? ` Tükenen: ${o.reject_items.map(J.esc).join(', ')}.` : ''} İşletme siparişi kabul edemedi. Kartındaki blokaj kaldırıldı, para çekilmedi.</div>`;
  if(o.state==='aktif' && o.prep==='hazirlaniyor' && o.prep_ext) h += `<div class="card small">${J.ic('clock',15)} İşletme siparişin için ${o.prep_ext_min} dk ek süre istedi; tahmini teslim saati güncellendi.</div>`;
  if(o.state==='iptal') h += `<div class="card bad small">Sipariş destek ekibimiz tarafından iptal edildi${o.cancel_reason ? ' (' + J.esc(o.cancel_reason) + ')' : ''}. ${o.pay==='iade' ? 'Ödediğin tutarın tamamı kartına iade edildi.' : 'Kartındaki blokaj kaldırıldı, para çekilmedi.'}</div>`;
  h += `<div class="m-box m-sum"><h3>Sipariş detayı</h3>${o.items.map(i => `<div class="row"><span>${i.qty}× ${J.itemLabel(i)}</span><span class="money">${J.tl(i.qty*i.price)}</span></div>`).join('')}
    <div class="row"><span>Teslimat + hizmet bedeli</span><span class="money">${o.fees.cust?J.tl(o.fees.cust):'Ücretsiz'}</span></div>
    ${o.loyalty_disc?`<div class="row" style="color:var(--ok)"><span>Sadakat indirimi</span><span class="money">−${J.tl(o.loyalty_disc)}</span></div>`:''}
    ${o.claim_refund?`<div class="row" style="color:var(--ok)"><span>İade (sorun bildirimi)</span><span class="money">−${J.tl(o.claim_refund)}</span></div>`:''}
    ${o.discount?`<div class="row" style="color:var(--ok)"><span>Başkan kuponu</span><span class="money">−${J.tl(o.discount)}</span></div>`:''}
    ${o.priority?`<div class="row"><span>Hızlı teslimat</span><span class="money">${J.tl(o.prio_fee)}</span></div>`:''}
    ${o.tip||o.tip_after?`<div class="row"><span>Kurye bahşişi</span><span class="money">${J.tl((o.tip||0)+(o.tip_after||0))}</span></div>`:''}
    ${o.refund?`<div class="row" style="color:var(--ok)"><span>İade (işletme ikazı)</span><span class="money">−${J.tl(o.refund)}</span></div>`:''}
    <div class="row tot"><b>Toplam</b><b class="money">${J.tl(o.subtotal + o.fees.cust + (o.tip||0) + (o.tip_after||0) + (o.prio_fee||0) - (o.discount||0) - (o.loyalty_disc||0) - (o.refund||0) - (o.claim_refund||0))}</b></div>
    ${o.note?`<div class="tiny muted" style="margin-top:8px">Not: ${J.esc(o.note)}</div>`:''}<div style="margin-top:10px">${J.payPill(o)}</div></div>`;
  if(o.state==='teslim') h += claimBox(o);
  if(o.state==='teslim' && !o.rated){
    if(rate.id !== o.id) rate = {id:o.id, biz:0, cour:0, note:''};
    h += `<div class="m-box m-rate"><h3>Siparişin nasıldı?</h3>
      <div class="small muted">${J.esc(o.rname)}</div>${stars('rate-b', rate.biz)}
      ${o.courier_id?`<div class="small muted" style="margin-top:6px">Kurye${(() => { const c = DB.get('couriers', o.courier_id); return c ? ' · ' + J.esc(c.name) : ''; })()}</div>${stars('rate-c', rate.cour)}`:''}
      <textarea id="rate-note" class="m-note" maxlength="300" placeholder="Eklemek istediğin bir şey var mı? (isteğe bağlı)" style="margin-top:10px">${J.esc(rate.note)}</textarea>
      <button class="brand wide" style="margin-top:10px" data-a="rate-send" ${rate.biz||rate.cour?'':'disabled'}>Değerlendirmeyi gönder</button></div>`;
  }
  if(o.state==='teslim' && o.rated && o.rating) h += `<div class="m-fair"><i>${J.ic('star',20)}</i><div><b>Değerlendirmen için teşekkürler.</b> İşletme ${o.rating.biz||'-'}/5${o.courier_id?` · Kurye ${o.rating.cour||'-'}/5`:''}</div></div>`;
  if(o.state==='teslim' && o.courier_id && !o.tip && !o.tip_after) h += `<div class="m-box"><h3>${J.ic('heart-handshake',16)} Kuryene bahşiş bırak</h3><div class="tiny muted" style="margin:-4px 0 10px">Memnun kaldıysan teşekkür et. Tamamı kuryeye gider.</div><div class="m-tips">${[20,30,50,100].map(v => `<button data-a="tip-after" data-v="${v}">${J.tl(v)}</button>`).join('')}</div></div>`;
  if(o.state==='teslim' && o.tip_after) h += `<div class="m-fair"><i>${J.ic('heart-handshake',22)}</i><div><b>Teşekkürler!</b> ${J.tl(o.tip_after)} bahşişin kuryene iletildi.</div></div>`;
  if(o.state==='teslim' && bizOpen(b)) h += `<button class="brand wide" data-a="reorder" data-id="${o.id}">${J.ic('rotate-ccw',16)} Aynısını tekrar sipariş ver</button>`;
  if(o.del==='kapida' && o.state==='aktif'){ J.notify('kapi-'+o.id, 'Kuryen kapında', 'Teslimat kodun: ' + o.pin); J.alarm('kapi', true, 'ok', 6000); } else J.alarm('kapi', false);
  return h + `</div>`;
}

function claimBox(o){
  if(o.claim){
    const c = o.claim, ok = c.state === 'onaylandi';
    return `<div class="m-box"><h3>${J.ic('triangle-alert',16)} Sorun bildirimin</h3><div class="row small"><span>${J.esc(J.CLAIM_REASONS[c.reason]||'')} · ${c.picks.map(p => `${p.qty}× ${J.esc((o.items[p.i]||{}).name||'')}`).join(', ')}</span><b class="money">${J.tl(c.amount)}</b></div>

    <div class="lbl">Hangi ürünler?</div>${o.items.map((it,i) => `<button class="m-pick ${clm.picks[i]?'on':''}" data-a="clm-item" data-i="${i}"><span class="ck">${clm.picks[i]?J.ic('check',14):''}</span><span class="nm">${it.qty}× ${J.itemLabel(it)}</span><span class="pr">${J.tl(it.price*it.qty)}</span></button>`).join('')}
    <div class="lbl">Sorun ne?</div><div class="m-sort" style="flex-wrap:wrap;overflow:visible">${Object.entries(J.CLAIM_REASONS).map(([k,v]) => `<button class="${clm.reason===k?'on':''}" data-a="clm-reason" data-v="${k}">${v}</button>`).join('')}</div>
    <textarea id="clm-note" class="m-note" maxlength="300" placeholder="Kısaca anlat (isteğe bağlı)">${J.esc(clm.note)}</textarea>
    ${clm.photo?`<div class="m-photo"><img src="${clm.photo}" alt="Fotoğraf"><button class="sm sec" data-a="clm-photo-del">Kaldır</button></div>`:`<label class="btnlink" style="margin-top:8px;cursor:pointer">${J.ic('camera',15)} Fotoğraf ekle<input type="file" accept="image/*" capture="environment" id="clm-photo" style="display:none"></label>`}
    <div class="row" style="margin-top:12px"><span class="small">İade tutarı</span><b class="money">${J.tl(J.claimAmount(o, picks))}</b></div>
    <div class="p-act" style="display:flex;gap:8px;margin-top:10px"><button class="brand" style="flex:1" data-a="clm-send" ${picks.length?'':'disabled'}>Bildir</button><button class="sec" data-a="clm-close">Vazgeç</button></div></div>`;
}

      <div class="addrs">${list.map(ad => { const cur = (prof.addr_id ? prof.addr_id === ad.id : ad.id === '_cur'); return `<div class="m-addrrow ${cur?'on':''}"><button class="pick" data-a="${ad.id==='_cur'?'addr-close':'addr-use'}" data-id="${ad.id}"><span class="ai">${J.ic(ad.label==='İş'?'store':ad.label==='Ev'?'house':'map-pin',18)}</span><span class="tx"><b>${J.esc(ad.label)}</b><span class="tiny muted">${J.esc(ad.note||'Adres tarifi yok')}</span></span>${cur?J.ic('check',18):''}</button>${ad.id!=='_cur'?`<button class="ed" data-a="addr-edit" data-id="${ad.id}" aria-label="Düzenle">${J.ic('notebook-pen',16)}</button>`:''}${ad.id!=='_cur'&&!cur?`<button class="ed" data-a="addr-del" data-id="${ad.id}" aria-label="Sil">${J.ic('x',16)}</button>`:''}</div>`; }).join('')}</div>
      <div class="ft"><button class="brand wide" data-a="addr-new">${J.ic('plus',16)} Yeni adres ekle</button></div></div>`;
  }
  const el = document.getElementById('msheet'); if(el.innerHTML !== h) el.innerHTML = h;

function render(){
  loadProf();
  if(isGuest() && !GUEST_VIEWS.includes(view)){ afterLogin = view; view = 'giris'; }

  parkMap();
  const html = (R[view] || renderList)();
  J.render(document.getElementById('panel'), html);
  placeMap();
  renderBar();

}
let lastCall = '';
function renderCall(){ const m = me(); const h = m ? J.callOverlay(m) : ''; if(h !== lastCall){ document.getElementById('call').innerHTML = h; lastCall = h; } }
const go = v => { view = v; window.scrollTo(0,0); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id;
  if(a==='gps'){
    if(!navigator.geolocation){ J.toast('Bu tarayıcı konum desteklemiyor.'); return; }
    J.toast('Konum alınıyor…');
    navigator.geolocation.getCurrentPosition(p => { draft.lat = p.coords.latitude; draft.lng = p.coords.longitude; draft.src = 'gps'; render(); }, err => J.toast('Konum alınamadı: ' + (err.message||'izin verilmedi')), {enableHighAccuracy:true, timeout:15000});
    return;
  }
  if(a==='jump'){ const t = document.getElementById(id); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(a==='save-prof'){
    draft.name = document.getElementById('p-name').value.trim(); draft.note = document.getElementById('p-note').value.trim();
    if(!draft.name){ J.toast('Lütfen adını yaz.'); return; }
    const label = draft.addr_label || 'Ev', aid = draft.addr_id || J.uid('a');
    // İlk kez adres defteri kullanılıyorsa mevcut adresi de "Ev" olarak sakla
    let base = addrs();
    if(!base.length && prof && !draft.addr_id && prof.lat != null && (prof.note || prof.loc_src)) base = [{id:J.uid('a'), label:prof.addr_label||'Ev', note:prof.note||'', lat:prof.lat, lng:prof.lng}];
    const book = base.filter(x => x.id !== aid).concat([{id:aid, label, note:draft.note, lat:draft.lat, lng:draft.lng}]).slice(-8);
    DB.patch('customers', cuid, {name:draft.name, note:draft.note, lat:draft.lat, lng:draft.lng, addr_label:label, addr_id:aid, addresses:book, loc_src: draft.src==='gps'||draft.src==='harita' ? draft.src : (prof && prof.loc_src) || null});
    if(draft.src==='gps') J.autoRelocate(draft);
    draft = null; const nx = afterLogin; afterLogin = null; go(nx && nx !== 'giris' && nx !== 'profil' ? nx : 'liste');
  }
  if(a==='show-reg'){ showReg = true; regErr = ''; }
  if(a==='browse'){ const nx = afterLogin === 'sepet' ? 'sepet' : 'liste'; afterLogin = null; go(nx); }
  if(a==='show-login'){ showReg = false; }
  if(a==='login'){
    J.login('customers', document.getElementById('l-user').value, document.getElementById('l-pass').value).then(r => {
      if(r.error) loginErr = r.error; else { loginErr = ''; cuid = r.id; J.store.set('musteri_id', r.id); const nx = afterLogin; afterLogin = null; go(nx && nx !== 'giris' ? nx : 'liste'); loadProf(); if(!nx) openPendingBiz(); setTimeout(() => { loadProf(); applyDraftAddr(); autoLocate(); }, 300); }
      render();
    });
    return;
  }
  if(a==='register'){
    const name = document.getElementById('r-name').value.trim(), user = document.getElementById('r-user').value.trim(), pass = document.getElementById('r-pass').value;
    if(!name || !user || !pass){ regErr = 'Tüm alanları doldur.'; render(); return; }
    if(pass.length < 6){ regErr = 'Şifre en az 6 karakter olmalı.'; render(); return; }
    if(J.userTaken(user)){ regErr = 'Bu kullanıcı adı alınmış.'; render(); return; }
    J.makeLogin(user, pass).then(login => {
      cuid = J.uid('m'); J.store.set('musteri_id', cuid); showReg = false;
      const k = J.store.get('misafir_konum', null);
      DB.put('customers', cuid, {name, note:'', lat: k ? k.lat : J.DEFAULT_POS.lat, lng: k ? k.lng : J.DEFAULT_POS.lng, loc_src: k ? 'gps' : null, login, terms_t:J.now()});
      draft = null; go('profil'); render();
    });
    return;
  }

  if(a==='logout'){ cuid = null; prof = null; draft = null; J.store.set('musteri_id', null); go('liste'); }
  if(a==='edit-prof'){ draft = Object.assign({}, prof); go('profil'); }
  if(a==='tab'){ go(id); }
  if(a==='grp'){ group = id; }
  if(a==='open-biz'){ if(curBiz !== id){ cart = {}; orderNote = ''; } curBiz = id; go('menu'); }
  if(a==='back'){ draft = null; go('liste'); }
  if(a==='to-menu'){ go('menu'); }
  if(a==='cart'){ go('sepet'); }
  if(a==='opt-open'){ sheet = {mid:id, sel:[], qty:1}; }
  if(a==='opt-close'){ sheet = null; }
  if(a==='opt-tog' && sheet){
    const i = +el.dataset.i, b = DB.get('businesses', curBiz), m = b && (b.menu||[]).find(x => x.id === sheet.mid), o = m && m.opts[i];
    if(o && o.grp){   // gruptan yalnızca bir seçim
      const same = m.opts.map((x,j) => x.grp === o.grp ? j : -1).filter(j => j >= 0);
      sheet.sel = sheet.sel.includes(i) && !o.req ? sheet.sel.filter(x => x !== i) : sheet.sel.filter(x => !same.includes(x)).concat([i]);
    } else sheet.sel = sheet.sel.includes(i) ? sheet.sel.filter(x => x !== i) : sheet.sel.concat([i]);
  }
  if(a==='opt-inc' && sheet) sheet.qty = Math.min(50, sheet.qty + 1);
  if(a==='opt-dec' && sheet) sheet.qty = Math.max(1, sheet.qty - 1);
  if(a==='opt-add' && sheet){ const b = DB.get('businesses', curBiz), m = b && (b.menu||[]).find(x => x.id === sheet.mid); const miss = m ? J.optsMissing(m, sheet.sel) : []; if(miss.length){ J.toast(miss[0] + ' seçimi zorunlu.'); return; } }
  if(a==='opt-add' && sheet){ const k = J.cartKey(sheet.mid, sheet.sel); cart[k] = (cart[k]||0) + sheet.qty; sheet = null; J.toast('Sepete eklendi.'); }
  if(a==='inc') cart[id] = (cart[id]||0) + 1;
  if(a==='dec'){ cart[id] = Math.max(0,(cart[id]||0)-1); if(!cart[id]) delete cart[id]; }
  if(a==='reorder'){
    const o = DB.get('orders', id), b = o && DB.get('businesses', o.rid);
    if(!bizOpen(b)){ J.toast('Bu işletme şu an kapalı.'); return; }
    cart = {}; let miss = 0;
    o.items.forEach(i => {
      const m = (b.menu||[]).find(m => m.name === i.name && m.available !== false); if(!m){ miss++; return; }
      const sel = (i.opts||[]).map(n => (m.opts||[]).findIndex(x => x.name === n)).filter(x => x >= 0);
      const k = J.cartKey(m.id, sel); cart[k] = (cart[k]||0) + i.qty;
    });
    curBiz = b.id; orderNote = o.note || '';
    if(miss) J.toast(`${miss} ürün artık satışta değil, sepete eklenmedi.`);
    go(cartCount() ? 'sepet' : 'menu');
  }
  if(a==='order' && isGuest()){ needLogin('sepet'); render(); return; }
  if(a==='order'){
    const b = DB.get('businesses', curBiz);
    if(placing) return;
    if(b && b.min_order > 0 && cartSum(b) < b.min_order){ J.toast(`Bu işletmede minimum sipariş ${J.tl(b.min_order)}.`); return; }
    // Aynı sepetle 1 dakika içinde verilmiş sipariş varsa tekrar oluşturma
    const dup = myOrders().find(o => o.rid === curBiz && o.state === 'aktif' && J.now() - o.created_at < 60000 && o.subtotal === cartSum(b));
    if(dup){ J.toast('Bu siparişi az önce verdin; takip ekranına yönlendiriliyorsun.'); cart = {}; trackId = dup.id; J.store.set('musteri_takip', dup.id); go('takip'); render(); return; }
    placing = true; setTimeout(() => { placing = false; }, 3000);
    if(J.isFull(b) && !sched){ J.toast('İşletme şu an çok yoğun. Birkaç dakika sonra tekrar dene ya da planlı sipariş ver.'); render(); return; }
    const o = J.placeOrder(b, cart, prof, {note: orderNote.trim(), tip, priority: prio, loyalty: true, sched_at: sched, coupon: cdisc(b, cartSum(b)) ? J.activeCoupon(prof).id : null});
    if(o){ cart = {}; orderNote = ''; tip = 0; tipCustom = false; prio = false; sched = null; trackId = o.id; J.store.set('musteri_takip', o.id); J.beep('ok'); go('takip'); }
  }
  if(a==='prio'){ prio = !prio; }
  if(a==='sched-now'){ sched = null; }
  if(a==='sched-later'){ const sl = J.schedSlots(DB.get('businesses', curBiz)); sched = sl[0] || null; if(!sched) J.toast('Uygun saat bulunamadı.'); }
  if(a==='qm'){ const o = DB.get('orders', trackId); if(J.sendMsg(o, 'musteri', J.QUICK_MSGS.musteri[+el.dataset.i])) J.toast('Mesaj gönderildi.'); }
  if(a==='coupon'){ useCoupon = !useCoupon; }
  if(a==='sort') sort = id;
  if(a==='fav' && isGuest()){ needLogin('liste', 'Favorilere eklemek için giriş yap.'); render(); return; }
  if(a==='fav' && prof){ const f = favs(); DB.patch('customers', prof.id, {favs: f.includes(id) ? f.filter(x => x !== id) : f.concat([id])}); J.toast(f.includes(id) ? 'Favorilerden çıkarıldı.' : 'Favorilere eklendi.'); }
  if(a==='addr-pick' && isGuest()){ guestLocate(); return; }
  if(a==='addr-pick'){ addrPick = true; }
  if(a==='addr-acc'){ addrPick = true; go('liste'); }
  if(a==='addr-close'){ addrPick = false; }
  if(a==='addr-use' && prof){ const ad = addrs().find(x => x.id === id); if(ad){ DB.patch('customers', prof.id, {lat:ad.lat, lng:ad.lng, note:ad.note, addr_label:ad.label, addr_id:ad.id, loc_src:'harita'}); J.toast(ad.label + ' adresi seçildi.'); } addrPick = false; }
  if(a==='addr-new'){ addrPick = false; draft = Object.assign({}, prof, {addr_id:null, addr_label:'Ev', note:''}); go('profil'); render(); return; }
  if(a==='addr-edit'){ addrPick = false; const ad = addrs().find(x => x.id === id); draft = Object.assign({}, prof, ad ? {lat:ad.lat, lng:ad.lng, note:ad.note, addr_label:ad.label, addr_id:ad.id} : {}); go('profil'); render(); return; }
  if(a==='addr-del' && prof){ DB.patch('customers', prof.id, {addresses: addrs().filter(x => x.id !== id)}); }
  if(a==='lbl' && draft){ draft.addr_label = el.dataset.v; }
  if(a==='clm-open'){ clm = {id:trackId, open:true, picks:{}, reason:'eksik', note:'', photo:null}; }
  if(a==='clm-close'){ clm.open = false; }
  if(a==='clm-item'){ const i = el.dataset.i, o = DB.get('orders', trackId); if(clm.picks[i]) delete clm.picks[i]; else clm.picks[i] = o.items[i].qty; }
  if(a==='clm-reason'){ clm.reason = el.dataset.v; }
  if(a==='clm-photo-del'){ clm.photo = null; }
  if(a==='clm-send'){ const o = DB.get('orders', trackId); const picks = Object.keys(clm.picks).map(i => ({i:+i, qty:clm.picks[i]}));
    J.openClaim(o, {picks, reason:clm.reason, note:clm.note, photo:clm.photo}).then(ok => { if(ok){ clm.open = false; J.toast('Bildirimin işletmeye iletildi.'); } render(); }); return; }
  if(a==='clm-esc'){ J.escalateClaim(DB.get('orders', trackId)); J.toast('İtirazın yönetime iletildi.'); }
  if(a==='rate-b') rate.biz = +el.dataset.v;
  if(a==='rate-c') rate.cour = +el.dataset.v;
  if(a==='rate-send'){ const o = DB.get('orders', trackId); J.rateOrder(o, rate).then(ok => { if(ok) J.toast('Teşekkürler, değerlendirmen kaydedildi.'); render(); }); return; }
  if(a==='tip'){ const v = el.dataset.v; if(v==='diger'){ tipCustom = true; } else { tipCustom = false; tip = +v; } }
  if(a==='tip-after'){ const o = DB.get('orders', trackId); J.addTip(o, +el.dataset.v).then(ok => { if(ok){ J.toast('Bahşişin kuryene iletildi.'); render(); } }); return; }
  if(a==='track'){ trackId = id; J.store.set('musteri_takip', id); go('takip'); }
  if(a==='notif'){ J.askNotif().then(render); return; }
  if(a==='call'){ const [type, pid] = el.dataset.to.split(':'); J.startCall(me(), {type, id:pid}, trackId); }
  render();
});

// Konum hiç seçilmediyse (varsayılan) telefonun konumunu kendiliğinden al
// Ana sayfada yazılan adres / bulunan konum (bir kez uygulanır)
function applyDraftAddr(){
  if(!prof) return;
  const k = J.store.get('konum_taslak', null), a = J.store.get('adres_taslak', '');
  const patch = {};
  if(k && k.lat != null){ patch.lat = k.lat; patch.lng = k.lng; patch.loc_src = 'gps'; J.autoRelocate(k); }
  if(a && (!prof.note || prof.note === 'Test adresi')) patch.note = a;
  if(Object.keys(patch).length) DB.patch('customers', prof.id, patch);
  J.store.set('konum_taslak', null); J.store.set('adres_taslak', '');
}
let autoLocTried = false;
function autoLocate(){
  if(autoLocTried || !prof || prof.loc_src === 'gps' || prof.loc_src === 'harita' || !navigator.geolocation) return;
  autoLocTried = true;
  navigator.geolocation.getCurrentPosition(p => {
    const pos = {lat:p.coords.latitude, lng:p.coords.longitude};
    DB.patch('customers', prof.id, {lat:pos.lat, lng:pos.lng, loc_src:'gps'});
    J.autoRelocate(pos);
    J.toast('Teslimat noktan konumuna göre ayarlandı.');
  }, () => {}, {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
}
document.addEventListener('change', e => {
  if(e.target.id === 'sched-sel'){ sched = +e.target.value; render(); return; }
  if(e.target.id === 'clm-photo' && e.target.files && e.target.files[0]){
    J.compressImage(e.target.files[0], 720, 0.6).then(d => { clm.photo = d; render(); }).catch(err => J.toast(err.message));
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='q'){ q = e.target.value; render(); return; }
  if(e.target.id==='o-note'){ orderNote = e.target.value; return; }
  if(e.target.id==='rate-note'){ rate.note = e.target.value; return; }
  if(e.target.id==='clm-note'){ clm.note = e.target.value; return; }
  if(e.target.id==='tip-in'){ tip = Math.max(0, Math.min(J.TIP_MAX, parseInt(e.target.value.replace(/\D/g,''),10) || 0)); renderBar(); return; }
  if(!draft) return;
  if(e.target.id==='p-name') draft.name = e.target.value;
  if(e.target.id==='p-note') draft.note = e.target.value;
});
// Yazı yazılırken (not, adres) ekranı yeniden çizme
const typing = () => { const a = document.activeElement; return a && (a.id==='o-note' || a.id==='clm-note' || a.id==='rate-note' || a.id==='tip-in' || a.id==='p-name' || a.id==='p-note'); };
DB.on(() => { if(view !== 'profil' && view !== 'giris' && !typing()) render(); else { renderCall(); renderBar(); } });
setInterval(() => { const m = me(); if(m) J.callTick(m); J.strikeTick(); J.live(); renderCall(); }, 1000);
function guestLocate(){
  if(!navigator.geolocation){ J.toast('Adres seçmek için giriş yap.'); return; }
  J.toast('Konum alınıyor…');
  navigator.geolocation.getCurrentPosition(p => { J.store.set('misafir_konum', {lat:p.coords.latitude, lng:p.coords.longitude}); J.autoRelocate({lat:p.coords.latitude, lng:p.coords.longitude}); render(); J.toast('Yakınındaki işletmeler gösteriliyor.'); },
    () => J.toast('Konum alınamadı. Adres kaydetmek için giriş yap.'), {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
DB.init().then(() => {
  if(!cuid){ view = 'liste'; loadProf(); if(!J.store.get('misafir_konum', null) && !J.store.get('konum_taslak', null) && navigator.permissions) navigator.permissions.query({name:'geolocation'}).then(st => { if(st.state === 'granted') guestLocate(); }).catch(() => {}); openPendingBiz(); }
  else if(loadProf()){ view = 'liste'; applyDraftAddr(); openPendingBiz(); setTimeout(autoLocate, 500); if(trackId){ const o = DB.get('orders', trackId); if(o && o.state==='aktif' && o.customer.id===prof.id) view = 'takip'; } }
  render();
});
J.registerSW();
</script>
